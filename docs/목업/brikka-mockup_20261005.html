            <span class="mn">${x.no} · ${x.ten}</span><span class="mk">${x.st}</span></div>`).join('')}`).join('')}
      </div>`:''}
    </div><span class="sid">CTR-3</span>
    <div class="act">
      <button class="btn" onclick="go('ctr-1')">목록</button></div>
  </div>
  <div class="tabs">
    ${['요약','임차인','청구·수납','원장','임대료·관리비','자료보관'].map(t=>`<button class="${t===tab3c?'on':''}" onclick="tab3c='${t}';render()">${t}</button>`).join('')}
  </div>`;
}
/* CTR-3 청구·수납 탭 — 수납 내역(PAY-6)과 같은 줄을 이 계약 하나로. 미납·연체료가 있는 달은 「상세」로 미납 상세 패널 */
let g7={};
function CTR3month(c,k){
  const yms=[...new Set(BILLS.filter(i=>i.k===k).map(i=>i.ym))].sort().reverse();
  const late=new Set(arrears(c).months.map(m=>m.ym));
  const rows=yms.map(ym=>({ym,x:{...ctrPay(k,ym),k}})).filter(r=>r.x.st);
  /* 합계 — 청구액은 달마다의 청구만 더한다(전월 미납액은 앞 달 청구라 두 번 세지 않는다). 수납액은 실제로 받은 돈 */
  const T=rows.reduce((a,r)=>{const g=rcvSum(r.x);return {bill:a.bill+r.x.bill,paid:a.paid+g.paid};},{bill:0,paid:0});
  if(!rows.length) return `<div class="tbl"><div class="empty"><div class="t">아직 발행한 청구서가 없습니다</div>청구서를 발행하면 달마다 한 줄씩 보입니다.</div></div>`;
  return `<div class="tbl schl">
    <div class="schr ctm hd"><div>청구년월 · 청구항목</div><div class="n">청구액</div><div class="n">수납액</div><div class="n">미납액</div><div class="c">납부상태</div><div class="c">더보기</div></div>
    ${rows.map(r=>rcvRow(r.x,{cls:'ctm',op:!!g7[r.ym],tog:`g7['${r.ym}']=!g7['${r.ym}'];render(true)`,label:`${r.ym.replace('-','년 ')}월분`,ym:r.ym,
      more:late.has(r.ym)?`<span class="more" onclick="event.stopPropagation();openDue('${k}','${r.ym}')">상세</span>`:''})).join('')}
    <div class="schr ctm sum"><div>합계</div><div class="n">${won(T.bill)}</div><div class="n">${won(T.paid)}</div>
      <div class="n">${(v=>v>0?`<span style="color:var(--warn)">${won(v)}</span>`:v<0?`<span style="color:var(--pri)">과납 ${won(-v)}</span>`:'—')(ledgerOf(k).bal.매출채권)}</div><div></div><div></div></div>
  </div>
  <div class="hint">달마다 청구액·수납액·미납액을 봅니다. 줄을 누르면 항목별로 펼쳐집니다. 미납이나 연체료가 있는 달은 더보기의 <b>상세</b>로 그 달의 내역을 봅니다.<br>
    합계의 미납액은 지금 남은 받을 돈(원장 잔액)입니다. 마감한 달의 미납은 다음 달 전월 미납액으로 넘어가므로 달별 미납액을 더한 값과 다를 수 있습니다.<br>
    돈을 기록하는 일(수납 처리 · 환불 · 청구 정정)은 원장 탭에서 합니다.</div>`;
}
/* CTR-3 요약 탭 — 계약·임대 정보. 잔액은 원장에서 */
function CTR3sum(c,k){
  const bn=BUILDINGS.find(x=>x.id===c.b)||BUILDINGS[0], L=ledgerOf(k), end=ctrEnd(c);
  const d8=d=>d.replace(/-/g,'.');

    <div class="card"><div class="ct">임대정보</div><div class="cc"><dl class="dl">
      <dt>미납 잔액</dt><dd>${L.bal.매출채권<0?`<b style="color:var(--pri)">과납 ${won(-L.bal.매출채권)}</b><span class="lock">돌려줄 돈 · 다음 청구서 발행 때 먼저 배분됨</span>`
        :`<b style="${L.bal.매출채권?'color:var(--warn)':''}">${won(L.bal.매출채권)}</b>`}
</dd>
      <dt>보증금 잔액</dt><dd>${won(L.bal.임대보증금)}</dd>
      <dt>임대료</dt><dd>${won(Math.round(ctrAmt(c,'임대료')*1.1))}<span class="lock">월 · 부가세 포함</span></dd>
      <dt>고정관리비</dt><dd>${ctrAmt(c,'고정관리비')?won(Math.round(ctrAmt(c,'고정관리비')*1.1)):'—'}<span class="lock">월 · 부가세 포함</span></dd>
      <dt>청구일 · 납부마감일</dt><dd>${bn.billDay} · ${bn.dueDay}</dd>
      <dt>연체이자율</dt><dd>연 ${rateOf(k)}%</dd>
    </dl></div></div>
  </div>
  <div class="hint">목업의 계약 종료일·유형·보증금은 예시값입니다.</div>`;
}

/* ═══ CTR-3 계약 원장 — 이 계약의 모든 돈 거래를 있는 그대로. 추가만 하고 고치지 않는다 ═══ */
let f3={per:'',acc:''};
const setF3=(k,v)=>{f3[k]=v;render();};
const isTaxItem=n=>{const m=MASTER.find(x=>x.name===n.split(' ')[0]);return m?isTax(m.bill):true;};
function ledgerOf(k){
  const c=CTRS.find(x=>ckey(x)===k), rows=[];
  const rent=((c.it||[]).find(x=>x[0]==='임대료')||[])[1]||0;
  /* 보증금 — 목업 예시값(월 임대료 × 10) */
  /* 새로 등록한 계약은 보증금을 아직 받지 않았다 — 받으면 보증금 예치로 기록한다 */
  if(!c.fresh) rows.push({date:c.base,type:'보증금 예치',acc:'임대보증금',memo:'계약 보증금 (예시값)',item:'계약 보증금 (예시값)',g:'dep',inc:rent*10,sup:null,vat:null,ord:0});
  BILLS.filter(i=>i.k===k).forEach(i=>{
    const tax=isTaxItem(i.n), sup=tax?Math.floor(i.amt*10/11):i.amt;
    const ymL=i.ym.slice(2).replace('-','.')+'월분';
    rows.push({date:i.date||i.ym+'-19',type:'청구',acc:'매출채권',memo:i.memo||`${ymL} ${i.n}`,item:i.memo||`${ymL} ${i.n}`,bid:i.fee?null:i.id,
      g:i.fee?'fee'+i.id:'bill'+i.ym,ym:i.ym,ttl:i.memo,
      inc:i.amt,sup,vat:i.amt-sup,ord:1,pr:prioOf(i.n.split(' ')[0])});
    (PAYEV[i.id]||[]).filter(e=>!e.dep.startsWith('cr')).forEach(e=>rows.push({date:e.date,type:'수납',acc:'매출채권',
      memo:`${i.fee?'연체료':ymL+' '+i.n} ← ${e.src}`,item:i.fee?'연체료':`${ymL} ${i.n}`,src:e.src,g:'pay'+e.dep,dec:e.amt,sup:null,vat:null,ord:2,pr:prioOf(i.n.split(' ')[0]),
      hand:e.dep.startsWith('m'),sq:e.sq}));
  });
  /* 감액 — 받을 돈을 줄인다(대변). 이미 낸 청구라면 잔액이 0보다 작아져 과납이 된다 → CTR-3 */
  CUTS.filter(x=>x.k===k).forEach(x=>{const tax=isTaxItem(x.n), sup=tax?Math.floor(x.amt*10/11):x.amt, t=`${x.ym.slice(2).replace('-','.')}월분 ${x.n} 감액 — ${x.why}`;
    /* 넘친 수납을 과납으로 돌리는 일은 잔액을 바꾸지 않으므로 원장에 적지 않는다 → 2.7 */
    rows.push({date:x.date,type:'감액',acc:'매출채권',memo:t,item:t,g:'cut'+x.sq,dec:x.amt,sup,vat:x.amt-sup,ord:2.2,sq:x.sq});});
  /* 남은 입금 — 청구 건 없이 이 계약에 수납으로 기록한다(과납) → 4.3.4 */
  Object.entries(RC.dec).forEach(([no,x])=>{const d=x.done;if(!d||!(d.rest>0)||d.ok!==k) return;
    rows.push({date:d.dt.slice(0,10),type:'수납',acc:'매출채권',memo:`과납 ← ${d.dt.slice(11,19)} ${d.name}`,item:'과납 (배분할 청구 없음)',src:`${d.dt.slice(11,19)} ${d.name}`,

    g:'rf'+x.sq,inc:x.amt,sup:null,vat:null,ord:3,sq:x.sq}));
  /* 보증금상계 — 같은 돈이 임대보증금에서 빠지고(차변) 매출채권을 채운다(대변) */
  MANUAL_DEP.filter(m=>m.k===k).forEach(m=>rows.push({date:m.date,type:'보증금 차감',acc:'임대보증금',

  /* 청구서 안의 항목은 금액 순 — 화면은 최근이 위로 뒤집으므로 큰 금액이 위에 온다 */
  rows.sort((a,b)=>dnum(a.date)-dnum(b.date)||a.ord-b.ord||(a.sq||0)-(b.sq||0)
    ||(a.type==='청구'&&b.type==='청구'?(a.inc||0)-(b.inc||0):(a.pr||0)-(b.pr||0)));
  const bal={매출채권:0,임대보증금:0};
  rows.forEach(r=>{bal[r.acc]+=(r.inc||0)-(r.dec||0);r.bal=bal[r.acc];
    /* 차변·대변 — 매출채권(자산)은 늘면 차변, 임대보증금(부채)은 늘면 대변 */
    const as=r.acc==='매출채권';r.dr=as?r.inc:r.dec;r.cr=as?r.dec:r.inc;});
  return {c,rows,bal};
