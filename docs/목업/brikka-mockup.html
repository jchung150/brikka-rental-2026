<title>BRIKKA 백오피스</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --canvas:#FFFFFF; --side:#FFFFFF; --side-hov:#F3F4F6; --side-on:#EEF2F6;
  --ink:#111827; --ink-2:#374151; --muted:#6B7280; --faint:#9CA3AF;
  --line:#E5E7EB; --line-2:#F3F4F6; --head:#FFFFFF;
  --pri:#2563EB; --pri-hov:#1D4ED8; --pri-bg:#EFF6FF;
  --ok:#047857; --ok-bg:#ECFDF5; --warn:#B45309; --warn-bg:#FFFBEB;
  --danger:#B91C1C; --danger-bg:#FEF2F2; --neutral:#4B5563; --neutral-bg:#F3F4F6;
  --r:8px; --r-sm:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --canvas:#15181E; --side:#15181E; --side-hov:#1E222A; --side-on:#232833;
  --ink:#E8EAED; --ink-2:#C5CAD3; --muted:#8B93A1; --faint:#6B7280;
  --line:#272C35; --line-2:#1E222A; --head:#15181E;
  --pri:#60A5FA; --pri-hov:#93C5FD; --pri-bg:#172032;
  --ok:#4ADE80; --ok-bg:#132218; --warn:#FBBF24; --warn-bg:#241D0F;
  --danger:#F87171; --danger-bg:#251515; --neutral:#9CA3AF; --neutral-bg:#1E222A;
}}
:root[data-theme="dark"]{
  --bg:#0F1115; --canvas:#15181E; --side:#15181E; --side-hov:#1E222A; --side-on:#232833;
  --ink:#E8EAED; --ink-2:#C5CAD3; --muted:#8B93A1; --faint:#6B7280;
  --line:#272C35; --line-2:#1E222A; --head:#15181E;
  --pri:#60A5FA; --pri-hov:#93C5FD; --pri-bg:#172032;
  --ok:#4ADE80; --ok-bg:#132218; --warn:#FBBF24; --warn-bg:#241D0F;
  --danger:#F87171; --danger-bg:#251515; --neutral:#9CA3AF; --neutral-bg:#1E222A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{flex:none}

/* ── 레이아웃 ── */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;overflow:hidden}
.bh{padding:16px 16px 14px;display:flex;align-items:center;gap:10px}
.bi{width:32px;height:32px;border-radius:var(--r-sm);background:var(--pri);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.bt{line-height:1.25}
.bt .n{font-weight:700;font-size:13.5px}
.bt .s{font-size:11px;color:var(--muted)}
.navsc{flex:1;overflow-y:auto;padding:4px 10px 16px}
.navg{padding:16px 10px 6px;font-size:11px;color:var(--faint);font-weight:500;letter-spacing:.02em}
.nav a,.nav .gh{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);
  cursor:pointer;color:var(--ink-2);font-size:12.5px;margin-bottom:1px;border:0;background:none;
  width:100%;text-align:left;font-family:inherit}
.nav a:hover,.nav .gh:hover{background:var(--side-hov)}
.nav a.on{background:var(--side-on);color:var(--ink);font-weight:500}
.nav a .sid{margin-left:auto;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.nav a svg,.nav .gh svg{color:var(--muted)}
.nav a.on svg{color:var(--pri)}
.nav .gh .cv{margin-left:auto;transition:transform .16s;color:var(--faint)}
.nav .gh.open .cv{transform:rotate(90deg)}
.nav .gh.hasOn{color:var(--ink);font-weight:500}
.nsub{overflow:hidden;position:relative}
.nsub::before{content:'';position:absolute;left:19px;top:2px;bottom:2px;width:1px;background:var(--line)}
.nsub a{padding-left:34px;font-size:12px;color:var(--muted)}
.nsub a:hover{color:var(--ink-2)}
.nsub a.on{color:var(--ink)}
.nsub a .sid{font-size:10px}
.sf{border-top:1px solid var(--line);padding:8px 10px 10px;position:relative}
.sfi{display:flex;align-items:center;justify-content:space-between;padding:0 2px 6px}
.ib{border:0;background:none;padding:7px;border-radius:var(--r-sm);cursor:pointer;color:var(--muted);
  display:flex;position:relative}
.ib:hover{background:var(--side-hov);color:var(--ink-2)}
.ib .dot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:#EF4444}
.me{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:var(--r-sm);cursor:pointer}
.me:hover{background:var(--side-hov)}
.me .av{width:26px;height:26px;border-radius:var(--r-sm);background:var(--neutral-bg);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.me .mt{line-height:1.3;min-width:0;flex:1}
.me .mt .a{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .mt .b{font-size:10.5px;color:var(--muted)}
.me .ch{color:var(--faint);font-size:11px}
.nw{position:absolute;bottom:52px;left:10px;width:318px;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.14);z-index:40;overflow:hidden}
.nw .nh{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line-2)}
.nw .nh b{font-size:12.5px}
.nw .nh .cl{margin-left:auto;font-size:11px;color:var(--muted);cursor:pointer}
.nw .nh .cl:hover{color:var(--ink-2)}
.nw .ni{display:flex;gap:9px;padding:10px 14px;border-bottom:1px solid var(--line-2);cursor:pointer}
.nw .ni:last-child{border-bottom:0}
.nw .ni:hover{background:var(--side-hov)}
.nw .ni .nb{flex:1;min-width:0}
.nw .ni .nt{font-size:12px;font-weight:500;margin-bottom:2px}
.nw .ni .nd{font-size:11px;color:var(--muted);line-height:1.5}
.nw .ni .ng{font-size:10.5px;color:var(--faint);white-space:nowrap}

/* PAY-10 정산 */
.fbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.fbar select{border:1px solid var(--line);background:var(--bg);padding:8px 11px;border-radius:var(--r-sm);
  font-size:12.5px;min-width:150px}
.stepv{display:flex;gap:0;margin-bottom:18px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stepv .sp2{flex:1;padding:11px 14px;border-right:1px solid var(--line);cursor:pointer;background:var(--bg)}
.stepv .sp2:last-child{border-right:0}
.stepv .sp2:hover{background:var(--side-hov)}
.stepv .sp2.on{background:var(--pri-bg)}
.stepv .sp2 .t{font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.stepv .sp2.on .t{color:var(--pri)}
.stepv .sp2 .d{font-size:11.5px;color:var(--muted);margin-top:2px}
.stepv .sp2 .nm{width:17px;height:17px;border-radius:50%;background:var(--neutral-bg);color:var(--muted);
  font-size:10.5px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.stepv .sp2.on .nm{background:var(--pri);color:#fff}
.stepv .sp2.dn .nm{background:var(--ok-bg);color:var(--ok)}
.itab{display:flex;gap:6px;margin-bottom:14px}
.itab button{border:1px solid var(--line);background:var(--bg);padding:6px 13px;border-radius:99px;
  cursor:pointer;font-size:12.5px;color:var(--ink-2);font-family:inherit}
.itab button.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:500}
.inp{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:5px 9px;
  font-size:12.5px;width:92px;text-align:right;font-variant-numeric:tabular-nums}
.inp:focus{outline:0;border-color:var(--pri)}
.inp.w{width:76px}
.inp.why{width:100%;text-align:left;font-size:12px}

tr.dim td{color:var(--muted)}
tr.sumr td{background:var(--head);font-weight:700;border-top:1px solid var(--line)}
tr.vacr td{background:var(--warn-bg)}
tr.exr td{background:var(--line-2);color:var(--muted)}
.vfy{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--r);
  border:1px solid var(--line);margin-top:14px;font-size:12.5px;flex-wrap:wrap}
.vfy.ok{background:var(--ok-bg);border-color:var(--ok)}
.vfy.no{background:var(--warn-bg);border-color:var(--warn)}
.vfy b{font-variant-numeric:tabular-nums}
.vfy .ttl{font-weight:700}
.vfy.ok .ttl{color:var(--ok)} .vfy.no .ttl{color:var(--warn)}
.fnd{background:var(--pri-bg);border:1px solid var(--pri);border-left-width:3px;border-radius:var(--r);
  padding:12px 15px;font-size:12.5px;color:var(--ink-2);margin:14px 0;line-height:1.65}
.fnd b{color:var(--pri)}
.fnd .h{font-weight:700;color:var(--pri);display:block;margin-bottom:4px}

/* 우측 슬라이드 패널 */
.dro{position:fixed;inset:0;z-index:100}
.dro .ov{position:absolute;inset:0;background:rgba(15,20,28,.35);animation:fadein .16s}
.dro .pn{position:absolute;right:0;top:0;bottom:0;width:440px;max-width:100%;background:var(--bg);
  border-left:1px solid var(--line);box-shadow:-10px 0 36px rgba(0,0,0,.16);
  display:flex;flex-direction:column;animation:slidein .2s cubic-bezier(.32,.72,0,1)}
@keyframes slidein{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.dro .dh{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.dro .dh .t{font-size:15px;font-weight:700}
.dro .dh .s{font-size:12px;color:var(--muted);margin-top:3px}
.dro .dh .x{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;
  font-size:19px;line-height:1;padding:2px 6px;border-radius:var(--r-sm)}
.dro .dh .x:hover{background:var(--side-hov);color:var(--ink)}
.dro .db{flex:1;overflow-y:auto;padding:14px 20px 20px}
.dro .df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.pick{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);
  border-radius:var(--r);margin-bottom:6px;cursor:pointer}
.pick:hover{border-color:var(--muted)}
.pick.on{border-color:var(--pri);background:var(--pri-bg)}
.pick .ck{width:17px;height:17px;border:1.5px solid var(--line);border-radius:4px;flex:none;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px}
.pick.on .ck{background:var(--pri);border-color:var(--pri)}
.pick .pb{flex:1;min-width:0}
.pick .pn2{font-weight:500;font-size:13px}

/* 건물 전환 */
.bsw{position:relative;display:inline-flex;align-items:center;gap:9px}
.bsw h1{margin:0}
.bsw .bt2{display:inline-flex;align-items:center;gap:5px;cursor:pointer;
  border:1px solid var(--line);background:var(--bg);font-family:inherit;
  padding:5px 9px 5px 10px;border-radius:99px;font-size:11.5px;color:var(--muted);font-weight:500}
.bsw .bt2:hover{border-color:var(--pri);color:var(--pri);background:var(--pri-bg)}
.bsw .bt2.open{border-color:var(--pri);color:var(--pri);background:var(--pri-bg)}
.bsw .bt2 svg{transition:transform .15s}
.bsw .bt2.open svg{transform:rotate(180deg)}
.bsw .menu{position:absolute;top:100%;left:0;margin-top:8px;min-width:300px;background:var(--bg);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.13);
  z-index:30;overflow:hidden;padding:5px}
.bsw .menu .mi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);
  cursor:pointer;font-size:12.5px}
.bsw .menu .mi:hover{background:var(--side-hov)}
.bsw .menu .mi.on{background:var(--pri-bg)}
.bsw .menu .mi .mn{font-weight:500;flex:1}
.bsw .menu .mi.on .mn{color:var(--pri)}
.bsw .menu .mi .mk{font-size:11.5px;color:var(--muted)}
.bsw .menu .hd{font-size:11px;color:var(--faint);padding:6px 10px 4px}

/* 진행 현황 */
.pgrid td.st{cursor:pointer}
.pgrid td.st:hover{background:var(--pri-bg)}
.stp{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.stp .dot2{width:6px;height:6px;border-radius:50%;flex:none}
.bar{height:5px;background:var(--line-2);border-radius:99px;overflow:hidden;margin-top:4px;width:84px}
.bar > i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bar.part > i{background:var(--warn)}

/* 설정 패널 */
.fg{margin-bottom:18px}
.fg .fl{font-size:11px;color:var(--faint);font-weight:500;letter-spacing:.02em;
  padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.fr{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
.fr .fk{width:104px;color:var(--muted);flex:none}
.fr select,.fr input[type=text],.fr input[type=date]{flex:1;border:1px solid var(--line);
  background:var(--bg);padding:6px 9px;border-radius:var(--r-sm);font-size:12.5px;font-family:inherit}
.fr .fv{flex:1}
.ulist{border:1px solid var(--line);border-radius:var(--r-sm);max-height:196px;overflow-y:auto}
.ulist .ur{display:flex;align-items:center;gap:9px;padding:7px 11px;cursor:pointer;
  border-bottom:1px solid var(--line-2);font-size:12.5px}
.ulist .ur:last-child{border-bottom:0}
.ulist .ur:hover{background:var(--side-hov)}
.ulist .ur.on{background:var(--pri-bg)}
.ulist .ur .ck2{width:15px;height:15px;border:1.5px solid var(--line);border-radius:3px;flex:none;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px}
.ulist .ur.on .ck2{background:var(--pri);border-color:var(--pri)}
.ulist .ur .un2{font-weight:500;width:52px;flex:none}
.ulist .ur .ut2{color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ulist .ur .ua2{color:var(--faint);font-variant-numeric:tabular-nums}
.utool{display:flex;gap:6px;align-items:center;margin-bottom:7px;font-size:11.5px;color:var(--muted)}
.utool button{border:1px solid var(--line);background:var(--bg);padding:3px 9px;border-radius:99px;
  cursor:pointer;font-size:11.5px;color:var(--ink-2);font-family:inherit}
.utool button:hover{background:var(--side-hov)}
.utool .cnt2{margin-left:auto}
.prev{background:var(--pri-bg);border:1px solid var(--pri);border-left-width:3px;
  border-radius:var(--r-sm);padding:11px 13px;font-size:12px;line-height:1.7;color:var(--ink-2)}
.prev .pt{font-weight:700;color:var(--pri);font-size:11.5px;margin-bottom:5px}
.prev b{color:var(--ink)}
.warn2{background:var(--warn-bg);border-color:var(--warn)}
.warn2 .pt{color:var(--warn)}

/* 고지서 입력 표 */
table.bt2 td{padding:9px 12px}
.inp.lg{width:120px;font-weight:500}
.inp.d{width:130px;text-align:left;font-size:12px}
.inp .u,.n .u{color:var(--muted);font-size:11.5px}
.btn.ex{color:var(--muted);padding:4px 10px;font-size:11.5px}
.btn.ex:hover{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}

/* 접힘 상태 */
.app.fold .side{width:62px}
.app.fold{grid-template-columns:62px 1fr}
.app.fold .bh{padding:14px 0;justify-content:center}
.app.fold .bt,.app.fold .navg,.app.fold .me .mt,.app.fold .me .ch{display:none}
.app.fold .nsub::before{display:none}
.app.fold .sfi{flex-direction:column;gap:2px;padding-bottom:4px}
.app.fold .me{justify-content:center;padding:7px 0}
.app.fold .nw{left:calc(100% + 8px);bottom:10px}
.app.fold .nav a,.app.fold .nav .gh{justify-content:center;padding:9px 0;gap:0}
.app.fold .nav a span,.app.fold .nav .gh span,.app.fold .nav .cv{display:none}
.app.fold .nsub{display:none!important}
.app.fold .nav a,.app.fold .nav .gh{position:relative}
.app.fold .nav a:hover::after,.app.fold .nav .gh:hover::after{
  content:attr(data-n);position:absolute;left:52px;top:50%;transform:translateY(-50%);
  background:var(--ink);color:var(--bg);padding:5px 10px;border-radius:var(--r-sm);font-size:12px;
  white-space:nowrap;z-index:20;pointer-events:none}
.op{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer}
.op:hover{background:var(--side-hov)}
.op .av{width:28px;height:28px;border-radius:var(--r-sm);background:var(--neutral-bg);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.op .ot{line-height:1.3;min-width:0}
.op .ot .a{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op .ot .b{font-size:11px;color:var(--muted)}
.op.test .av{background:var(--warn-bg);color:var(--warn)}
.op.test .ot .a{color:var(--warn)}

.main{min-width:0;background:var(--canvas)}
.top{padding:14px 28px 0;display:flex;align-items:flex-start;gap:16px}
.crumb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.crumb .c{cursor:pointer}.crumb .c:hover{color:var(--ink-2)}
.crumb b{color:var(--ink-2);font-weight:400}
.top .sp{flex:1}
.mock{font-size:11px;color:var(--warn);background:var(--warn-bg);padding:3px 9px;border-radius:99px;font-weight:500}
.wrap{padding:6px 28px 64px;max-width:1560px}
.ph{display:flex;align-items:center;gap:10px;margin:2px 0 18px;flex-wrap:wrap}
.ph h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.ph .sid{font-size:10.5px;color:var(--muted);background:var(--neutral-bg);padding:2px 8px;border-radius:99px;font-weight:500}
.ph .act{margin-left:auto;display:flex;gap:8px}

/* ── 부품 ── */
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink-2);padding:7px 13px;
  border-radius:var(--r-sm);cursor:pointer;font-size:12.5px;white-space:nowrap;display:inline-flex;
  align-items:center;gap:6px;font-weight:500}
.btn:hover{background:var(--side-hov)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-hov)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.gh{border-color:transparent;background:none;color:var(--muted)}
.btn.gh:hover{background:var(--side-hov);color:var(--ink-2)}

.sbar{display:flex;gap:10px;margin-bottom:16px}
.sin{flex:1;display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:var(--r);
  padding:0 14px;background:var(--bg)}
.sin:focus-within{border-color:var(--pri)}
.sin input{flex:1;border:0;outline:0;background:none;padding:9px 0;font-size:12.5px}
.sin input::placeholder{color:var(--faint)}
.sin svg{color:var(--faint)}

.tbl{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--head);text-align:left;padding:10px 14px;font-size:11.5px;font-weight:500;color:var(--muted);
  border-bottom:1px solid var(--line);white-space:nowrap}
th .so{color:var(--faint);margin-left:3px;font-size:10px}
td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--side-hov)}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
.c1{font-weight:500;color:var(--ink);white-space:nowrap}
.cn{white-space:nowrap;font-size:12.5px}
.cn b{font-weight:500;color:var(--ink)}
.cn i{color:var(--faint);font-style:normal;margin:0 1px}
.c2{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap}
.det{color:var(--muted);font-size:12px;cursor:pointer}
.det:hover{color:var(--pri)}

    const r=reading(m.code,u.no);
    const use=r?r[1]-r[0]:0;
    const aj=b.adj[u.no];
    const mul=raw?1:((aj&&Number.isFinite(aj.mul))?aj.mul:1);  /* 0을 1로 되돌리지 않는다 */
    return {...u,pm:r?r[0]:null,cm:r?r[1]:null,hasM,typed:!!r,use,mul,excl:ex[u.no]||null};
  });
  /* 공용분은 안분 제외를 뺀 전 유닛이 부담한다 */
  const inTarget=r=>!r.excl;
  rows.forEach(r=>{ r.aUse = r.excl?0:r.use; });
  /* ② */
  const sumUse=rows.reduce((a,r)=>a+(r.excl?0:r.aUse),0);
  const totUse=b.use||0;
  const common=charge? totUse-sumUse : totUse;
  /* ④⑤⑥ */
  const base=r=>byUse? r.use : r.ar;
  const wSum=rows.reduce((a,r)=>a+(inTarget(r)? base(r)*r.mul : 0),0);
  rows.forEach(r=>{
    r.w=inTarget(r)? base(r)*r.mul : 0;
    r.common=wSum? common*r.w/wSum : 0;
    r.tot=r.excl?0:((charge&&r.hasM? r.use : 0)+r.common);
    r.ratio=r.excl?0:(totUse?r.tot/totUse:(wSum?r.w/wSum:0));
  });
  return {rows,sumUse,common,wSum,totUse,charge,byUse};
}
/* ⑦ */
/* ⑥ 유닛 청구금액 — 4.1.2 · 잔차 처리 4.1.8
   유닛별로 원 미만을 절사하므로 합계가 고지서보다 몇 원 적다.
   남은 잔차는 「배분 비율이 가장 큰 유닛」에 더한다. 그래야 합계가 고지서와 정확히 일치한다. */
function calc(m,raw){
  const base=ratios(m,raw), amt=billTotal(m);
  const rows=base.rows.map(r=>({...r, amt:Math.floor(amt*r.ratio), rnd:0}));
  const rem=amt-rows.reduce((a,r)=>a+r.amt,0);    /* 절사 잔차. 언제나 0 이상 */
  if(rem>0){
    let k=-1,best=-1;
    rows.forEach((r,i)=>{ if(!r.excl && r.ratio>best){best=r.ratio;k=i;} });
    if(k>=0){ rows[k].amt+=rem; rows[k].rnd=rem; }
  }
  const bill=rows.filter(r=>r.st==='사용중'&&!r.excl).reduce((a,r)=>a+r.amt,0);
  const vac =rows.filter(r=>r.st!=='사용중'&&!r.excl).reduce((a,r)=>a+r.amt,0);
  return {...base,rows,bill,vac,total:amt,diff:amt-(bill+vac),rem};
}

/* ── 2단계 · 검침 ── */
function setRead(code,no,v){
  const b=BILL[code], n=Math.max(0,Math.round(parseFloat(String(v).replace(/[,\s]/g,''))||0));
  if(b.read&&b.read[no]) b.read[no][1]=n;
  render(true);
}
const TODAY_ISO=TODAY.toISOString().slice(0,10);
/* 검침일은 유닛별로 다를 수 있다. 기본값은 당일이며 일괄 적용으로 한 번에 맞춘다. */
const readDateOf=(code,no)=>{const b=BILL[code];return (b.readDates&&b.readDates[no])||b.readDate||TODAY_ISO;};
function setReadDate(code,v){const b=BILL[code];b.readDate=v;b.readDates={};render(true);}
function setReadDateUnit(code,no,v){const b=BILL[code];(b.readDates=b.readDates||{})[no]=v;render(true);}
/* 전 유닛을 나열한다. 계량기가 없는 유닛은 행은 보이되 입력이 잠긴다.
   어느 유닛에 계량기가 있는지가 화면에서 그대로 읽히도록 한다. */
function stRead(m,R){
  const b=BILL[m.code], st=resolve(m.code), U=m.unit||'';
  const rows=R.rows.filter(r=>!r.excl);
  const mtr=rows.filter(r=>r.hasM);
  const noM=rows.filter(r=>!r.hasM);
  const todo=mtr.filter(r=>!r.typed).length;
  const dash='<span style="color:var(--faint)">—</span>';
  return `
  <div class="card"><div class="ct">검침 입력${todo?` <span class="bd wa">미입력 ${todo}개</span>`:''}
    <span class="ca">
      <span style="font-size:12px;color:var(--muted);margin-right:6px">검침일 일괄 적용</span>
      <input class="inp d" type="date" value="${b.readDate||TODAY_ISO}" onchange="setReadDate('${m.code}',this.value)">
      <button class="btn sm">엑셀 업로드</button></span></div>
    <div class="tw"><table>
      <thead><tr><th>계약고유명</th><th>검침일</th>
        <th class="n">직전 검침값</th><th class="n">당월 검침값</th><th class="n">개별 사용량</th></tr></thead>
      <tbody>${rows.map(r=>r.hasM?`<tr>
        <td>${cnameST(r,m)}</td>
        <td><input class="inp d" type="date" value="${readDateOf(m.code,r.no)}"
            onchange="setReadDateUnit('${m.code}','${r.no}',this.value)"></td>
        <td class="n" style="color:var(--muted)">${r.pm!=null?num(r.pm):dash}</td>
        <td class="n"><input class="inp" type="number" value="${r.cm!=null?r.cm:''}" placeholder="미입력"
            onchange="setRead('${m.code}','${r.no}',this.value)"></td>
        <td class="n">${r.typed?`<b>${num(r.use)}</b> <span class="u">${U}</span>`:dash}</td></tr>`

      </tbody></table></div>

    계량기가 없는 유닛은 행은 보이되 입력이 잠긴다.
    공용 사용량 <b>${fx(R.common)} ${U}</b>은 계량기 유무와 무관하게
    <b>전 유닛</b>이 ${st.basis} 비율로 나눠 부담한다.<br>
    <b>직전 검침값</b>은 직전 정산 회차의 당월 검침값이며 수정할 수 없다.
    격월·반기 항목은 직전 회차가 전월이 아니다.<br>
    검침 기록은 원본이며 수정하지 않는다. 부담을 조정하려면 3단계에서 조정 배수를 기록한다.<br>
    <b>검침일</b>은 유닛마다 다를 수 있다. 기본값은 당일이며, 한 날에 몰아서 검침했다면
    상단 <b>일괄 적용</b>으로 전 유닛을 한 번에 맞춘다.</div>`;

/* ── 3단계 · 조정 ── */
/* 배수는 공용 사용량 배분 가중치에만 작용한다 → 4.1.2
   「증감」의 기준선은 전 유닛 배수 1.0인 상태이며, 그래서 증감 합계는 언제나 0이다. */
function stAdj(m,R){
  const U=m.unit||'', st=resolve(m.code), B=calc(m,true);   /* B = 배수 1.0 기준선 */
  const rows=R.rows.filter(r=>!r.excl);
  if(!rows.length) return `<div class="tbl"><div class="empty">
    <div class="t">조정할 대상이 없습니다</div>${m.name}은 조정 가능한 유닛이 없습니다.</div></div>`;
  const bb=B.rows.reduce((o,r)=>(o[r.no]=r,o),{});
  const showUse=isMetered(m.code)&&R.charge;
  const c2=R.byUse?'개별 사용 비율':'면적 비율';
  const base=r=>R.byUse?r.use:r.ar;
  const bSum=B.rows.filter(r=>!r.excl).reduce((a,r)=>a+base(r),0);
  /* 사용량 개념이 없는 항목(정화조청소비·교통유발부담금 등)은 금액으로 표시한다.
     사용량 열을 두면 전부 0으로 나와 배수가 무엇을 바꾸는지 보이지 않는다. */
  const amtMode=!m.unit, TOT=billTotal(m);
  const cV =amtMode?'배분 금액':'공용 사용량';
  const pre=r=>amtMode?won(bb[r.no].amt):fx(bb[r.no].common);
  const now=r=>amtMode?won(r.amt)       :fx(r.common)+' '+U;
  const dOf=r=>amtMode?(r.amt-bb[r.no].amt):(r.common-bb[r.no].common);
  const big=d=>amtMode?Math.abs(d)>=1:Math.abs(d)>0.05;
  const dTx=d=>(d>0?'+':'−')+(amtMode?won(Math.abs(d)):fx(Math.abs(d)));
  const dSum=rows.reduce((a,r)=>a+dOf(r),0);
  return `
  <div class="card"><div class="ct">조정
    <span class="sub">${amtMode?`고지서 금액 <b>${won(TOT)}</b>`
       :`공용 사용량 합계 <b>${fx(R.common)} ${U}</b>`} · ${st.basis} 비율</span></div>
    <div class="tw"><table>
      <thead><tr><th>계약고유명</th>
        ${showUse?'<th class="n">개별 사용량</th>':''}
        <th class="n">${cV}</th><th class="n">${c2}</th><th class="c">조정 배수</th>
        <th class="n">증감</th><th class="n">(조정후) ${cV}</th></tr></thead>
      <tbody>${rows.map(r=>{const d=dOf(r);return `<tr${r.mul===0?' class="vacr"':''}>
        <td>${cnameST(r,m)}</td>
        ${showUse?`<td class="n">${r.hasM?`${num(r.use)} <span class="u">${U}</span>`
          :'<span style="color:var(--faint)">—</span>'}</td>`:''}
        <td class="n" style="color:var(--muted)">${pre(r)}</td>
        <td class="n" style="color:var(--muted)">${bSum?(base(r)/bSum*100).toFixed(2)+'%':'—'}</td>
        <td class="c"><input class="inp w" value="${r.mul}" step="0.1" min="0" type="number"
             onchange="setMul('${m.code}','${r.no}',this.value)"></td>
        <td class="n">${big(d)?`<span class="dlt ${d>0?'up':'dn'}">${dTx(d)}</span>`
          :'<span style="color:var(--faint)">—</span>'}</td>
        <td class="n">${r.mul===0?'<span class="bd mu">부담 없음</span>':`<b>${now(r)}</b>`}</td></tr>`}).join('')}
        <tr class="sumr"><td>합계</td>
          ${showUse?`<td class="n">${fx(rows.reduce((a,r)=>a+r.use,0))} ${U}</td>`:''}
          <td class="n">${amtMode?won(rows.reduce((a,r)=>a+bb[r.no].amt,0)):fx(B.common)}</td>
          <td class="n">100.00%</td><td></td>
          <td class="n">${(v=>big(v)?dTx(v):(amtMode?won(0):fx(0)))(dSum)}</td>
          <td class="n">${amtMode?won(rows.reduce((a,r)=>a+r.amt,0)):fx(R.common)+' '+U}</td></tr>
      </tbody></table></div>
  </div>
  <div class="hint">
    ${amtMode?`이 항목은 사용량을 재지 않는다. 고지서 금액 <b>${won(TOT)}</b>을
      ${st.basis} 비율로 나눈다.`
     :`검침값은 실측이므로 고치지 않는다. 배수는 <b>공용 사용량을 나누는 비율에만</b> 작용한다.`}
    배수는 기본값 <b>1.0</b>, 0.1 단위로 조정한다.<br>
    배수를 올린 유닛이 더 부담한 만큼 나머지 유닛이 덜 부담한다.
    <b>증감 합계는 언제나 0</b>이고 ${amtMode?`고지서 금액 <b>${won(TOT)}</b>`
      :`공용 사용량 합계 <b>${fx(R.common)} ${U}</b>`}도 변하지 않는다.<br>
    <b>배수 0</b>은 그 유닛이 부담하지 않는다는 뜻이다. 공실·비운영중을 빼는 수단이다.</div>`;
}

/* ── 4단계 · 산출 결과 ── */
function stResult(m,R){
  const b=BILL[m.code];
  return `
  <div class="card"><div class="ct">산출 결과
    <span class="sub">${m.name} · ${resolve(m.code).basis} 비율 배분${
      (resolve(m.code).ref&&resolve(m.code).ref!==m.code)?` · 기준 ${M(resolve(m.code).ref).name}`:''}</span></div>
    <div class="tw"><table>
      <thead><tr><th>계약고유명</th>
        ${R.charge&&isMetered(m.code)?'<th class="n">개별 사용량</th>':''}
        ${m.unit?'<th class="n">공용 사용량</th><th class="n">유닛 총사용량</th>':''}
        <th class="n">배분 비율</th><th class="n">청구금액</th></tr></thead>
      <tbody>
        ${R.rows.filter(r=>r.st==='사용중').map(r=>row4(r,m)).join('')}
        ${R.rows.filter(r=>r.st!=='사용중').map(r=>row4(r,m,'vacr')).join('')}
        <tr class="sumr"><td>합계</td>
          ${R.charge&&isMetered(m.code)?`<td class="n">${fx(R.sumUse)}</td>`:''}
          ${m.unit?`<td class="n">${fx(R.common)}</td>
            <td class="n">${fx(R.rows.reduce((a,r)=>a+r.tot,0))}</td>`:''}
          <td class="n">100.0%</td>
          <td class="n">${won(R.bill+R.vac)}</td></tr>
      </tbody></table></div>
  </div>
  <div class="vfy ${R.diff===0?'ok':'no'}">
    <span class="ttl">${R.diff===0?'검증 일치':'검증 불일치'}</span>
    <span>임차인 <b>${won(R.bill)}</b></span><span style="color:var(--muted)">+</span>
    <span>공실·미청구 <b>${won(R.vac)}</b></span><span style="color:var(--muted)">=</span>
    <span><b>${won(R.bill+R.vac)}</b></span>
    <span style="color:var(--muted)">고지서 <b>${won(R.total)}</b></span>
    ${R.diff?`<span style="margin-left:auto;font-weight:700;color:var(--warn)">차액 ${num(R.diff)}원</span>`:''}
  </div>
  <div class="hint">
    <b>개별 사용량</b> = 당월 − 전월. 그 유닛이 직접 쓴 양이며 배수를 곱하지 않는다.<br>
    ${!m.unit?`이 항목은 사용량을 재지 않는다. 고지서 금액 <b>${won(R.total)}</b>을
      ${resolve(m.code).basis} 비율로 나눈다. 3단계 조정 배수가 반영된 비율이다.`
     :`<b>개별 사용량</b> = 당월 − 직전 검침값. 계량기가 실측한 전용부 사용량이다.<br>
    <b>공용 사용량</b> = (고지서 총사용량 − Σ개별 사용량) × 그 유닛 배분 비율.
    복도·승강기·화장실 등 공용부 사용분이며 계량기 유무와 무관하게 전 유닛이 부담한다.<br>
    <b>유닛 총사용량</b> = 개별 사용량 + 공용 사용량. 이 비율대로 고지서 금액을 나눈다.`}</div>
  `;
}
function row4(r,m,cls){
  const R=ratios(m), showM=R.charge&&isMetered(m.code);
  if(r.excl) return `<tr class="exr">
    <td>${cnameST(r,m)}</td>
    ${showM?'<td class="n">—</td>':''}
    ${m.unit?'<td class="n">—</td><td class="n">—</td>':''}<td class="n">—</td>
    <td class="n"><span class="bd mu">안분 제외</span>
      <div class="c2" style="text-align:right">${r.excl.why}</div></td></tr>`;
  return `<tr class="${cls||''}">
    <td>${cnameST(r,m)}</td>
    ${showM?`<td class="n">${r.hasM?fx(r.use):'—'}</td>`:''}
    ${m.unit?`<td class="n">${r.common?fx(r.common):'<span style="color:var(--faint)">—</span>'}</td>
      <td class="n"><b>${fx(r.tot)}</b></td>`:''}
    <td class="n">${(r.ratio*100).toFixed(2)}%</td>
    <td class="n"><b>${won(r.amt)}</b>${r.rnd?`<span class="lock">절사 +${r.rnd}원</span>`:''}</td></tr>`;
}

/* ═══ PAY-12 청구·수납 개요 ═══ */
function PAY12(){

  const rows=BUILDINGS.map(b=>{

    return `<tr>

    <b>미납이 남아 있어도 마감한다.</b> 미납액은 채권으로 이월된다.</div>`;
}

 {b:'b1',no:'501호',ten:'법무법인 정도',st:'진행중',base:'2023-09-01',

      ['정화조청소비'],['교통유발부담금'],['주차비']]},
 {b:'b1',no:'601호',ten:'(주)엔코어테크',st:'진행중',base:'2025-05-01',

 {b:'b1',no:'801호',ten:'코어스페이스',st:'진행중',base:'2024-03-01',
  it:[['임대료',9_452_000],['고정관리비',1_818_000],['전기요금'],['수도요금'],['정화조청소비']]},
 {b:'b2',no:'1203호',ten:'(주)세움파트너스',st:'진행중',base:'2025-02-01',
  it:[['임대료',7_800_000],['고정관리비',1_450_000],['전기요금'],['수도요금']]},
 {b:'b2',no:'1501호',ten:'리틀브릿지',st:'종료됨',base:'2023-02-01',
  it:[['임대료',6_200_000],['고정관리비',1_180_000],['전기요금'],['수도요금']]},
];
let f1={b:'',st:'진행중',it:'',calc:''};
let g1={}, g1All=false;                 /* 계약별 펼침 상태. 기본은 접힘 */
const setF1=(k,v)=>{f1[k]=v;render()};
/* 항목 필터가 걸려 있으면 자동으로 펼친다 — 거른 항목을 보려는 것이므로 */
const gAuto=()=>g1All||!!(f1.it||f1.calc);
const gOpen=k=>(k in g1)?g1[k]:gAuto();
const gTog=k=>{g1[k]=!gOpen(k);render(true)};
const gAll=v=>{g1All=v;g1={};render(true)};

function PAY1(){
  const BN=id=>(BUILDINGS.find(x=>x.id===id)||{}).name||id;
  const BA=id=>(BUILDINGS.find(x=>x.id===id)||{}).alias||'';
  const ST={진행중:'ok',준비중:'wa',종료됨:'mu',파기됨:'mu'};
  const ctrs=CTRS
    .filter(c=>(!f1.b||c.b===f1.b)&&(!f1.st||c.st===f1.st))
    .map(c=>({...c,k:c.b+c.no,it:c.it.filter(x=>(!f1.it||x[0]===f1.it)&&(!f1.calc||CITEM[x[0]].calc===f1.calc))}))
    .filter(c=>c.it.length);
  const fixedOf=c=>c.it.filter(x=>CITEM[x[0]].cycle==='매월'&&x[1]).reduce((a,x)=>a+x[1],0);
  const body=ctrs.map(c=>{
    const op=gOpen(c.k), fixed=fixedOf(c);
    const nF=c.it.filter(x=>CITEM[x[0]].calc==='고정액').length;
    const nS=c.it.length-nF;
    return `
    <tr class="grp ${op?'op':''}" onclick="gTog('${c.k}')">
      <td>
        <span class="tg">${op?'▾':'▸'}</span>
        ${cnameHTML(BA(c.b),c.no,c.ten)}
        <span class="bd ${ST[c.st]||'mu'}">${c.st}</span>
        <div class="c2 gsum">${BN(c.b)} · 기산일 ${c.base}
          <span style="color:var(--faint)">· ${nF?`고정액 ${nF}`:''}${nF&&nS?' · ':''}${nS?`정산 ${nS}`:''}
          · ${c.it.map(x=>x[0]).join(', ')}</span></div>
        <div class="c2 gsub">${BN(c.b)} · 기산일 ${c.base}</div></td>
      <td></td><td></td><td></td><td></td>
      <td class="n">${fixed?`<b>${won(fixed)}</b>`:'<span style="color:var(--faint)">—</span>'}
        <div class="c2">${fixed?'월 고정액':'고정액 없음'}</div></td>
      <td class="n c2">${nS?`정산 ${nS}건 별도`:''}</td>
    </tr>` + (!op?'':c.it.map(x=>{const d=CITEM[x[0]];return `
    <tr class="sub" onclick="go('ctr-3')">
      <td class="ind">${x[0]}</td>
      <td><span class="bd ${d.calc==='정산'?'wa':'mu'}">${d.calc}</span></td>
      <td>${d.cycle}</td>
      <td>${x[2]||c.base}</td>
      <td class="c">${d.tax?'과세':'<span style="color:var(--muted)">면세</span>'}</td>
      <td class="n">${d.calc==='정산'?'<span class="bd wa">정산</span>':`<b>${won(x[1])}</b>`}</td>
      <td class="n c2">${d.calc==='정산'?'회차마다 산출 → PAY-10':''}</td>
    </tr>`}).join(''));
  }).join('');
  const nI=ctrs.reduce((a,c)=>a+c.it.length,0);
  const mFix=ctrs.reduce((a,c)=>a+fixedOf(c),0);
  const anyOpen=ctrs.some(c=>gOpen(c.k));
  return `
  <div class="ph"><h1>청구 약정</h1><span class="sid">PAY-1</span>
    <div class="act"><button class="btn" onclick="go('pay-2')">미납 조회</button>
      <button class="btn pri" onclick="alert('PAY-3 청구 약정 등록')">+ 청구 약정 등록</button></div>
  </div>
  <div class="fbar">
    <select onchange="setF1('b',this.value)">
      <option value="">전체 건물</option>
      ${BUILDINGS.map(b=>`<option value="${b.id}" ${f1.b===b.id?'selected':''}>${b.name}</option>`).join('')}
    </select>
    <select onchange="setF1('st',this.value)">
      ${['진행중','준비중','종료됨',''].map(v=>`<option value="${v}" ${f1.st===v?'selected':''}>${v||'전체 계약상태'}</option>`).join('')}
    </select>
    <select onchange="setF1('it',this.value)">
      <option value="">전체 청구항목</option>
      ${Object.keys(CITEM).map(k=>`<option ${f1.it===k?'selected':''}>${k}</option>`).join('')}
    </select>
    <select onchange="setF1('calc',this.value)">
      ${['','고정액','정산'].map(v=>`<option value="${v}" ${f1.calc===v?'selected':''}>${v||'전체 산정방식'}</option>`).join('')}
    </select>
    ${ctrs.length?`<button class="btn sm" style="margin-left:auto"
       onclick="gAll(${anyOpen?'false':'true'})">${anyOpen?'전체 접기':'전체 펼치기'}</button>`:''}
  </div>
  ${!ctrs.length?`<div class="tbl"><div class="empty"><div class="t">조건에 맞는 청구 약정이 없습니다</div>
     필터를 바꾸거나 계약 상세에서 청구 항목을 등록하세요.</div></div>`
  :`<div class="tbl"><table class="sch">
      <thead><tr><th>청구항목</th><th>산정방식</th><th>반복주기</th><th>기산일</th>
        <th class="c">부가세</th><th class="n">청구액</th><th class="n"></th></tr></thead>
      <tbody>${body}
        <tr class="sumr"><td>합계 <span class="lock">계약 ${ctrs.length} · 항목 ${nI}</span></td>
          <td></td><td></td><td></td><td></td>
          <td class="n">${won(mFix)}</td><td class="n c2">월 고정액만</td></tr>
      </tbody></table></div>`}
  <div class="hint">
    <b>약정만 표시한다.</b> 이 화면으로는 납부 여부를 알 수 없다.
    회차별 실제 청구액과 미납 내역은 <b>미납 관리(PAY-2)</b>에서 확인한다.<br>
    계약 행을 누르면 청구 항목이 펼쳐진다. 접힌 상태에서는 <b>월 고정액</b>과 항목 구성만 본다.
    청구항목·산정방식 필터를 걸면 자동으로 펼쳐진다.<br>
    산정방식이 <b>정산</b>인 항목은 회차마다 금액이 달라지므로 약정액이 없다.
    실제 금액은 <b>관리비 정산(PAY-10)</b>에서 산출된다. 고정액은 <b>임대료·고정관리비</b>뿐이다.<br>
    금액은 모두 <b>부가세 별도</b>다. 합계는 반복주기가 매월인 고정액만 더한 값이다.</div>`;
}

/* ═══ 라우터 ═══ */
function render(keep){
  const y=window.scrollY||0;
  const h=(location.hash||'#/pro-1').replace(/^#\//,'');
  const [id,arg]=h.split('/');
  paintNav(h);
  let html,crumb;
  if(id==='pro-1'){html=PRO1();crumb='<b>건물 관리</b>';}
  else if(id==='pro-3'){const b=BUILDINGS.find(x=>x.id===arg)||BUILDINGS[0];
    html=PRO3(arg);crumb=`<span class="c" onclick="go('pro-1')">건물 관리</span> <span>›</span> <b>${b.name}</b>`;}
  else if(id==='pay-10'){html=PAY10();crumb='청구 · 수납 <span>›</span> <b>관리비 정산</b>';}
  else if(id==='pay-12'){html=PAY12();crumb='<b>청구 · 수납</b>';}
  else if(id==='pay-1'){html=PAY1();crumb='청구 · 수납 <span>›</span> <b>청구 약정</b>';}
  else{html=TODO(id);const g=MENU.find(m=>m.items&&m.items.some(i=>i.id===id));
    const m=ALL.find(i=>i.id===id);
    crumb=(g?g.g+' <span>›</span> ':'')+`<b>${m?m.n:'—'}</b>`;}
  $('#crumb').innerHTML=crumb;$('#view').innerHTML=html+drawerHTML();
  if(keep) window.scrollTo(0,y); else if(!DRAWER) window.scrollTo(0,0);
}
addEventListener('hashchange',render);
paintOp();paintFold();render();
</script>
