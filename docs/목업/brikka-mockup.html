button,input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{flex:none}

/* ── 레이아웃 ── */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;overflow:hidden}
.bh{padding:16px 16px 14px;display:flex;align-items:center;gap:10px}
.bi{width:32px;height:32px;border-radius:var(--r-sm);background:var(--pri);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.bt{line-height:1.25}
.bt .n{font-weight:700;font-size:14.5px}
.bt .s{font-size:11.5px;color:var(--muted)}
.navsc{flex:1;overflow-y:auto;padding:4px 10px 16px}
.navg{padding:14px 8px 5px;font-size:11px;color:var(--faint);font-weight:500;letter-spacing:.02em}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);
  cursor:pointer;color:var(--ink-2);font-size:13.5px;margin-bottom:1px}
.nav a:hover{background:var(--side-hov)}
.nav a.on{background:var(--side-on);color:var(--ink);font-weight:500}
.nav a .sid{margin-left:auto;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.nav a svg{color:var(--muted)}
.nav a.on svg{color:var(--pri)}
.sf{border-top:1px solid var(--line);padding:10px}
.op{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer}
.op:hover{background:var(--side-hov)}
.op .av{width:28px;height:28px;border-radius:var(--r-sm);background:var(--neutral-bg);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.op .ot{line-height:1.3;min-width:0}
.op .ot .a{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op .ot .b{font-size:11px;color:var(--muted)}
.op.test .av{background:var(--warn-bg);color:var(--warn)}
.op.test .ot .a{color:var(--warn)}

.main{min-width:0;background:var(--canvas)}
.top{padding:14px 28px 0;display:flex;align-items:flex-start;gap:16px}
.crumb{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.crumb .c{cursor:pointer}.crumb .c:hover{color:var(--ink-2)}
.crumb b{color:var(--ink-2);font-weight:400}
.top .sp{flex:1}
.mock{font-size:11.5px;color:var(--warn);background:var(--warn-bg);padding:3px 9px;border-radius:99px;font-weight:500}
.wrap{padding:6px 28px 64px;max-width:1560px}
.ph{display:flex;align-items:center;gap:10px;margin:2px 0 18px;flex-wrap:wrap}
.ph h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em}
.ph .sid{font-size:11px;color:var(--muted);background:var(--neutral-bg);padding:3px 8px;border-radius:99px;font-weight:500}
.ph .act{margin-left:auto;display:flex;gap:8px}

/* ── 부품 ── */
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink-2);padding:8px 14px;

  align-items:center;gap:6px;font-weight:500}
.btn:hover{background:var(--side-hov)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-hov)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.gh{border-color:transparent;background:none;color:var(--muted)}
.btn.gh:hover{background:var(--side-hov);color:var(--ink-2)}

.sbar{display:flex;gap:10px;margin-bottom:16px}
.sin{flex:1;display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:var(--r);
  padding:0 14px;background:var(--bg)}
.sin:focus-within{border-color:var(--pri)}
.sin input{flex:1;border:0;outline:0;background:none;padding:10px 0;font-size:13.5px}
.sin input::placeholder{color:var(--faint)}
.sin svg{color:var(--faint)}

.tbl{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--head);text-align:left;padding:11px 16px;font-size:12px;font-weight:500;color:var(--muted);

th .so{color:var(--faint);margin-left:3px;font-size:10px}
td{padding:13px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--side-hov)}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
.c1{font-weight:500;color:var(--ink);white-space:nowrap}
.c2{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap}
.det{color:var(--muted);font-size:13px;cursor:pointer}
.det:hover{color:var(--pri)}
.cb{width:16px;height:16px;border:1.5px solid var(--line);border-radius:4px;display:inline-block;vertical-align:-3px}

.pgw{display:flex;align-items:center;padding:14px 16px;border-top:1px solid var(--line);gap:12px}
.pgw .mid{flex:1;display:flex;justify-content:center;align-items:center;gap:4px}
.pgb{border:0;background:none;padding:6px 11px;border-radius:var(--r-sm);cursor:pointer;color:var(--muted);font-size:13px}
.pgb:hover{background:var(--side-hov);color:var(--ink-2)}
.pgb.on{border:1px solid var(--line);color:var(--ink);font-weight:500}
.pgi{font-size:12.5px;color:var(--muted);white-space:nowrap}

.bd{display:inline-flex;align-items:center;font-size:12px;padding:3px 10px;border-radius:99px;font-weight:500;white-space:nowrap}
.bd.ok{background:var(--ok-bg);color:var(--ok)} .bd.wa{background:var(--warn-bg);color:var(--warn)}

.bd.ac{background:var(--pri-bg);color:var(--pri)}

.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}

.card{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);margin-bottom:16px;overflow:hidden}

.card > .ct .sub{font-weight:400;color:var(--muted);font-size:12.5px}
.card > .ct .ca{margin-left:auto;display:flex;gap:6px}
.card > .cc{padding:4px 18px 18px}
.card > .ct + .tw table th{border-top:1px solid var(--line)}

.dl{display:grid;grid-template-columns:132px 1fr;font-size:13.5px}
.dl dt{padding:9px 0;color:var(--muted);border-bottom:1px solid var(--line-2);font-size:13px}
.dl dd{padding:9px 0;margin:0;border-bottom:1px solid var(--line-2)}
.dl dt:last-of-type,.dl dd:last-of-type{border-bottom:0}
.hint{color:var(--muted);font-size:12.5px;margin-top:10px;line-height:1.6}
.lock{color:var(--faint);font-size:11.5px;margin-left:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1080px){.two{grid-template-columns:1fr}}

.tag{display:inline-flex;align-items:center;gap:6px;background:var(--neutral-bg);color:var(--ink-2);
  padding:5px 12px;border-radius:99px;font-size:13px;margin:0 6px 6px 0}
.tag .x{color:var(--faint);cursor:pointer;font-size:12px}
.tag .x:hover{color:var(--danger)}

.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.unit{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;background:var(--bg)}
.unit:hover{border-color:var(--pri);background:var(--pri-bg)}

.unit .un{font-weight:700;font-size:15px}
.unit .r{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:2px 0}
.unit .r b{font-weight:500;color:var(--ink-2)}

.empty{padding:56px 16px;text-align:center;color:var(--muted);font-size:13.5px}
.empty .t{font-weight:500;color:var(--ink-2);margin-bottom:5px}

@media(max-width:900px){

  .side{position:static;height:auto}

  .nav{display:flex;flex-wrap:wrap;gap:2px}
  .nav a{width:auto} .nav a .sid{display:none}
  .navg{width:100%;padding:10px 8px 3px}
  .top,.wrap{padding-left:16px;padding-right:16px}
}

/* ═══ 유틸 ═══ */
const $=s=>document.querySelector(s);
const num=n=>n.toLocaleString('ko-KR');
const m2=n=>num(n)+' ㎡';
const won=n=>num(n)+'원';
const eok=n=>n?(n/100000000).toFixed(1).replace(/\.0$/,'')+'억원':'—';
const pct=n=>n.toFixed(1)+'%';
const TODAY=new Date('2026-09-23');
const dday=e=>Math.ceil((new Date(e)-TODAY)/864e5);
const ST={'사용중':'ok','공실':'mu','비운영중':'wa'};
const stb=s=>`<span class="bd ${ST[s]||'mu'}">${s}</span>`;
const go=h=>location.hash='#/'+h;
function cycleOp(){opIdx=(opIdx+1)%OPS.length;paintOp();render();}
function paintOp(){const o=OPS[opIdx];$('#opName').textContent=o.n;$('#opAv').textContent=o.av;
  $('#opBox').className='op'+(o.t?' test':'');}
function ddBadge(end){
  const d=dday(end);
  if(d<0) return `<span class="bd da">만료됨 · ${num(-d)}일 경과</span>`;
  if(d<=90) return `<span class="bd wa">${num(d)}일 남음</span>`;
  return `${num(d)}일 남음`;
}

/* ═══ 네비 ═══ */
function paintNav(){
  $('#nav').innerHTML=MENU.map(g=>(g.g?`<div class="navg">${g.g}</div>`:'')+
    g.items.map(i=>`<a onclick="go('${i.id}')" data-id="${i.id}">${ic(i.i)}<span>${i.n}</span><span class="sid">${i.sid}</span></a>`).join('')).join('');
}
const markNav=h=>document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.id===h.split('/')[0]));

/* ═══ 라우터 ═══ */
function render(){
  const h=(location.hash||'#/pro-1').replace(/^#\//,'');
  const [id,arg]=h.split('/');
  markNav(h);
  let html,crumb;
  if(id==='pro-1'){html=PRO1();crumb='자산 · 계약 <span>›</span> <b>건물 관리</b>';}
  else if(id==='pro-3'){const b=BUILDINGS.find(x=>x.id===arg)||BUILDINGS[0];
    html=PRO3(arg);crumb=`자산 · 계약 <span>›</span> <span class="c" onclick="go('pro-1')">건물 관리</span> <span>›</span> <b>${b.name}</b>`;}
  else{html=TODO(id);const g=MENU.find(g=>g.items.some(i=>i.id===id));
    const m=g&&g.items.find(i=>i.id===id);
    crumb=(g&&g.g?g.g+' <span>›</span> ':'')+`<b>${m?m.n:'—'}</b>`;}
  $('#crumb').innerHTML=crumb;$('#view').innerHTML=html;window.scrollTo(0,0);
}
addEventListener('hashchange',render);
paintNav();paintOp();render();
