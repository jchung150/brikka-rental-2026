<title>BRIKKA 백오피스</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --canvas:#FFFFFF; --side:#FFFFFF; --side-hov:#F3F4F6; --side-on:#EEF2F6;
  --ink:#111827; --ink-2:#374151; --muted:#6B7280; --faint:#9CA3AF;
  --line:#E5E7EB; --line-2:#F3F4F6; --head:#FFFFFF;
  --pri:#2563EB; --pri-hov:#1D4ED8; --pri-bg:#EFF6FF;
  --ok:#047857; --ok-bg:#ECFDF5; --warn:#B45309; --warn-bg:#FFFBEB;
  --danger:#B91C1C; --danger-bg:#FEF2F2; --neutral:#4B5563; --neutral-bg:#F3F4F6;
  --r:8px; --r-sm:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --canvas:#15181E; --side:#15181E; --side-hov:#1E222A; --side-on:#232833;
  --ink:#E8EAED; --ink-2:#C5CAD3; --muted:#8B93A1; --faint:#6B7280;
  --line:#272C35; --line-2:#1E222A; --head:#15181E;
  --pri:#60A5FA; --pri-hov:#93C5FD; --pri-bg:#172032;
  --ok:#4ADE80; --ok-bg:#132218; --warn:#FBBF24; --warn-bg:#241D0F;
  --danger:#F87171; --danger-bg:#251515; --neutral:#9CA3AF; --neutral-bg:#1E222A;
}}
:root[data-theme="dark"]{
  --bg:#0F1115; --canvas:#15181E; --side:#15181E; --side-hov:#1E222A; --side-on:#232833;
  --ink:#E8EAED; --ink-2:#C5CAD3; --muted:#8B93A1; --faint:#6B7280;
  --line:#272C35; --line-2:#1E222A; --head:#15181E;
  --pri:#60A5FA; --pri-hov:#93C5FD; --pri-bg:#172032;
  --ok:#4ADE80; --ok-bg:#132218; --warn:#FBBF24; --warn-bg:#241D0F;
  --danger:#F87171; --danger-bg:#251515; --neutral:#9CA3AF; --neutral-bg:#1E222A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{flex:none}

/* ── 레이아웃 ── */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;overflow:hidden}
.bh{padding:16px 16px 14px;display:flex;align-items:center;gap:10px}
.bi{width:32px;height:32px;border-radius:var(--r-sm);background:var(--pri);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.bt{line-height:1.25}
.bt .n{font-weight:700;font-size:13.5px}
.bt .s{font-size:11px;color:var(--muted)}
.navsc{flex:1;overflow-y:auto;padding:4px 10px 16px}
.navg{padding:16px 10px 6px;font-size:11px;color:var(--faint);font-weight:500;letter-spacing:.02em}
.nav a,.nav .gh{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);
  cursor:pointer;color:var(--ink-2);font-size:12.5px;margin-bottom:1px;border:0;background:none;
  width:100%;text-align:left;font-family:inherit}
.nav a:hover,.nav .gh:hover{background:var(--side-hov)}
.nav a.on{background:var(--side-on);color:var(--ink);font-weight:500}
.nav a .sid{margin-left:auto;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.nav a svg,.nav .gh svg{color:var(--muted)}
.nav a.on svg{color:var(--pri)}
.nav .gh .cv{margin-left:auto;transition:transform .16s;color:var(--faint)}
.nav .gh.open .cv{transform:rotate(90deg)}
.nav .gh.hasOn{color:var(--ink);font-weight:500}
.nsub{overflow:hidden;position:relative}
.nsub::before{content:'';position:absolute;left:19px;top:2px;bottom:2px;width:1px;background:var(--line)}
.nsub a{padding-left:34px;font-size:12px;color:var(--muted)}
.nsub a:hover{color:var(--ink-2)}
.nsub a.on{color:var(--ink)}
.nsub a .sid{font-size:10px}
.sf{border-top:1px solid var(--line);padding:8px 10px 10px;position:relative}
.sfi{display:flex;align-items:center;justify-content:space-between;padding:0 2px 6px}
.ib{border:0;background:none;padding:7px;border-radius:var(--r-sm);cursor:pointer;color:var(--muted);
  display:flex;position:relative}
.ib:hover{background:var(--side-hov);color:var(--ink-2)}
.ib .dot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:#EF4444}
.me{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:var(--r-sm);cursor:pointer}
.me:hover{background:var(--side-hov)}
.me .av{width:26px;height:26px;border-radius:var(--r-sm);background:var(--neutral-bg);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.me .mt{line-height:1.3;min-width:0;flex:1}
.me .mt .a{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .mt .b{font-size:10.5px;color:var(--muted)}
.me .ch{color:var(--faint);font-size:11px}
.nw{position:absolute;bottom:52px;left:10px;width:318px;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.14);z-index:40;overflow:hidden}
.nw .nh{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line-2)}
.nw .nh b{font-size:12.5px}
.nw .nh .cl{margin-left:auto;font-size:11px;color:var(--muted);cursor:pointer}
.nw .nh .cl:hover{color:var(--ink-2)}
.nw .ni{display:flex;gap:9px;padding:10px 14px;border-bottom:1px solid var(--line-2);cursor:pointer}
.nw .ni:last-child{border-bottom:0}
.nw .ni:hover{background:var(--side-hov)}
.nw .ni .nb{flex:1;min-width:0}
.nw .ni .nt{font-size:12px;font-weight:500;margin-bottom:2px}
.nw .ni .nd{font-size:11px;color:var(--muted);line-height:1.5}
.nw .ni .ng{font-size:10.5px;color:var(--faint);white-space:nowrap}

/* PAY-10 정산 */
.fbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.fbar select{border:1px solid var(--line);background:var(--bg);padding:8px 11px;border-radius:var(--r-sm);
  font-size:12.5px;min-width:150px}
.stepv{display:flex;gap:0;margin-bottom:18px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stepv .sp2{flex:1;padding:11px 14px;border-right:1px solid var(--line);cursor:pointer;background:var(--bg)}
.stepv .sp2:last-child{border-right:0}
.stepv .sp2:hover{background:var(--side-hov)}
.stepv .sp2.on{background:var(--pri-bg)}
.stepv .sp2 .t{font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.stepv .sp2.on .t{color:var(--pri)}
.stepv .sp2 .d{font-size:11.5px;color:var(--muted);margin-top:2px}
.stepv .sp2 .nm{width:17px;height:17px;border-radius:50%;background:var(--neutral-bg);color:var(--muted);
  font-size:10.5px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.stepv .sp2.on .nm{background:var(--pri);color:#fff}
.stepv .sp2.dn .nm{background:var(--ok-bg);color:var(--ok)}
.itab{display:flex;gap:6px;margin-bottom:14px}
.itab button{border:1px solid var(--line);background:var(--bg);padding:6px 13px;border-radius:99px;
  cursor:pointer;font-size:12.5px;color:var(--ink-2);font-family:inherit}
.itab button.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:500}
.inp{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:5px 9px;
  font-size:12.5px;width:92px;text-align:right;font-variant-numeric:tabular-nums}
.inp:focus{outline:0;border-color:var(--pri)}
.inp.w{width:76px}
.inp.w2{width:62px;padding:3px 7px;font-size:12px}
.uct{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-left:auto}
.inp.why{width:100%;text-align:left;font-size:12px}

tr.dim td{color:var(--muted)}
tr.sumr td{background:var(--head);font-weight:700;border-top:1px solid var(--line)}
tr.vacr td{background:var(--warn-bg)}
tr.exr td{background:var(--line-2);color:var(--muted)}
.vfy{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--r);
  border:1px solid var(--line);margin-top:14px;font-size:12.5px;flex-wrap:wrap}
.vfy.ok{background:var(--ok-bg);border-color:var(--ok)}
.vfy.no{background:var(--warn-bg);border-color:var(--warn)}
.vfy b{font-variant-numeric:tabular-nums}
.vfy .ttl{font-weight:700}
.vfy.ok .ttl{color:var(--ok)} .vfy.no .ttl{color:var(--warn)}
.fnd{background:var(--pri-bg);border:1px solid var(--pri);border-left-width:3px;border-radius:var(--r);
  padding:12px 15px;font-size:12.5px;color:var(--ink-2);margin:14px 0;line-height:1.65}
.fnd b{color:var(--pri)}
.fnd .h{font-weight:700;color:var(--pri);display:block;margin-bottom:4px}

/* 우측 슬라이드 패널 */
.dro{position:fixed;inset:0;z-index:100}
.dro .ov{position:absolute;inset:0;background:rgba(15,20,28,.35);animation:fadein .16s}
.dro .pn{position:absolute;right:0;top:0;bottom:0;width:440px;max-width:100%;background:var(--bg);
  border-left:1px solid var(--line);box-shadow:-10px 0 36px rgba(0,0,0,.16);
  display:flex;flex-direction:column;animation:slidein .2s cubic-bezier(.32,.72,0,1)}
@keyframes slidein{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.dro .dh{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.dro .dh .t{font-size:15px;font-weight:700}
.dro .dh .s{font-size:12px;color:var(--muted);margin-top:3px}
.dro .dh .x{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;
  font-size:19px;line-height:1;padding:2px 6px;border-radius:var(--r-sm)}
.dro .dh .x:hover{background:var(--side-hov);color:var(--ink)}
.dro .db{flex:1;overflow-y:auto;padding:14px 20px 20px}
.dro .df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.pick{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);
  border-radius:var(--r);margin-bottom:6px;cursor:pointer}
.pick:hover{border-color:var(--muted)}
.pick.on{border-color:var(--pri);background:var(--pri-bg)}
.pick .ck{width:17px;height:17px;border:1.5px solid var(--line);border-radius:4px;flex:none;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px}
.pick.on .ck{background:var(--pri);border-color:var(--pri)}
.pick .pb{flex:1;min-width:0}
.pick .pn2{font-weight:500;font-size:13px}

/* 건물 전환 */
.bsw{position:relative;display:inline-flex;align-items:center;gap:9px}
.bsw h1{margin:0}
.bsw .bt2{display:inline-flex;align-items:center;gap:5px;cursor:pointer;
  border:1px solid var(--line);background:var(--bg);font-family:inherit;
  padding:5px 9px 5px 10px;border-radius:99px;font-size:11.5px;color:var(--muted);font-weight:500}
.bsw .bt2:hover{border-color:var(--pri);color:var(--pri);background:var(--pri-bg)}
.bsw .bt2.open{border-color:var(--pri);color:var(--pri);background:var(--pri-bg)}
.bsw .bt2 svg{transition:transform .15s}
.bsw .bt2.open svg{transform:rotate(180deg)}
.bsw .menu{position:absolute;top:100%;left:0;margin-top:8px;min-width:300px;background:var(--bg);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.13);
  z-index:30;overflow:hidden;padding:5px}
.bsw .menu .mi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);
  cursor:pointer;font-size:12.5px}
.bsw .menu .mi:hover{background:var(--side-hov)}
.bsw .menu .mi.on{background:var(--pri-bg)}
.bsw .menu .mi .mn{font-weight:500;flex:1}
.bsw .menu .mi.on .mn{color:var(--pri)}
.bsw .menu .mi .mk{font-size:11.5px;color:var(--muted)}
.bsw .menu .hd{font-size:11px;color:var(--faint);padding:6px 10px 4px}

/* 진행 현황 */
.pgrid td.st{cursor:pointer}
.pgrid td.st:hover{background:var(--pri-bg)}
.mcl tr.on td{background:var(--pri-bg)}
.stp{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.stp .dot2{width:6px;height:6px;border-radius:50%;flex:none}
.bar{height:5px;background:var(--line-2);border-radius:99px;overflow:hidden;margin-top:4px;width:84px}
.bar > i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bar.part > i{background:var(--warn)}

/* 설정 패널 */
.fg{margin-bottom:18px}
.fg .fl{font-size:11px;color:var(--faint);font-weight:500;letter-spacing:.02em;
  padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.fr{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
.fr .fk{width:104px;color:var(--muted);flex:none}
.fr select,.fr input[type=text],.fr input[type=date]{flex:1;border:1px solid var(--line);
  background:var(--bg);padding:6px 9px;border-radius:var(--r-sm);font-size:12.5px;font-family:inherit}
.fr .fv{flex:1}
.ulist{border:1px solid var(--line);border-radius:var(--r-sm);max-height:196px;overflow-y:auto}
.ulist .ur{display:flex;align-items:center;gap:9px;padding:7px 11px;cursor:pointer;
  border-bottom:1px solid var(--line-2);font-size:12.5px}
.ulist .ur:last-child{border-bottom:0}
.ulist .ur:hover{background:var(--side-hov)}
.ulist .ur.on{background:var(--pri-bg)}
.ulist .ur .ck2{width:15px;height:15px;border:1.5px solid var(--line);border-radius:3px;flex:none;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px}
.ulist .ur.on .ck2{background:var(--pri);border-color:var(--pri)}
.ulist .ur .un2{font-weight:500;width:52px;flex:none}
.ulist .ur .ut2{color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
color:var(--faint);font-variant-numeric:tabular-nums}
.utool{display:flex;gap:6px;align-items:center;margin-bottom:7px;font-size:11.5px;color:var(--muted)}
.utool button{border:1px solid var(--line);background:var(--bg);padding:3px 9px;border-radius:99px;
  cursor:pointer;font-size:11.5px;color:var(--ink-2);font-family:inherit}
.utool button:hover{background:var(--side-hov)}
.utool .cnt2{margin-left:auto}
.prev{background:var(--pri-bg);border:1px solid var(--pri);border-left-width:3px;
  border-radius:var(--r-sm);padding:11px 13px;font-size:12px;line-height:1.7;color:var(--ink-2)}
.prev .pt{font-weight:700;color:var(--pri);font-size:11.5px;margin-bottom:5px}
.prev b{color:var(--ink)}
.warn2{background:var(--warn-bg);border-color:var(--warn)}
.warn2 .pt{color:var(--warn)}

/* 고지서 입력 표 */
table.bt2 td{padding:9px 12px}
.inp.lg{width:120px;font-weight:500}
.inp.d{width:130px;text-align:left;font-size:12px}
.inp .u,.n .u{color:var(--muted);font-size:11.5px}
.btn.ex{color:var(--muted);padding:4px 10px;font-size:11.5px}
.btn.ex:hover{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}

/* 접힘 상태 */
.app.fold .side{width:62px}
.app.fold{grid-template-columns:62px 1fr}
.app.fold .bh{padding:14px 0;justify-content:center}
.app.fold .bt,.app.fold .navg,.app.fold .me .mt,.app.fold .me .ch{display:none}
.app.fold .nsub::before{display:none}
.app.fold .sfi{flex-direction:column;gap:2px;padding-bottom:4px}
.app.fold .me{justify-content:center;padding:7px 0}
.app.fold .nw{left:calc(100% + 8px);bottom:10px}
.app.fold .nav a,.app.fold .nav .gh{justify-content:center;padding:9px 0;gap:0}
.app.fold .nav a span,.app.fold .nav .gh span,.app.fold .nav .cv{display:none}
.app.fold .nsub{display:none!important}
.app.fold .nav a,.app.fold .nav .gh{position:relative}
.app.fold .nav a:hover::after,.app.fold .nav .gh:hover::after{
  content:attr(data-n);position:absolute;left:52px;top:50%;transform:translateY(-50%);
  background:var(--ink);color:var(--bg);padding:5px 10px;border-radius:var(--r-sm);font-size:12px;
  white-space:nowrap;z-index:20;pointer-events:none}
.op{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer}
.op:hover{background:var(--side-hov)}
.op .av{width:28px;height:28px;border-radius:var(--r-sm);background:var(--neutral-bg);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.op .ot{line-height:1.3;min-width:0}
.op .ot .a{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op .ot .b{font-size:11px;color:var(--muted)}
.op.test .av{background:var(--warn-bg);color:var(--warn)}
.op.test .ot .a{color:var(--warn)}

.main{min-width:0;background:var(--canvas)}
.top{padding:14px 28px 0;display:flex;align-items:flex-start;gap:16px}
.crumb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.crumb .c{cursor:pointer}.crumb .c:hover{color:var(--ink-2)}
.crumb b{color:var(--ink-2);font-weight:400}
.top .sp{flex:1}
.today{font-size:12px;color:var(--faint);white-space:nowrap}
.mock{font-size:11px;color:var(--warn);background:var(--warn-bg);padding:3px 9px;border-radius:99px;font-weight:500}
.wrap{padding:6px 28px 64px;max-width:1560px}
.ph{display:flex;align-items:center;gap:10px;margin:2px 0 18px;flex-wrap:wrap}
.ph h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.ph .sid{font-size:10.5px;color:var(--muted);background:var(--neutral-bg);padding:2px 8px;border-radius:99px;font-weight:500}
.ph .act{margin-left:auto;display:flex;gap:8px}

/* ── 부품 ── */
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink-2);padding:7px 13px;
  border-radius:var(--r-sm);cursor:pointer;font-size:12.5px;white-space:nowrap;display:inline-flex;
  align-items:center;gap:6px;font-weight:500}
.btn:hover{background:var(--side-hov)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-hov)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.gh{border-color:transparent;background:none;color:var(--muted)}
.btn.gh:hover{background:var(--side-hov);color:var(--ink-2)}

.sbar{display:flex;gap:10px;margin-bottom:16px}
.sin{flex:1;display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:var(--r);
  padding:0 14px;background:var(--bg)}
.sin:focus-within{border-color:var(--pri)}
.sin input{flex:1;border:0;outline:0;background:none;padding:9px 0;font-size:12.5px}
.sin input::placeholder{color:var(--faint)}
.sin svg{color:var(--faint)}

.tbl{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--head);text-align:left;padding:10px 14px;font-size:11.5px;font-weight:500;color:var(--muted);
  border-bottom:1px solid var(--line);white-space:nowrap}
th .so{color:var(--faint);margin-left:3px;font-size:10px}
td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--side-hov)}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
.c1{font-weight:500;color:var(--ink);white-space:nowrap}
.cn{white-space:nowrap;font-size:12.5px}
.cn b{font-weight:500;color:var(--ink)}

 /* 본관301호 고우컴퍼니는 전월·당월 지침이 모두 없다 — 계량기 미보유로 본다 */

  const data={it:m.name,use:1,bill:m.bill,cycle:m.cycle,meter:mt,mtr:A.charge,
    rest:'전체 유닛',
    basis:cs.basis+' 비율'+(cs.ref&&cs.ref!==code?` · ${M(cs.ref).name} 참조`:'')};

function setBill(code,key,v){

const isDirect=code=>resolve(code).basis==='직접 입력';
const directSum=code=>Object.values((BILL[code].direct)||{}).reduce((a,v)=>a+(+v||0),0);
/* 직접 입력 항목은 고지서가 없다. 계약별 입력 금액의 합이 공급가액이다 */
const billTotal=m=>isDirect(m.code)
  ? directSum(m.code)+(BILL[m.code].vat||0)
  : (BILL[m.code].supply||0)+(BILL[m.code].vat||0);
const grandTotal=()=>selItems().reduce((a,m)=>a+billTotal(m),0);

/* 계량기 보유 판정 — 유닛 × 항목 */
const meterUnits=code=>METER[code]||[];
const hasMeter=(code,no)=>meterUnits(code).includes(no);
const isMetered=code=>meterUnits(code).length>0;
/* 검침값 — 계량기 보유 유닛만 유효하다 */
const reading=(code,no)=>hasMeter(code,no)?(BILL[code].read||{})[no]:null;

/* 배분 계산 — 4.1.2
   ① 개별 사용량   = (당월 − 직전 검침값) × 계기배율   → 4.1.3-3
   ② 공용 사용량 합계 = 고지서 총사용량 − Σ개별 사용량
   ③ 기준 공용    = 합계 × (기준값 ÷ Σ기준값)            기준값: 개별 사용량 또는 임대면적
   ④ 공용 사용량   = 배율 ≠ 1이면 기준 공용 × 배율, 나머지는 잔여를 원래 비율대로
                    합계는 변하지 않는다. 넘치면 비례 배분으로 물러선다
   ⑤ 유닛 총사용량 = 개별 사용량 + 공용 사용량
   ⑥ 부담 비율     = 유닛 총사용량 ÷ 고지서 총사용량
   ⑦ 청구금액     = 공급가액·부가세 각각 × 부담 비율

   공용분은 안분 제외를 뺀 전 유닛이 부담한다. 계량기가 있어도 복도·화장실을 쓴다.
   특정 유닛을 빼려면 배율을 0으로 둔다 → 4.1.7 */
function ratios(m,raw){
  const st=resolve(m.code);
  const ref=(st.ref&&st.ref!==m.code)?st.ref:null;
  if(ref) return ratios(M(ref),raw);
  const b=BILL[m.code], ex=st.excl||{};
  /* 계량기가 있으면 개별분을 청구한다. 배분 기준이 계량기 필요 여부를 정하므로
     「계량기는 있는데 청구하지 않는다」는 조합이 존재하지 않는다 → 4.1.3-1 */
  const charge=(METER[m.code]||[]).length>0;
  /* 배분 몫의 기준값 — 「사용량」만 사용량 비율이다.
     「사용량+임대면적」은 개별분은 검침, 공용분은 면적으로 나눈다 → 4.1.3 */
  const byUse=st.basis==='사용량';

  /* 직접 입력 — 안분하지 않는다. 계약별로 담당자가 넣은 금액이 그대로 청구된다 */
  if(st.basis==='직접 입력'){
    const dir=b.direct||{}, tot=directSum(m.code);
    const rows=UNITS_B1.map(u=>{
      const d=+dir[u.no]||0;
      return {...u,hasM:false,typed:false,use:0,aUse:0,mul:1,excl:ex[u.no]||null,
              direct:d,w:0,common:0,tot:0,ratio:tot?d/tot:0};
    });
    return {rows,sumUse:0,common:0,wSum:0,totUse:0,charge:false,byUse:false,direct:true};
  }
  const rows=UNITS_B1.map(u=>{
    const hasM=hasMeter(m.code,u.no);
    const r=reading(m.code,u.no);
    /* 당월 검침값이 없으면 사용량은 0이다. null − 전월값이 음수가 되는 것을 막는다 */
    const typed=!!r&&r[1]!=null;
    const diff=typed?r[1]-r[0]:0;         /* 지침 차이 */
    const ct=ctOf(m.code,u.no);           /* 계기배율 */
    const use=diff*ct;                    /* 실사용량 */
    const aj=b.adj[u.no];
    /* raw는 「전 유닛 배율 1.0」 기준선 모드다. 지역 변수로 가리지 않도록 주의한다 */
    const mul=raw?1:((aj&&Number.isFinite(aj.mul))?aj.mul:1);  /* 0을 1로 되돌리지 않는다 */
    return {...u,pm:r?r[0]:null,cm:r?r[1]:null,hasM,typed,raw:diff,ct,use,mul,
            neg:typed&&use<0,excl:ex[u.no]||null};
  });
  /* 공용분은 안분 제외를 뺀 전 유닛이 부담한다 */
  const inTarget=r=>!r.excl;
  rows.forEach(r=>{ r.aUse = r.excl?0:r.use; });
  /* ② */
  const sumUse=rows.reduce((a,r)=>a+(r.excl?0:r.aUse),0);
  const totUse=b.use||0;
  const common=charge? totUse-sumUse : totUse;
  /* ④⑤⑥ 배율 적용 — 지정 유닛은 기준 공용 × 배율, 나머지가 잔여를 나눈다.
     정규화(배분 몫 ÷ Σ배분 몫)로 하면 분모가 함께 커져 배율만큼 늘지 않는다.
     총량 불변과 「정확히 N배」는 이 방식으로 동시에 성립한다 → 4.1.2 */
  const base=r=>byUse? r.use : r.ar;
  const bSum=rows.reduce((a,r)=>a+(inTarget(r)? base(r) : 0),0);
  const base0=r=>inTarget(r)&&bSum? common*base(r)/bSum : 0;   /* 배율 1.0 기준 공용 */
  const set=rows.filter(r=>inTarget(r)&&r.mul!==1);            /* 배율을 지정한 유닛 */
  const oth=rows.filter(r=>inTarget(r)&&r.mul===1);
  const fixSum=set.reduce((a,r)=>a+base0(r)*r.mul,0);
  const othSum=oth.reduce((a,r)=>a+base0(r),0);
  const rest=common-fixSum;
  /* 지정 유닛이 합계를 넘으면 나머지가 음수가 된다. 그때는 정규화로 물러선다 */
  const over=rest<-0.0001||(oth.length===0&&set.length>0);
  const wSum=rows.reduce((a,r)=>a+(inTarget(r)? base(r)*r.mul : 0),0);
  rows.forEach(r=>{
    r.w=inTarget(r)? base(r)*r.mul : 0;
    r.common=!inTarget(r)?0
      :over ? (wSum? common*r.w/wSum : 0)
      :r.mul!==1 ? base0(r)*r.mul
      :(othSum? rest*base0(r)/othSum : 0);
    r.tot=r.excl?0:((charge&&r.hasM? r.use : 0)+r.common);
    r.ratio=r.excl?0:(totUse?r.tot/totUse:(common?r.common/common:0));
  });
  return {rows,sumUse,common,wSum,totUse,charge,byUse,over};
}
/* ⑦ */
/* ⑥ 유닛 청구금액 — 4.1.2 · 잔차 처리 4.1.8
   공급가액과 부가세를 각각 배분한다. 합쳐서 배분하면 유닛별 부가세를 알 수 없어
   세금계산서를 만들 수 없다. 잔차도 각각 최대 몫 유닛에 더한다. */
function calc(m,raw){
  const base=ratios(m,raw), b=BILL[m.code];
  const sup=isDirect(m.code)?directSum(m.code):(b.supply||0);
  const vat=b.vat||0;
  const rows=base.rows.map(r=>({...r,
    supply:Math.floor(sup*r.ratio), vat:Math.floor(vat*r.ratio), rnd:0}));
  const top=()=>{let k=-1,best=-1;rows.forEach((r,i)=>{if(!r.excl&&r.ratio>best){best=r.ratio;k=i;}});return k;};
  const k=top();
  if(k>=0){
    const rs=sup-rows.reduce((a,r)=>a+r.supply,0);
    const rv=vat-rows.reduce((a,r)=>a+r.vat,0);
    rows[k].supply+=rs; rows[k].vat+=rv; rows[k].rnd=rs+rv;
  }
  rows.forEach(r=>r.amt=r.supply+r.vat);
  const sum=f=>rows.filter(f).reduce((a,r)=>a+r.amt,0);
  const bill=sum(r=>r.st==='사용중'&&!r.excl), vc=sum(r=>r.st!=='사용중'&&!r.excl);
  const total=sup+vat;
  return {...base,rows,bill,vac:vc,total,supply:sup,vatTotal:vat,
          diff:total-(bill+vc),rem:(k>=0?rows[k].rnd:0)};
}

/* ═══ PAY-10 관리비 정산 ═══ */
const fx=(n,d=1)=>n.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
/* 청구 항목마다 거치는 단계가 다르다.
     전기요금      고지서 → 검침 → 조정 → 산출
     정화조청소비   고지서 → 조정 → 산출          검침이 없다
     주차비        금액 입력 → 산출              고지서·검침·조정이 없다
   단계를 가로 네비로 고정하면 항목마다 「이 단계엔 이 항목이 없음」이라는 예외가 생긴다.
   항목당 한 페이지를 주고 그 항목이 실제로 거치는 단계만 세로로 쌓는다. */
function itemSecs(m){
  const R=calc(m), out=[], ref=resolve(m.code).ref;
  if(isDirect(m.code)) out.push(['금액 입력',stDirect(m,R)]);
  else{
    out.push(['고지서',stBillOne(m)]);
    if(isMetered(m.code)) out.push(['검침 입력',stRead(m,R)]);
    /* 참조 항목은 배분이 참조 대상에 종속된다. 여기서 조정할 것이 없다 */
    if(!ref) out.push(['조정',stAdj(m,R)]);
  }
  out.push(['산출 결과',stResult(m,R)]);
  return out;
}
/* 항목 탭의 상태 — 손봐야 할 것이 있으면 알린다 */
function itemFlag(m){
  /* 참조 항목은 참조 대상이 끝나야 금액이 확정된다. 그 상태를 그대로 물려받는다 */
  const ref=resolve(m.code).ref;
  if(ref&&ref!==m.code){
    if(!selItems().some(x=>x.code===ref))
      return {t:`${M(ref).name} 미선택`,c:'wa2'};
    const rf=itemFlag(M(ref));
    if(rf.c!=='ok') return {t:`${M(ref).name} 미완`,c:'wa'};
  }
  if(isDirect(m.code)) return directSum(m.code)?{t:'완료',c:'ok'}:{t:'미입력',c:'wa'};
  if(!(billTotal(m)>0)) return {t:'고지서 미입력',c:'wa'};
  if(isMetered(m.code)){
    const R=ratios(m), no=R.rows.filter(r=>r.hasM&&!r.typed).length;
    const neg=R.rows.filter(r=>r.neg).length;
    if(neg) return {t:`검침 역전 ${neg}`,c:'wa2'};
    if(no)  return {t:`미검침 ${no}`,c:'wa'};
  }
  return {t:'완료',c:'ok'};
}

/* ── 2단계 · 검침 ── */
function setRead(code,no,v){
  /* 계기정수가 다른 계량기는 지침이 소수로 나온다. 반올림하지 않는다 */
  const b=BILL[code], n=Math.max(0,Math.round((parseFloat(String(v).replace(/[,\s]/g,''))||0)*100)/100);
  if(b.read&&b.read[no]) b.read[no][1]=n;
  render(true);
}
const TODAY_ISO=TODAY.toISOString().slice(0,10);
/* 검침일은 유닛별로 다를 수 있다. 기본값은 당일이며 일괄 적용으로 한 번에 맞춘다. */
const readDateOf=(code,no)=>{const b=BILL[code];return (b.readDates&&b.readDates[no])||b.readDate||TODAY_ISO;};
function setReadDate(code,v){const b=BILL[code];b.readDate=v;b.readDates={};render(true);}
function setReadDateUnit(code,no,v){const b=BILL[code];(b.readDates=b.readDates||{})[no]=v;render(true);}
/* 전 유닛을 나열한다. 계량기가 없는 유닛은 행은 보이되 입력이 잠긴다.
   어느 유닛에 계량기가 있는지가 화면에서 그대로 읽히도록 한다. */
function stRead(m,R){
  const b=BILL[m.code], st=resolve(m.code), U=m.unit||'';
  const rows=R.rows.filter(r=>!r.excl);
  const mtr=rows.filter(r=>r.hasM);
  const noM=rows.filter(r=>!r.hasM);
  const todo=mtr.filter(r=>!r.typed).length;
  const dash='<span style="color:var(--faint)">—</span>';
  return `
  <div class="card"><div class="ct">검침 입력${todo?` <span class="bd wa">미입력 ${todo}개</span>`:''}
    <span class="ca">
      <span style="font-size:12px;color:var(--muted);margin-right:6px">검침일 일괄 적용</span>
      <input class="inp d" type="date" value="${b.readDate||TODAY_ISO}" onchange="setReadDate('${m.code}',this.value)">
      <button class="btn sm">엑셀 업로드</button></span></div>
    <div class="tw"><table>
      <thead><tr><th>계약고유명</th><th>검침일</th>
        <th class="n">직전 검침값</th><th class="n">당월 검침값</th>
        <th class="n">개별 사용량</th><th class="c">계량기 배율</th><th class="n">증감</th></tr></thead>
      <tbody>${rows.map(r=>r.hasM?`<tr>
        <td>${cnameST(r,m)}</td>
        <td><input class="inp d" type="date" value="${readDateOf(m.code,r.no)}"
            onchange="setReadDateUnit('${m.code}','${r.no}',this.value)"></td>
        <td class="n" style="color:var(--muted)">${r.pm!=null?fx(r.pm,r.pm%1?2:0):dash}</td>
        <td class="n"><input class="inp" type="number" value="${r.cm!=null?r.cm:''}" placeholder="미입력"
            onchange="setRead('${m.code}','${r.no}',this.value)"></td>
        <td class="n">${r.typed
          ?`<b style="${r.neg?'color:var(--warn)':''}">${fx(r.use,r.use%1?2:0)}</b> <span class="u">${U}</span>${
             r.neg?'<div class="c2" style="color:var(--warn)">당월 &lt; 직전</div>':''}`
          :dash}</td>
        <td class="c"><input class="inp w" type="number" step="0.1" min="0" value="${r.ct}"
            onchange="setCT('${m.code}','${r.no}',this.value)"></td>
        <td class="n">${r.typed&&r.ct!==1
          ?`<span class="dlt up">+${fx(r.use-r.raw,(r.use-r.raw)%1?2:0)}</span>`
          :'<span style="color:var(--faint)">—</span>'}</td></tr>`
      :`<tr class="nomr">
        <td>${cnameST(r,m)}</td>
        <td>${dash}</td><td class="n">${dash}</td>
        <td class="n"><input class="inp" type="text" value=""
            placeholder="${shareOf(m.code,r.no)?shareOf(m.code,r.no)+' 공유':'계량기 없음'}" disabled></td>
        <td class="n">${dash}</td><td class="c">${dash}</td><td class="n">${dash}</td></tr>`).join('')}
        <tr class="sumr"><td colspan="4">개별 사용량 합계</td>
          <td class="n">${fx(mtr.reduce((a,r)=>a+r.use,0),2)} ${U}</td><td></td>
          <td class="n">${(v=>v>0.005?`<span class="dlt up">+${fx(v,2)}</span>`:'—')
            (mtr.reduce((a,r)=>a+(r.use-r.raw),0))}</td></tr>
      </tbody></table></div>
  </div>
  <div class="hint">
    각 유닛의 <b>당월 검침값</b>만 넣으세요. 개별 사용량은 자동으로 계산됩니다.<br>
    아직 검침하지 못한 유닛은 비워 두세요. 그 유닛은 공용분만 부담합니다.
    당월이 직전보다 작으면 계량기 교체나 입력 실수이니 확인하세요.<br>
    <b>계량기 배율</b>은 계량기가 실제 사용량보다 작게 표시될 때 씁니다.
    표시가 실제의 1/30이면 <b>30</b>을 넣습니다. 보통은 <b>1</b>입니다.</div>`;
}

/* ── 3단계 · 조정 ── */
/* 배율은 공용 사용량 배분 몫에만 작용한다 → 4.1.2
   「증감」의 기준선은 전 유닛 배율 1.0인 상태이며, 그래서 증감 합계는 언제나 0이다. */
function setDirect(code,no,v){
  const b=BILL[code]; (b.direct=b.direct||{});
  const n=Math.max(0,Math.round(parseFloat(String(v).replace(/[,\s]/g,''))||0));
  if(n) b.direct[no]=n; else delete b.direct[no];
  /* 입력 금액이 공급가액이다. 과세 항목이면 부가세를 자동으로 다시 계산한다 */
  if(M(code).tax&&!b.vatManual) b.vat=Math.round(directSum(code)*0.1);
  render(true);
}
/* 직접 입력 항목 — 안분하지 않고 계약별 금액을 담당자가 넣는다 → 4.1.3 */
function stDirect(m,R){
  const rows=R.rows.filter(r=>!r.excl), tot=directSum(m.code);
  return `
  <div class="card"><div class="ct">금액 입력
    <span class="sub">${m.name} · 안분하지 않는다 · 공급가액 합계 <b>${won(tot)}</b>${
      m.tax?` · 부가세 ${won(BILL[m.code].vat||0)}`:''}</span></div>
    <div class="tw"><table>
      <thead><tr><th>계약고유명</th><th class="n">청구 금액</th><th>비고</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td>${cnameST(r,m)}</td>
        <td class="n"><input class="inp lg" type="text" value="${r.direct?num(r.direct):''}"
            placeholder="0" ${r.st!=='사용중'?'disabled':''}
            onchange="setDirect('${m.code}','${r.no}',this.value)"></td>
        <td class="c2">${r.st!=='사용중'?'계약 없음 · 입력할 수 없다':''}</td></tr>`).join('')}
        <tr class="sumr"><td>합계</td><td class="n">${won(tot)}</td><td></td></tr>
      </tbody></table></div>
  </div>
  <div class="hint">
    계약별로 청구할 금액을 직접 넣으세요. 나누지 않고 <b>넣은 그대로 청구</b>됩니다.<br>
    넣은 금액의 합이 이 항목의 공급가액이 됩니다.${m.tax?' 부가세 10%는 자동으로 붙습니다.':''}
    산출 근거는 <b>${m.src} ${m.doc}</b>에 남기세요.</div>`;
}
function stAdj(m,R){
  if(R.direct) return stDirect(m,R);
  const U=m.unit||'', st=resolve(m.code), B=calc(m,true);   /* B = 배율 1.0 기준선 */
  const rows=R.rows.filter(r=>!r.excl);
  if(!rows.length) return `<div class="tbl"><div class="empty">
    <div class="t">조정할 대상이 없습니다</div>${m.name}은 조정 가능한 유닛이 없습니다.</div></div>`;
  const bb=B.rows.reduce((o,r)=>(o[r.no]=r,o),{});
  const byUse=R.byUse;
  const base=r=>byUse?r.use:r.ar;
  const bSum=rows.reduce((a,r)=>a+base(r),0);
  /* 사용량 개념이 없는 항목은 금액으로 표시한다 */
  const amtMode=!m.unit, TOT=billTotal(m);
  const cRatio='공용 배분 비율';   /* 공용 사용량 ÷ 공용 사용량 합계. 산출 결과의 부담 비율과 다르다 */
  const cBase =byUse?'개별 사용량':'임대면적';
  /* 배분 기준이 면적인데 계량기가 있으면 개별 사용량을 따로 보여준다.
     누가 얼마를 직접 썼는지 알아야 배율을 정할 수 있다 */
  const showUse2=!byUse&&isMetered(m.code)&&R.charge;
  const cVal  =amtMode?'배분 금액':'공용 사용량';
  const now=r=>amtMode?won(r.amt):fx(r.common)+' '+U;
  const dOf=r=>amtMode?(r.amt-bb[r.no].amt):(r.common-bb[r.no].common);
  const big=d=>amtMode?Math.abs(d)>=1:Math.abs(d)>0.05;
  const dTx=d=>(d>0?'+':'−')+(amtMode?won(Math.abs(d)):fx(Math.abs(d)));
  const dSum=rows.reduce((a,r)=>a+dOf(r),0);
  return `
  <div class="card"><div class="ct">조정
    <span class="sub">${amtMode?`고지서 금액 <b>${won(TOT)}</b>`
       :`공용 사용량 합계 <b>${fx(R.common)} ${U}</b>`} · ${st.basis} 비율</span></div>
    <div class="tw"><table>
      <thead><tr><th>계약고유명</th>
        ${showUse2?`<th class="n">개별 사용량</th>`:''}
        <th class="n">${cBase}</th><th class="n">${cRatio}</th>
        <th class="n">${cVal}</th><th class="c">배율</th><th class="n">증감</th></tr></thead>
      <tbody>${rows.map(r=>{const d=dOf(r);return `<tr${r.mul===0?' class="vacr"':''}>
        <td>${cnameST(r,m)}</td>
        ${showUse2?`<td class="n" style="color:var(--muted)">${r.hasM
          ?fx(r.use,r.use%1?1:0)+' <span class="u">'+U+'</span>'
          :'<span style="color:var(--faint)">—</span>'}</td>`:''}
        <td class="n" style="color:var(--muted)">${byUse?fx(base(r),base(r)%1?1:0)+' '+U:fx(base(r))+' ㎡'}</td>
        <td class="n" style="color:var(--muted)">${R.common?(r.common/R.common*100).toFixed(2)+'%':'—'}</td>
        <td class="n">${r.mul===0?'<span class="bd mu">부담 없음</span>':`<b>${now(r)}</b>`}</td>
        <td class="c"><input class="inp w" value="${r.mul}" step="0.1" min="0" type="number"
             onchange="setMul('${m.code}','${r.no}',this.value)"></td>
        <td class="n">${big(d)?`<span class="dlt ${d>0?'up':'dn'}">${dTx(d)}</span>`
          :'<span style="color:var(--faint)">—</span>'}</td></tr>`}).join('')}
        <tr class="sumr"><td>합계</td>
          ${showUse2?`<td class="n">${fx(rows.reduce((a,r)=>a+r.use,0),0)} ${U}</td>`:''}
          <td class="n">${byUse?fx(bSum,bSum%1?1:0)+' '+U:fx(bSum)+' ㎡'}</td>
          <td class="n">100.00%</td>
          <td class="n">${amtMode?won(rows.reduce((a,r)=>a+r.amt,0)):fx(R.common)+' '+U}</td>
          <td></td>
          <td class="n">${(v=>big(v)?dTx(v):(amtMode?won(0):fx(0)))(dSum)}</td></tr>
      </tbody></table></div>
  </div>
  ${R.over?`<div class="fnd"><span class="h">배율이 너무 큽니다</span>
    배율을 지정한 유닛의 몫이 ${amtMode?'고지서 금액':'공용 사용량 합계'}를 넘습니다.
    지정한 배수대로 배분할 수 없어 <b>전 유닛 비례 배분</b>으로 물러섰습니다.
    배율을 낮추세요.</div>`:''}
  <div class="hint">
    <b>배율</b>을 올리면 그 유닛이 ${amtMode?'금액을':'공용분을'} 더 부담하고,
    나머지 유닛이 그만큼 덜 부담합니다. <b>넣은 배수만큼 정확히</b> 늘어납니다.<br>
    ${amtMode?'고지서 금액은':'공용 사용량 합계는'} 배율을 어떻게 바꿔도 변하지 않습니다.
    증감 합계가 늘 <b>0</b>인 것으로 확인할 수 있습니다.<br>
    <b>0</b>을 넣으면 그 유닛은 부담하지 않습니다. 공실을 뺄 때 씁니다.</div>`;
}

/* ── 4단계 · 산출 결과 ── */
function stResult(m,R){
  const b=BILL[m.code];
  return `
  ${(()=>{const rf=resolve(m.code).ref;return rf&&rf!==m.code
    ?(()=>{const f=itemFlag(M(rf));return `<div class="${f.c==='ok'?'hint':'fnd'}" style="margin:-4px 0 10px">${
        f.c==='ok'?'':`<span class="h">${M(rf).name}을 먼저 끝내세요</span>`}
       이 항목은 따로 검침하지 않고 <b>${M(rf).name}</b>과 같은 비율로 나눕니다.
       비율을 바꾸려면 ${M(rf).name}의 조정에서 바꾸세요.${
        f.c==='ok'?'':` 지금 ${M(rf).name}이 <b>${f.t}</b> 상태라 이 금액도 확정되지 않습니다.`}</div>`})():''})()}
  <div class="card"><div class="ct">산출 결과
    <span class="sub">${m.name} · ${resolve(m.code).basis} 비율 배분${
      (resolve(m.code).ref&&resolve(m.code).ref!==m.code)?` · ${M(resolve(m.code).ref).name} 배분 적용`:''}</span></div>
    <div class="tw"><table>
      <thead><tr><th>계약고유명</th>
        ${R.charge&&isMetered(m.code)?'<th class="n">(조정 후)개별 사용량</th>':''}
        ${m.unit?'<th class="n">(조정 후)공용 사용량</th><th class="n">총 사용량</th>':''}
        <th class="n">부담 비율</th><th class="n">청구 금액</th></tr></thead>
      <tbody>
        ${R.rows.filter(r=>r.st==='사용중').map(r=>row4(r,m)).join('')}
        ${R.rows.filter(r=>r.st!=='사용중').map(r=>row4(r,m,'vacr')).join('')}
        <tr class="sumr"><td>합계</td>
          ${R.charge&&isMetered(m.code)?`<td class="n">${fx(R.sumUse)}</td>`:''}
          ${m.unit?`<td class="n">${fx(R.common)}</td>
            <td class="n">${fx(R.rows.reduce((a,r)=>a+r.tot,0))}</td>`:''}
          <td class="n">100.0%</td>
          <td class="n">${won(R.bill+R.vac)}</td></tr>
      </tbody></table></div>
  </div>
  <div class="vfy ${R.diff===0?'ok':'no'}">
    <span class="ttl">${R.diff===0?'검증 일치':'검증 불일치'}</span>
    <span>임차인 <b>${won(R.bill)}</b></span><span style="color:var(--muted)">+</span>
    <span>공실·미청구 <b>${won(R.vac)}</b></span><span style="color:var(--muted)">=</span>
    <span><b>${won(R.bill+R.vac)}</b></span>
    <span style="color:var(--muted)">고지서 <b>${won(R.total)}</b></span>
    ${R.diff?`<span style="margin-left:auto;font-weight:700;color:var(--warn)">차액 ${num(R.diff)}원</span>`:''}
  </div>
  <div class="hint">${(()=>{
    const rf=resolve(m.code).ref, dir=isDirect(m.code);
    if(rf&&rf!==m.code) return `
      고지서 금액을 그 비율대로 나눈 결과입니다.`;
    if(dir) return `금액 입력에서 넣은 금액이 그대로 청구됩니다.`;
    if(!m.unit) return `
      고지서 금액을 <b>${resolve(m.code).basis} 비율</b>로 나눈 결과입니다.`;
    return `
      <b>총 사용량</b>(개별 + 공용) 비율대로 고지서 금액을 나눈 결과입니다.
      계약이 없는 유닛의 금액은 청구하지 않고 건축주가 부담합니다.`;
  })()}</div>
  `;
}
function row4(r,m,cls){
  const R=ratios(m), showM=R.charge&&isMetered(m.code);
  if(r.excl) return `<tr class="exr">
    <td>${cnameST(r,m)}</td>
    ${showM?'<td class="n">—</td>':''}
    ${m.unit?'<td class="n">—</td><td class="n">—</td>':''}<td class="n">—</td>
    <td class="n"><span class="bd mu">안분 제외</span>
      <div class="c2" style="text-align:right">${r.excl.why}</div></td></tr>`;
  return `<tr class="${cls||''}">
    <td>${cnameST(r,m)}</td>
    ${showM?`<td class="n">${r.hasM?fx(r.use):'—'}</td>`:''}
    ${m.unit?`<td class="n">${r.common?fx(r.common):'<span style="color:var(--faint)">—</span>'}</td>
      <td class="n"><b>${fx(r.tot)}</b></td>`:''}
    <td class="n">${(r.ratio*100).toFixed(2)}%</td>
    <td class="n"><b>${won(r.amt)}</b>${r.rnd?`<span class="lock">절사 +${r.rnd}원</span>`:''}</td></tr>`;
}

/* ═══ PAY-12 청구·수납 개요 ═══ */
let f12='2026-08';
/* 이준빌딩 7월 — 원장에서 센다. 청구 계약 수 · 청구액 · 수납액 · 완납 계약 수. 8/5 월 마감 */
function prog7b1(){

function PAY12(){
  const S={설정:{c:'mu',t:'미착수'},미착수:{c:'mu'},작성중:{c:'wa'},확정:{c:'ok'}};
  const rows=BUILDINGS.map(b=>{

    const unpaid=p.amt-p.paid;
    return `<tr>
      <td><div class="c1">${b.name}</div><div class="c2">${b.kind} · ${b.unitCnt}유닛</div></td>
      <td class="st c" onclick="go('pay-10')">
        <span class="stp"><span class="dot2" style="background:var(--${p.settle==='확정'?'ok':p.settle==='작성중'?'warn':'faint'})"></span>

const MERGE_PDF={'(주)아이씨비':true};

/* 이번 회차에 발행할 청구서 — 고정액(약정)과 정산액(PAY-10)을 계약별로 합친다 → 2부

   청구서에 올라오는 항목은 이번 회차 대상뿐이다. 대상 여부는 산정방식에 따라 다르게 정한다.
     고정액   청구 약정의 반복주기·기산일로 판정한다. 금액이 약정에 있으므로 자동 판정된다
     정산     PAY-10 1단계에서 담당자가 선택한 항목이다. 고지서 수령 여부를 시스템이 모른다
              → PAY-1 「이번 회차 대상 항목만 올린다」
   대상이 아닌 항목은 화면에 올리지 않는다. 그 판단은 1단계에서 이미 끝났다. */
function ISSUE(){
  const P=PROG[f1.b]||{}, done=P.inv>0, fixed=P.settle==='확정';
  const all=CTRS.filter(c=>c.b===f1.b&&c.st==='진행중');
  return all.map(c=>{
    /* 정산액을 다른 계약이 부담하는 유닛 — 그 유닛의 안분 결과를 이 계약에 얹는다 */
    const via=all.filter(d=>d.payTo===c.no);
    const lineOf=(x,unit)=>{
      const d=CITEM[x[0]];
      /* 고정액 — 반복주기로 판정. 목업 데이터는 모두 매월이다 */
      if(d.calc!=='고정액'||d.cycle!=='매월'){} else {
        const bd=M(codeOf(x[0])).bill||'세금계산서';
        const sup=x[1], v=isTax(bd)?Math.round(sup*0.1):0;
        return {n:x[0],bill:bd,src:'임대차계약서',supply:sup,vat:v,amt:sup+v,st:'약정',stc:'mu'};
      }
      if(d.calc==='고정액') return null;
      /* 정산 — 1단계에서 선택되지 않았으면 이번 회차 대상이 아니다 */
      const code=codeOf(x[0]), m=M(code), b=BILL[code];
      if(!(f1.b==='b1'&&b&&b.on)) return null;
      const st=resolve(code), ev=`${st.by||m.src||''} ${st.doc||m.doc||''}`.trim();
      const S={n:x[0],bill:m.bill,src:ev,
               st:fixed?'정산 확정':'정산 미확정', stc:fixed?'ok':'wa'};
      if(!(billTotal(m)>0)) return {...S,supply:null,vat:null,amt:null};
      /* 유닛이 여럿인 계약은 유닛별 산출 결과를 합친다 */
      const us=Array.isArray(unit)?unit:[unit];
      const rs=calc(m).rows.filter(r=>us.includes(r.no));
      if(!rs.length) return {...S,supply:null,vat:null,amt:null};
      const sm=k=>rs.reduce((a,r)=>a+r[k],0);
      return {...S,supply:sm('supply'),vat:sm('vat'),amt:sm('amt')};
    };
    const lines=c.it.map(x=>lineOf(x,c.units||c.no)).filter(Boolean);
    /* 대납분 — 자기 정산 항목을 그 유닛에 적용해 산출한다 */
    /* 대납분 — 금액이 0인 항목은 싣지 않는다. 계량기를 공유해 사용분이 0인 경우다 */
    via.forEach(d=>c.it.filter(x=>CITEM[x[0]].calc==='정산').forEach(x=>{
      const l=lineOf(x,d.no);
      if(l&&l.amt!==0) lines.push({...l,via:`${d.no}|${d.ten}`});
    }));
    const sum=lines.reduce((a,l)=>a+(l.amt||0),0);
    const sup=lines.reduce((a,l)=>a+(l.supply||0),0);
    const vat=lines.reduce((a,l)=>a+(l.vat||0),0);
    const miss=lines.filter(l=>l.amt==null).length;
    const k=c.b+c.no;
    return {...c,k,lines,sum,sup,vat,miss,via,
            due:dueOf(k),st:done?'발행 완료':'발행 대기'};
  });
}

/* 거래내역 해석 — 머리글 행을 찾아 그 앞을 버리고, 열 이름으로 네 열을 찾는다 → 4.6.1
   은행마다 열 이름과 순서가 다르므로 위치가 아니라 이름으로 찾고, 결과는 은행별로 저장한다 */
function parseBank(raw){
  const cut=l=>l.split(/\t| {2,}/).map(x=>x.trim());
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const hi=lines.findIndex(l=>/거래일시/.test(l)&&/입금/.test(l));
  const head=cut(lines[hi]);
  const col=re=>head.findIndex(h=>re.test(h));
  const map={dt:col(/거래일시/),kind:col(/^적요$/),name:col(/기재내용/),amt:col(/^입금/),out:col(/^지급/)};
  const n=v=>+String(v||'0').replace(/,/g,'')||0;
  const rows=lines.slice(hi+1).map((l,i)=>{const c=cut(l);
    return {no:+c[0]||i+1,dt:(c[map.dt]||'').replace(/\./g,'-'),kind:(c[map.kind]||'').normalize('NFKC'),
            name:c[map.name]||'',amt:n(c[map.amt]),out:n(c[map.out])};});
  return {skip:hi,head,map,rows,dep:rows.filter(r=>r.amt>0),wd:rows.filter(r=>!(r.amt>0))};
}

/* 연체료(예상) — 구간별로 계산한다 → 4.4
   납부마감일 다음날부터 오늘까지를 수납이 들어올 때마다 끊고, 구간마다 그 동안의 미납액 × 연체이자율 × 일수 ÷ 365.
   구간마다 원 미만 절사 후 합한다. 내역서의 줄과 합계가 맞아야 하기 때문이다 */
const rateOf=k=>{const c=CTRS.find(x=>x.b+x.no===k);return (c&&c.rate)||8;};
/* 연체료 정리일 — 수납 처리에서 연체료를 받았거나 깎아 준 날. 그날까지의 연체료는 다시 세지 않는다 → 4.4.3 */
const FEE_CUT={};
function lateCalc(k,ym,until){
  const end=until||TODAY_S, cutD=FEE_CUT[k];
  const it=BILLS.filter(i=>i.k===k&&i.ym===ym&&!i.fee), due=dueStr(ym), rate=rateOf(k);   /* 연체료에는 연체료를 붙이지 않는다 */
  const bill=it.reduce((a,i)=>a+i.amt,0);
  const ev=it.flatMap(i=>PAYEV[i.id]||[]);
  let bal=bill-ev.filter(e=>dnum(e.date)<=dnum(due)).reduce((a,e)=>a+e.amt,0);
  const later=ev.filter(e=>dnum(e.date)>dnum(due)&&dnum(e.date)<=dnum(end)).sort((a,b)=>dnum(a.date)-dnum(b.date));
  const periods=[]; let from=due;
  const cut=(to)=>{const days=dnum(to)-dnum(from);
    if(days>0&&bal>0) periods.push({from,to,days,bal,fee:Math.floor(bal*rate/100*days/365)});from=to;};
  later.forEach(e=>{cut(e.date);bal-=e.amt;});
  if(dnum(end)>dnum(from)) cut(end);
  /* 정리일 이전 구간은 빼고, 걸친 구간은 정리일부터 다시 센다 */
  const P=!cutD?periods:periods.filter(p=>dnum(p.to)>dnum(cutD)).map(p=>{if(dnum(p.from)>=dnum(cutD))return p;
    const days=dnum(p.to)-dnum(cutD);return {...p,from:cutD,days,fee:Math.floor(p.bal*rate/100*days/365)};});
  return {rate,periods:P,fee:P.reduce((a,p)=>a+p.fee,0)};
}

/* 별칭 — 담당자가 등록한 입금자명. 등록된 것만 자동 매칭한다 → 4.6.3 */
const rcAlias=nm=>RC.alias[nm]||null;

function rcPrefix(nm,B){
  const pre=(a,b)=>{let i=0;while(i<a.length&&a[i]===b[i])i++;return i;};
  const hit=Object.keys(B).filter(k=>pre(k,nm)>=4);

}

/* 배분 — 오래된 회차 → 같은 회차 안에서는 우선순위 → 같은 우선순위면 계약 순서 → 4.3.1
   입금액이 청구액과 같은지 따지지 않는다. 전액이면 결과가 같고, 모자라면 남는 것이 미납이다.
   이번 달 청구서와 같은 금액이 들어와도 미납액부터 채운다 */
function rcPlan(amt,keys,paid,extra){
  const ci=k=>CTRS.findIndex(c=>c.b+c.no===k);
  const open=[...BILLS,...(extra||[])].filter(i=>keys.includes(i.k))
    .map(i=>({...i,pr:prioOf(i.n.split(' ')[0]),due:i.amt-(paid[i.id]||0)})).filter(i=>i.due>0)
    .sort((a,b)=>a.ym<b.ym?-1:a.ym>b.ym?1:a.pr!==b.pr?a.pr-b.pr:ci(a.k)-ci(b.k));
  let r=amt;const lines=[];
  for(const i of open){if(r<=0)break;const a=Math.min(r,i.due);
    lines.push({...i,pay:a,after:a===i.due?'완납':'부분납'});r-=a;}
  /* all — 이 입금이 채우지 못한 미납 청구까지. 미리보기는 배분 후 남는 미납을 모두 보여줘야 한다 */
  const all=open.map(i=>{const l=lines.find(x=>x.id===i.id);return l||{...i,pay:0,after:'납부전'};});
  return {how:open.length?'우선순위 배분':'청구 없음',lines,all,rest:r};
}

/* 매칭 추정 — 담당자가 고른 임차인 → 등록된 입금자명 → 상호 일치·앞자리 일치(후보) 순 */
function rcGuess(d,B){
  const nm=normName(d.name);
  if(RC.pre[d.no]) return {biz:RC.pre[d.no],st:'지정',basis:'담당자 지정',nm};
  const a=rcAlias(nm);
  if(a&&B[a]) return {biz:a,st:'자동',basis:'등록된 입금자명',nm};
  const c=rcPrefix(nm,B);
  if(c) return {biz:c,st:'후보',basis:c===nm?'상호 일치':'상호 앞자리 일치',nm};
  return {biz:null,st:'미매칭',basis:'',nm};
}

function rcRun(){

    const g=rcGuess(d,B);
    res[d.no]={...g,cand:g.biz,wait:true};

  return res;
}

    return `<div class="mqi ${on?'on':''} ${x.done||x.ex?'dn':''}" onclick="rcSel(${q.no})">

      <span class="n">${won(q.amt)}</span><span class="g">${tag}</span></div>`;
  }).join('');

  /* 선택한 입금 */
  let panel='';
  const x=RC.dec[d.no]||{};
  if(x.done){
    const r=x.done;
    panel=`<div class="card"><div class="cc" style="padding:18px 20px">
      <div style="display:flex;align-items:center;gap:8px"><span class="bd ok">확정</span>
        <span class="c2" style="margin:0">${d.dt} · 계좌이체 · 은행거래내역매칭 · 김영준 · 매칭 근거 <b>${r.basis}</b></span>
        <button class="btn sm" style="margin-left:auto" onclick="alert('PAY-9 수납 내역 수정 및 취소 — 배분 재조정 또는 무효 처리. 입금액은 수정할 수 없다')">수정·취소</button></div>
      <div style="display:flex;align-items:baseline;gap:14px;margin-top:8px">
        <span style="font-size:17px;font-weight:700">${d.name}</span><span class="big">${won(d.amt)}</span>
        <span class="c2" style="margin:0">→ ${B[r.biz]?B[r.biz].n:''}</span></div></div></div>
    <div class="card"><div class="tw"><table class="nowr">
      <thead><tr><th>계약고유명</th><th>청구항목</th><th class="c">우선순위</th>

      <tbody>${r.lines.map(l=>{const c=CTRS.find(y=>y.b===RC.b&&y.no===l.no), left=l.amt-(PAID[l.id]||0);return `<tr>

      </tbody></table></div></div>
    ${r.rest>0?`<div class="fnd wa3"><span class="h">미배분 ${won(r.rest)}</span>

      <div style="margin-top:8px;display:flex;gap:8px"><button class="btn sm">환불</button><button class="btn sm">다음 회차 배분</button></div></div>`:''}
    ${(()=>{const left=BILLS.filter(i=>B[r.biz]&&B[r.biz].ctrs.some(c=>c.b+c.no===i.k))

      return left?`<div class="fnd wa3"><span class="h">${B[r.biz].n} 남은 미납 ${won(left)}</span>
        이 입금으로 채우지 못한 청구가 있습니다. 수납 내역·미납 관리에서 확인하세요.</div>`:'';})()}
    <div class="hint">배분 후 미납은 지금 원장 기준입니다. 계약별 납부상태는 수납 내역에서 봅니다.
      <b class="lk" onclick="go('pay-6')">수납 내역으로 이동 →</b></div>`;
  }else if(x.ex){
    panel=`<div class="card"><div class="cc" style="padding:18px 20px">
      <div class="c2" style="margin:0">무시함 — 수납으로 기록하지 않습니다</div>
      <div style="font-size:15px;font-weight:700;margin:6px 0">${d.name}</div><div class="big">${won(d.amt)}</div>
      <div style="margin-top:14px"><button class="btn sm" onclick="rcUnignore(${d.no})">되돌리기</button></div></div></div>`;
  }else{
    const g=rcGuess(d,B), pl=rcPreview(d,g.biz,B);
    const registered=g.st==='자동';
    const sumBefore=pl?pl.lines.reduce((a,l)=>a,0):0;
    const openAll=g.biz?BILLS.filter(i=>B[g.biz].ctrs.some(c=>c.b+c.no===i.k))

      :`<div class="tw"><table class="nowr">

        <tbody>${pl.all.map(l=>{const c=CTRS.find(y=>y.b===RC.b&&y.no===l.no);return `<tr${l.pay?'':' class="dim"'}>
          <td>${cnameHTML(bn.alias,l.no,c.ten)}</td><td>${ymTag(l)}</td><td class="c">${l.pr}</td>

          <tr class="sumr"><td colspan="3">합계</td>

            <td class="n">${(v=>v?`<span style="color:var(--warn)">${won(v)}</span>`:'0원')(pl.all.reduce((a,l)=>a+l.due-l.pay,0))}</td></tr>
        </tbody></table></div>
        ${pl.rest?`<div class="fnd wa3" style="margin:0;border-radius:0 0 var(--r) var(--r)"><span class="h">남는 금액 ${won(pl.rest)}</span>

    panel=`
    <div class="card"><div class="cc" style="padding:18px 20px">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="bd ${BADGE6[g.st]}">${LABEL6[g.st]}</span>
        <span class="c2" style="margin:0">${d.dt} · ${d.kind} · 비교용 이름 <b>${g.nm}</b></span></div>
      <div style="display:flex;align-items:baseline;gap:14px;margin-top:8px">
        <span style="font-size:17px;font-weight:700">${d.name}</span><span class="big">${won(d.amt)}</span></div>
    </div></div>
    <div class="isec"><div class="ish"><span class="isn">1</span>임차인</div>
      <div class="card"><div class="cc" style="padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">

        </select>
        ${g.biz?(registered?`<span class="c2" style="margin:0">등록된 입금자명으로 찾았습니다</span>`
          :`${g.st==='후보'?`<span class="c2" style="margin:0;color:var(--warn)">상호가 비슷한 임차인을 미리 골랐습니다. 맞는지 확인하세요.</span>`:''}
            <label style="font-size:12.5px"><input type="checkbox" ${RC.reg[d.no]!==false?'checked':''}
              onchange="rcRegTog(${d.no},this.checked)"> 앞으로 <b>${d.name}</b>을(를) 이 임차인의 입금자명으로 등록</label>`)
          :'<span class="c2" style="margin:0">입금자명으로 임차인을 찾지 못했습니다. 직접 고르세요.</span>'}
      </div></div></div>
    ${g.biz?`<div class="isec"><div class="ish"><span class="isn">2</span>배분 미리보기
        <span class="c2" style="margin:0 0 0 6px;font-weight:400">${B[g.biz].n} 미납 ${won(openAll)} → ${won(openAll-(d.amt-pl.rest))}</span></div>
      <div class="card">${tbl}</div>
      <div class="hint">오래된 회차부터, 같은 회차 안에서는 우선순위 순서로 채웁니다. 확정하면 이대로 원장에 기록됩니다.</div></div>`:''}
    <div style="display:flex;gap:8px;margin-top:6px">
      <button class="btn" onclick="rcIgnore(${d.no})">무시</button>
      <span class="c2" style="margin:auto 0 auto 4px">임차인 입금이 아닐 때</span>
      <button class="btn pri" style="margin-left:auto" ${g.biz?'':'disabled'} onclick="rcConfirm(${d.no})">확정하고 다음 입금 →</button>
    </div>`;
  }
  const allDone=Q.every(q=>!rcIsOpen(q));
  return head+`
  ${allDone?`<div class="fnd"><span class="h">모든 입금을 처리했습니다</span>
    계약별로 다 받았는지는 수납 내역에서 확인하세요. <b class="lk" onclick="go('pay-6')">수납 내역으로 이동 →</b></div>`:''}
  <div class="mw">
    <div class="mq"><div class="mqh">대기열 <span class="c2" style="margin:0">입금일시 순</span></div>${queue}
</div>
    <div>${panel}</div>
  </div>`;
}

/* ═══ PAY-6 수납 내역 — 계약 기준 조회 화면. 한 계약 × 한 달이 한 행 ═══ */
let g6={}, g6All=false;
const g6Open=k=>(k in g6)?g6[k]:g6All;
const g6Tog=k=>{g6[k]=!g6Open(k);render(true);};
const g6Set=v=>{g6All=v;g6={};render(true);};
function PAY6(){
  const bn=BUILDINGS.find(x=>x.id===RC.f.b)||BUILDINGS[0];
  const has=RC.f.b===RC.b&&['2026-05','2026-06','2026-07'].includes(RC.f.ym);
  const waitN=RC.f.b===RC.b?RC.P.dep.filter(rcIsOpen).length:0;
  const all=has?CTRS.filter(c=>c.b===RC.b&&c.st==='진행중')
    .map(c=>({c,k:c.b+c.no,...ctrPay(c.b+c.no,RC.f.ym)})).filter(x=>x.st):[];
  const rows=all.filter(x=>!RC.f.st||x.st===RC.f.st);
  const anyOp=rows.some(x=>g6Open(x.k));
  const T=rows.reduce((a,x)=>({bill:a.bill+x.bill,paid:a.paid+x.paid,due:a.due+x.due}),{bill:0,paid:0,due:0});
  const dash='<span style="color:var(--faint)">—</span>';
  const body=rows.map(x=>{
    const op=g6Open(x.k);
    const sub=!op?'':x.it.map(i=>`
      <div class="schr ctr sub"><div class="nm">${i.n}</div>
        <div class="n c2">${won(i.amt)}</div><div class="n c2">${i.paid?won(i.paid):dash}</div>
        <div class="n">${i.due?`<span style="color:var(--warn)">${won(i.due)}</span>`:dash}</div>
        <div class="c"><span class="bd ${PST[i.st]}">${i.st}</span></div></div>`).join('');
    return `<div class="schr ctr grp" onclick="g6Tog('${x.k}')">
      <div class="nm"><span class="tg ${op?'op':''}">${ic('chev',16)}</span>${cnameHTML(bn.alias,x.c.no,x.c.ten)}</div>
      <div class="n">${won(x.bill)}</div>
      <div class="n">${x.paid?won(x.paid):dash}</div>
      <div class="n">${x.due?`<b style="color:var(--warn)">${won(x.due)}</b>`:dash}</div>
      <div class="c"><span class="bd ${PST[x.st]}">${x.st}</span></div></div>`+sub;
  }).join('');
  return `
  <div class="ph"><h1>수납 내역</h1><span class="sid">PAY-6</span>
  </div>
  <div class="fbar">
    <select onchange="setRC('b',this.value)">
      ${BUILDINGS.map(b=>`<option value="${b.id}" ${RC.f.b===b.id?'selected':''}>${b.name}</option>`).join('')}
    </select>
    <select onchange="setRC('ym',this.value)">
      ${[['2026-08','2026년 8월'],['2026-07','2026년 7월'],['2026-06','2026년 6월'],['2026-05','2026년 5월']].map(([v,t])=>
        `<option value="${v}" ${RC.f.ym===v?'selected':''}>${t}</option>`).join('')}
    </select>
    <select onchange="setRC('st',this.value)">
      ${['','완납','부분납','납부전','미납'].map(v=>`<option value="${v}" ${RC.f.st===v?'selected':''}>${v||'전체 납부상태'}</option>`).join('')}
    </select>
    ${rows.length?`<span style="margin-left:auto;display:flex;gap:8px">
      <button class="btn sm" onclick="g6Set(${anyOp?'false':'true'})">${anyOp?'전체 접기':'전체 펼치기'}</button></span>`:''}
  </div>
  ${waitN?`<div class="fnd wa3"><span class="h">확정 전 입금 ${waitN}건</span>
    아직 기록되지 않은 입금이 있어 이미 낸 계약도 <b>미납</b>으로 보일 수 있습니다.
    <b class="lk" onclick="go('pay-13')">입금 매칭으로 이동 →</b></div>`:''}
  ${!rows.length?`<div class="tbl"><div class="empty"><div class="t">${has?'조건에 맞는 계약이 없습니다':'이 달의 청구가 없습니다'}</div>
     ${has?'다른 납부상태를 선택해 보세요.':'청구서를 발행하면 계약별 수납 상태가 표시됩니다.'}</div></div>`
  :`<div class="tbl schl">
    <div class="schr ctr hd"><div>계약고유명 · 청구항목</div><div class="n">청구액</div><div class="n">수납액</div>
      <div class="n">미납액</div><div class="c">납부상태</div></div>
    ${body}
    <div class="schr ctr sum"><div>합계 <span class="lock">계약 ${rows.length}</span></div>
      <div class="n">${won(T.bill)}</div><div class="n">${won(T.paid)}</div>
      <div class="n">${T.due?`<span style="color:var(--warn)">${won(T.due)}</span>`:'—'}</div><div></div></div>
  </div>`}
  <div class="hint">
    선택한 달의 청구를 계약별로 다 받았는지 봅니다. 금액은 부가세 포함입니다.<br>
    밀린 달 전부의 미납과 미납 안내는 미납 관리에서, 입금 한 건 한 건은 입금 매칭에서 봅니다.</div>`;
}

/* ═══ 수납 처리 — 현금·카드로 받았거나 보증금에서 뺀 돈. 은행 입금은 입금 매칭(PAY-13)에서 → PAY-2 · CTR-3 ═══ */
let pm=null, pmSeq=0;
const MANUAL_DEP=[];   /* 보증금상계 — 원장의 임대보증금에서 뺀다 */
const PAY_HOW=['현금','카드','계좌이체','보증금상계'];
/* 이 계약의 연체료 — 받은 날까지. 이미 청구한 연체료는 빼고 센다 */
const feeUntil=(k,d)=>[...new Set(BILLS.filter(i=>i.k===k).map(i=>i.ym))].reduce((a,ym)=>a+lateCalc(k,ym,d).fee,0);
function openPay(k){
  const a=arrears(CTRS.find(c=>c.b+c.no===k));
  const full=feeUntil(k,TODAY_S);
  /* 연체료만 남은 계약은 연체료를 정리하러 연 것이다 → 기본 전액. 청구 미납이 있으면 기본은 이번엔 정리 안 함 */
  const mode=!a.due&&full?'full':'later';
  pm={k,date:TODAY_S,amt:a.due+(mode==='full'?full:0),how:'현금',memo:'',feeMode:mode,feeOn:mode!=='later',feeFull:full,fee:full};
  DRAWER='pay';render(true);
}
const numOf=v=>Math.max(0,parseInt(String(v).replace(/[^0-9]/g,''))||0);
/* 받는 금액은 연체료를 넣고 빼는 만큼 따라 움직인다 */
function setPm(f,v){
  const was=pm.feeOn?pm.fee:0;
  if(f==='amt') pm.amt=numOf(v);
  else if(f==='fee'){pm.feeMode='custom';pm.feeOn=true;pm.fee=Math.min(numOf(v),pm.feeFull);}
  else if(f==='feeOn') setFeeMode(v===true||v==='1'?'full':'later');
  else if(f==='feeMode') setFeeMode(v);
  else if(f==='date'){pm.date=v;pm.feeFull=feeUntil(pm.k,v);setFeeMode(pm.feeMode);}
  else pm[f]=v;
  if(f!=='amt') pm.amt=Math.max(0,pm.amt-was+(pm.feeOn?pm.fee:0));
  render(true);
}
/* 연체료 처리 5가지 — 이번엔 정리 안 함 · 전액 받기 · 50% 감면 · 직접 입력 · 전액 감면 → 4.4.3 */
const FEE_MODES=[['later','이번엔 안 함'],['full','전액 받기'],['half','50% 감면'],['custom','직접 입력'],['waive','전액 감면']];
function setFeeMode(m){
  pm.feeMode=m; pm.feeOn=m!=='later';
  pm.fee=m==='half'?Math.floor(pm.feeFull/2):m==='waive'?0:m==='custom'?Math.min(pm.fee,pm.feeFull):pm.feeFull;
}
/* 받기로 한 연체료 — 받은 날 청구 건으로 만든다. 확정 전에는 미리보기에만 쓴다 */
function feeBill(){
  if(!pm.feeOn||!pm.fee) return null;
  const c=CTRS.find(x=>x.b+x.no===pm.k), off=pm.feeFull-pm.fee;
  return {id:`fee|${pm.k}|${pm.date}|${pmSeq+1}`,ym:pm.date.slice(0,7),k:pm.k,no:c.no,n:'연체료',amt:pm.fee,
    fee:true,date:pm.date,memo:`연체료 (${pm.date.slice(5).replace('-','.')}까지${off?` · ${won(pm.feeFull)} 중 ${won(off)} 감면`:''})`};
}
/* 배분 — 입금 매칭과 같은 규칙. 현금·카드는 같은 임차인의 이 건물 계약 전체에,
   보증금상계는 그 보증금이 걸린 이 계약에만 → 4.3.1 */
function payPlan(){
  const c=CTRS.find(x=>x.b+x.no===pm.k);
  const keys=pm.how==='보증금상계'?[pm.k]
    :CTRS.filter(x=>x.b===c.b&&(x.st==='진행중'||x.b+x.no===pm.k)&&normName(x.ten)===normName(c.ten)).map(x=>x.b+x.no);
  const fb=feeBill();
  return rcPlan(pm.amt,keys,PAID,fb?[fb]:[]);
}
function payConfirm(){
  const pl=payPlan(); if(pl.rest>0||(!pl.lines.length&&!pm.feeOn)) return;
  if(pm.how==='보증금상계'&&pm.amt>ledgerOf(pm.k).bal.임대보증금) return;
  const fb=feeBill(); if(fb) BILLS.push(fb);
  if(pm.feeOn) FEE_CUT[pm.k]=pm.date;   /* 받았든 깎았든 이날까지의 연체료는 정리됐다 */
  const dep='m'+(++pmSeq), src=`${pm.date.slice(5).replace('-','.')} ${pm.how}`;
  pl.lines.forEach(l=>addPay(l.id,l.pay,pm.date,src,dep));

}

function arrears(c){
  const k=c.b+c.no, yms=[...new Set(BILLS.filter(i=>i.k===k).map(i=>i.ym))].sort().reverse();
  const months=yms.map(ym=>{const p=ctrPay(k,ym), L=lateCalc(k,ym);
    /* 늦게라도 다 낸 달 — 마지막 수납일까지 며칠 늦었는지. 연체료가 왜 남았는지 보여준다 */
    const byD={};
    p.it.forEach(i=>(PAYEV[i.id]||[]).forEach(e=>{byD[e.date]=(byD[e.date]||0)+e.amt;}));
    const pays=Object.entries(byD).sort((x,y)=>x[0]<y[0]?-1:1).map(([date,amt])=>({date,amt}));
    const lastPay=pays.length?pays[pays.length-1].date:null;
    const lateDone=!p.due&&lastPay?Math.max(0,dnum(lastPay)-dnum(dueStr(ym))):0;
    return {ym,due:p.due,bill:p.bill,paid:p.paid,st:p.st,days:p.due?lateDays(ym):0,fee:L.fee,periods:L.periods,pays,lastPay,lateDone};})
    .filter(m=>m.due>0||m.fee>0);
  const owe=months.filter(m=>m.due>0);
  const lastDep=RC.P.dep.filter(d=>{const x=RC.dec[d.no];return x&&x.done&&x.done.lines.some(l=>l.k===k);})
    .map(d=>d.dt).sort().pop()||null;
  return {c,k,months,owe,rate:rateOf(k),due:owe.reduce((a,m)=>a+m.due,0),fee:months.reduce((a,m)=>a+m.fee,0),
    days:Math.max(0,...owe.map(m=>m.days)),from:owe.length?owe[owe.length-1].ym:null,lastDep};
}

  return e;};

      <td>${c.st==='진행중'?ddBadge(end):'<span style="color:var(--faint)">—</span>'}</td>
      <td>${cnameHTML(BA(c.b),c.no,c.ten)}</td>
      <td><span class="bd ${c.st==='진행중'?'ok':'mu'}">${c.st}</span></td>
      <td>${d8(c.base)} - ${d8(end)} <span class="c2" style="margin:0 0 0 6px">보증금 ${man(ctrDeposit(c))} · 임대료 ${man(ctrAmt(c,'임대료'))} · 관리비 ${man(ctrAmt(c,'고정관리비'))}</span></td>
      <td class="c2" style="margin:0">확정기간계약</td></tr>`).join('')}
      ${rows.length?'':'<tr><td colspan="5"><div class="empty">조건에 맞는 계약이 없습니다</div></td></tr>'}
    </tbody></table></div></div>
  <div class="hint">행을 누르면 계약 상세로 들어갑니다. 원장은 계약 상세의 원장정보 탭에 있습니다.<br>
    목업의 계약 종료일·유형·보증금은 예시값입니다.</div>`;
}

/* CTR-3 머리 — 제목 · 버튼 · 탭 */
function CTR3head(c,k){
  const bn=BUILDINGS.find(x=>x.id===c.b)||BUILDINGS[0];
  return `
  <div class="ph"><h1>${cnameHTML(bn.alias,c.no,c.ten).replace('class="cn"','class="cn" style="font-size:19px"')}</h1><span class="sid">CTR-3</span>
    <div class="act">
      <button class="btn" onclick="go('ctr-1')">목록</button>
      <button class="btn" onclick="openPay('${k}')">수납 처리</button>
      ${tab3c==='원장정보'?`<button class="btn pri" onclick="alert('원장 출력 — 선택한 기간·계정의 원장을 거래내역서 PDF로 내려받거나 임차인 담당자에게 보낸다')">원장 출력</button>`:''}</div>
  </div>
  <div class="tabs">
    ${['요약','임차인정보','원장정보','청구항목정보','자료보관'].map(t=>`<button class="${t===tab3c?'on':''}" onclick="tab3c='${t}';render()">${t}</button>`).join('')}
  </div>`;
}
/* CTR-3 요약 탭 — 계약·임대 정보. 잔액은 원장에서 */
function CTR3sum(c,k){
  const bn=BUILDINGS.find(x=>x.id===c.b)||BUILDINGS[0], L=ledgerOf(k), end=ctrEnd(c);
  const d8=d=>d.replace(/-/g,'.');
  return `
  <div class="two">
    <div class="card"><div class="ct">계약정보<span class="ca"><button class="btn sm">수정</button></span></div><div class="cc"><dl class="dl">
      <dt>건물</dt><dd>${bn.name}<span class="lock">건물주 ${bn.owner}</span></dd>
      <dt>유닛</dt><dd>${c.no}<span class="lock">수정 불가</span></dd>
      <dt>대표임차인</dt><dd>${c.ten}</dd>
      <dt>계약상태</dt><dd><span class="bd ${c.st==='진행중'?'ok':'mu'}">${c.st}</span></dd>
      <dt>계약유형</dt><dd>확정기간계약</dd>
      <dt>계약기간</dt><dd>${d8(c.base)} - ${d8(end)} ${c.st==='진행중'?ddBadge(end):''}</dd>
    </dl></div></div>
    <div class="card"><div class="ct">임대정보</div><div class="cc"><dl class="dl">
      <dt>미납 잔액</dt><dd><b style="${L.bal.매출채권?'color:var(--warn)':''}">${won(L.bal.매출채권)}</b>
        <span class="lk" style="margin-left:8px;font-size:12px" onclick="tab3c='원장정보';render()">원장 보기</span></dd>
      <dt>보증금 잔액</dt><dd>${won(L.bal.임대보증금)}</dd>
      <dt>임대료</dt><dd>${won(ctrAmt(c,'임대료'))}<span class="lock">월 · 부가세 별도</span></dd>
      <dt>고정관리비</dt><dd>${ctrAmt(c,'고정관리비')?won(ctrAmt(c,'고정관리비')):'—'}<span class="lock">월 · 부가세 별도</span></dd>
      <dt>청구일 · 납부마감일</dt><dd>${bn.billDay} · ${bn.dueDay}</dd>
      <dt>연체이자율</dt><dd>연 ${rateOf(k)}%</dd>
    </dl></div></div>
  </div>
  <div class="hint">목업의 계약 종료일·유형·보증금은 예시값입니다.</div>`;
}

/* ═══ CTR-3 계약 원장 — 이 계약의 모든 돈 거래를 있는 그대로. 추가만 하고 고치지 않는다 ═══ */
let f3={per:'',acc:''};
const setF3=(k,v)=>{f3[k]=v;render();};
const isTaxItem=n=>{const m=MASTER.find(x=>x.name===n.split(' ')[0]);return m?isTax(m.bill):true;};
function ledgerOf(k){
  const c=CTRS.find(x=>x.b+x.no===k), rows=[];
  const rent=((c.it||[]).find(x=>x[0]==='임대료')||[])[1]||0;
  /* 보증금 — 목업 예시값(월 임대료 × 10) */
  rows.push({date:c.base,type:'보증금 예치',acc:'임대보증금',memo:'계약 보증금 (예시값)',item:'계약 보증금 (예시값)',g:'dep',inc:rent*10,sup:null,vat:null,ord:0});
  BILLS.filter(i=>i.k===k).forEach(i=>{
    const tax=isTaxItem(i.n), sup=tax?Math.round(i.amt/1.1):i.amt;
    const ymL=i.ym.slice(2).replace('-','.')+'월분';
    rows.push({date:i.date||i.ym+'-19',type:'청구',acc:'매출채권',memo:i.memo||`${ymL} ${i.n}`,item:i.memo||`${ymL} ${i.n}`,
      g:i.fee?'fee'+i.id:'bill'+i.ym,ym:i.ym,ttl:i.memo,
      inc:i.amt,sup,vat:i.amt-sup,ord:1,pr:prioOf(i.n.split(' ')[0])});
    (PAYEV[i.id]||[]).forEach(e=>rows.push({date:e.date,type:'수납',acc:'매출채권',
      memo:`${i.fee?'연체료':ymL+' '+i.n} ← ${e.src}`,item:i.fee?'연체료':`${ymL} ${i.n}`,src:e.src,g:'pay'+e.dep,dec:e.amt,sup:null,vat:null,ord:2,pr:prioOf(i.n.split(' ')[0]),
      hand:e.dep.startsWith('m'),sq:e.sq}));
  });
  /* 보증금상계 — 같은 돈이 임대보증금에서 빠지고(차변) 매출채권을 채운다(대변) */
  MANUAL_DEP.filter(m=>m.k===k).forEach(m=>rows.push({date:m.date,type:'보증금 차감',acc:'임대보증금',
    memo:'미납 청구에 상계',item:'미납 청구에 상계',g:'dd'+m.dep,dec:m.amt,sup:null,vat:null,ord:2,sq:m.sq}));
  rows.sort((a,b)=>dnum(a.date)-dnum(b.date)||a.ord-b.ord||(a.sq||0)-(b.sq||0)||(a.pr||0)-(b.pr||0));
  const bal={매출채권:0,임대보증금:0};
  rows.forEach(r=>{bal[r.acc]+=(r.inc||0)-(r.dec||0);r.bal=bal[r.acc];
    /* 차변·대변 — 매출채권(자산)은 늘면 차변, 임대보증금(부채)은 늘면 대변 */
    const as=r.acc==='매출채권';r.dr=as?r.inc:r.dec;r.cr=as?r.dec:r.inc;});
  return {c,rows,bal};
}
let tab3c='요약', g3={}, g3All=false;
const g3Open=k=>(k in g3)?g3[k]:g3All;
const g3Tog=k=>{g3[k]=!g3Open(k);render(true);};
function CTR3(k){
  const c=CTRS.find(x=>x.b+x.no===k);
  if(!c) return TODO('ctr-1');
  if(tab3c!=='원장정보') return CTR3head(c,k)+(tab3c==='요약'?CTR3sum(c,k)
    :`<div class="tbl"><div class="empty"><div class="t">아직 만들지 않은 탭입니다</div>목업에는 요약과 원장정보 탭만 있습니다.</div></div>`);
  const bn=BUILDINGS.find(x=>x.id===c.b)||BUILDINGS[0];
  const L=ledgerOf(k);
  const from=f3.per?new Date((dnum(TODAY_S)-({'1':30,'3':91}[f3.per]))*864e5)
    .toISOString().slice(0,10):null;
  const rows=L.rows.filter(r=>(!f3.acc||r.acc===f3.acc)&&(!from||dnum(r.date)>=dnum(from))).slice().reverse();
  const fee=[...new Set(BILLS.filter(i=>i.k===k).map(i=>i.ym))].reduce((a,ym)=>a+lateCalc(k,ym).fee,0);
  const TP={'청구':'ac','수납':'ok','보증금 예치':'mu','보증금 차감':'wa'};
  const dash='<span style="color:var(--faint)">—</span>';
  return CTR3head(c,k)+`
  <div class="fbar">
    <select onchange="setF3('per',this.value)">
      ${[['','모든 거래'],['1','최근 1개월'],['3','최근 3개월']].map(([v,t])=>`<option value="${v}" ${f3.per===v?'selected':''}>${t}</option>`).join('')}
    </select>
    <select onchange="setF3('acc',this.value)">
      ${[['','전체 계정'],['매출채권','매출채권 (청구·수납)'],['임대보증금','임대보증금']].map(([v,t])=>`<option value="${v}" ${f3.acc===v?'selected':''}>${t}</option>`).join('')}
    </select>
    <span class="c2" style="margin-left:auto">미납 잔액 <b style="color:${L.bal.매출채권?'var(--warn)':'var(--ink)'}">${won(L.bal.매출채권)}</b>
      · 보증금 잔액 <b style="color:var(--ink)">${won(L.bal.임대보증금)}</b>${fee?` · 연체료(예상) ${won(fee)}`:''}</span>
  </div>
  ${(()=>{
    /* 묶음 — 청구는 청구서 하나, 수납은 입금 하나, 보증금은 거래 하나. rows는 이미 최근 순이다 */
    const G=[];rows.forEach(r=>{const last=G[G.length-1];
      if(last&&last.g===r.g&&last.date===r.date) last.items.push(r); else G.push({g:r.g,date:r.date,type:r.type,acc:r.acc,items:[r]});});
    G.forEach(x=>{const it=x.items;x.bal=it[0].bal;   /* 최근 순이므로 첫 행이 묶음 끝의 잔액 */
      x.dr=it.reduce((a,r)=>a+(r.dr||0),0);x.cr=it.reduce((a,r)=>a+(r.cr||0),0);
      x.sup=it.some(r=>r.sup!=null)?it.reduce((a,r)=>a+(r.sup||0),0):null;x.vat=it.reduce((a,r)=>a+(r.vat||0),0);
      x.title=it[0].ttl?it[0].ttl:x.type==='청구'?`${it[0].ym.slice(2).replace('-','.')}월분 청구서`:x.type==='수납'?(it[0].src==='이전 입금'?'이전 입금':`${it[0].src} ${it[0].hand?'수납':'입금'}`):it[0].item;
      x.key=x.g+'|'+x.date;});
    const anyOp=G.some(x=>g3Open(x.key));
    const body=G.map(x=>{const op=g3Open(x.key), many=x.items.length>1;
      return `<div class="schr led grp" onclick="${many?`g3Tog('${x.key}')`:''}">
        <div class="nm"><span class="tg ${op?'op':''}" style="${many?'':'visibility:hidden'}">${ic('chev',16)}</span>${x.date.slice(2).replace(/-/g,'.')}</div>
        <div><span class="bd ${TP[x.type]||'mu'}">${x.type}</span></div>
        <div class="c2" style="margin:0">${x.acc}</div>
        <div>${x.title}${many?`<span class="c2" style="margin-left:6px">${x.type==='수납'?`${x.items.length}건에 배분`:`${x.items.length}건`}</span>`:''}</div>
        <div class="n c2" style="margin:0">${x.sup!=null?won(x.sup):''}</div>
        <div class="n c2" style="margin:0">${x.vat?won(x.vat):''}</div>
        <div class="n">${x.dr?won(x.dr):''}</div>
        <div class="n">${x.cr?won(x.cr):''}</div>
        <div class="n"><b>${won(x.bal)}</b></div></div>`
      +(!op||!many?'':x.items.map(r=>`<div class="schr led sub">
        <div></div><div></div><div></div>
        <div class="nm">${r.item}</div>
        <div class="n c2" style="margin:0">${r.sup!=null?won(r.sup):''}</div>
        <div class="n c2" style="margin:0">${r.vat?won(r.vat):''}</div>
        <div class="n c2" style="margin:0">${r.dr?won(r.dr):''}</div>
        <div class="n c2" style="margin:0">${r.cr?won(r.cr):''}</div>
        <div class="n c2" style="margin:0">${won(r.bal)}</div></div>`).join(''));}).join('');
    return `<div style="display:flex;justify-content:flex-end;margin:-6px 0 8px">${G.length?`<button class="btn sm" onclick="g3All=${anyOp?'false':'true'};g3={};render(true)">${anyOp?'전체 접기':'전체 펼치기'}</button>`:''}</div>
    <div class="tbl schl">
      <div class="schr led hd"><div>날짜</div><div>거래유형</div><div>계정</div><div>내용</div>
        <div class="n">공급가액</div><div class="n">부가세</div><div class="n">차변</div><div class="n">대변</div><div class="n">잔액</div></div>
      ${body||'<div class="empty">이 기간에 거래가 없습니다</div>'}
    </div>`;})()}
  <div class="hint">
    이 계약의 모든 돈 거래입니다. 청구서 한 장, 입금 한 건을 한 줄로 묶었습니다. 펼치면 항목별로 보입니다.<br>
    최근 거래가 위에 있고, 잔액은 그 거래 직후의 금액입니다. 매출채권(받을 돈)과 임대보증금(돌려줄 돈)의 잔액은 따로 셉니다.<br>
    원장은 고치지 않습니다. 잘못된 거래는 취소 거래를 추가해 바로잡습니다. 연체료는 수납 처리에서 받기로 한 금액만 청구로 올라옵니다.</div>`;
}

/* ═══ 라우터 ═══ */
function render(keep){
  const y=window.scrollY||0;
  const h=(location.hash||'#/pro-1').replace(/^#\//,'');
  const [id,arg]=h.split('/');
  /* 다른 화면으로 옮겨 가면 그 화면이 속한 그룹을 펼친다. 같은 화면을 다시 그릴 때는 건드리지 않는다 */
  if(id!==render.last){const g=MENU.find(m=>m.items&&(m.items.some(i=>i.id===id)||m.over===id));
    if(g&&!OPEN[g.k]){OPEN[g.k]=true;LS.set('brikka.open',OPEN);} render.last=id;}
  paintNav(h);
  let html,crumb;
  if(id==='pro-1'){html=PRO1();crumb='<b>건물 관리</b>';}
  else if(id==='pro-3'){const b=BUILDINGS.find(x=>x.id===arg)||BUILDINGS[0];
    html=PRO3(arg);crumb=`<span class="c" onclick="go('pro-1')">건물 관리</span> <span>›</span> <b>${b.name}</b>`;}
  else if(id==='pay-10'){html=PAY10();crumb='청구 · 수납 <span>›</span> <b>관리비 정산</b>';}
  else if(id==='pay-12'){html=PAY12();crumb='<b>청구 · 수납</b>';}
  else if(id==='pay-11'){html=PAY11();crumb='청구 · 수납 <span>›</span> <b>월 마감</b>';}
  else if(id==='pay-1'){html=PAY1();crumb='청구 · 수납 <span>›</span> <b>청구서 발행</b>';}
  else if(id==='pay-6'){html=PAY6();crumb='청구 · 수납 <span>›</span> <b>수납 내역</b>';}
  else if(id==='ctr-1'){html=CTR1();crumb='<b>계약 관리</b>';}
  else if(id==='ctr-3'){html=CTR3(decodeURIComponent(arg||''));const c=CTRS.find(x=>x.b+x.no===decodeURIComponent(arg||''));
    crumb=`<span class="c" onclick="go('ctr-1')">계약 관리</span> <span>›</span> <b>${c?cname(BUILDINGS[0].alias,c.no,c.ten):'—'}</b>`;}
  else if(id==='pay-2'){html=PAY2();crumb='청구 · 수납 <span>›</span> <b>미납 관리</b>';}
  else if(id==='pay-13'){html=PAY13();crumb='청구 · 수납 <span>›</span> <b>입금 매칭</b>';}
  else{html=TODO(id);const g=MENU.find(m=>m.items&&m.items.some(i=>i.id===id));
    const m=ALL.find(i=>i.id===id);
    crumb=(g?g.g+' <span>›</span> ':'')+`<b>${m?m.n:'—'}</b>`;}
  $('#crumb').innerHTML=crumb;$('#view').innerHTML=html+drawerHTML();
  if(keep) window.scrollTo(0,y); else if(!DRAWER) window.scrollTo(0,0);
}
addEventListener('hashchange',render);
seedJuly();paintOp();paintFold();render();
</script>
