<!-- BRIKKA 관리자 백오피스 목업 · 2026.11.08판 · 작업 중(미완성). 기준은 기능정의서 v1.5 + docs/명세변경 -->
<title>BRIKKA 백오피스 · 목업 2026.11.08 (작업 중)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --canvas:#FFFFFF; --side:#FFFFFF; --side-hov:#F3F4F6; --side-on:#EEF2F6;
  --ink:#111827; --ink-2:#374151; --muted:#6B7280; --faint:#9CA3AF;
  --line:#E5E7EB; --line-2:#F3F4F6; --head:#FFFFFF;
  --pri:#2563EB; --pri-hov:#1D4ED8; --pri-bg:#EFF6FF;
  --ok:#047857; --ok-bg:#ECFDF5; --warn:#B45309; --warn-bg:#FFFBEB;
  --danger:#B91C1C; --danger-bg:#FEF2F2; --neutral:#4B5563; --neutral-bg:#F3F4F6;
  --r:8px; --r-sm:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --canvas:#15181E; --side:#15181E; --side-hov:#1E222A; --side-on:#232833;
  --ink:#E8EAED; --ink-2:#C5CAD3; --muted:#8B93A1; --faint:#6B7280;
  --line:#272C35; --line-2:#1E222A; --head:#15181E;
  --pri:#60A5FA; --pri-hov:#93C5FD; --pri-bg:#172032;
  --ok:#4ADE80; --ok-bg:#132218; --warn:#FBBF24; --warn-bg:#241D0F;
  --danger:#F87171; --danger-bg:#251515; --neutral:#9CA3AF; --neutral-bg:#1E222A;
}}
:root[data-theme="dark"]{
  --bg:#0F1115; --canvas:#15181E; --side:#15181E; --side-hov:#1E222A; --side-on:#232833;
  --ink:#E8EAED; --ink-2:#C5CAD3; --muted:#8B93A1; --faint:#6B7280;
  --line:#272C35; --line-2:#1E222A; --head:#15181E;
  --pri:#60A5FA; --pri-hov:#93C5FD; --pri-bg:#172032;
  --ok:#4ADE80; --ok-bg:#132218; --warn:#FBBF24; --warn-bg:#241D0F;
  --danger:#F87171; --danger-bg:#251515; --neutral:#9CA3AF; --neutral-bg:#1E222A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{flex:none}

/* ── 레이아웃 ── */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;overflow:hidden}
.bh{padding:16px 16px 14px;display:flex;align-items:center;gap:10px}
.bi{width:32px;height:32px;border-radius:var(--r-sm);background:var(--pri);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.bt{line-height:1.25}
.bt .n{font-weight:700;font-size:13.5px}
.bt .s{font-size:11px;color:var(--muted)}
.navsc{flex:1;overflow-y:auto;padding:4px 10px 16px}
.navg{padding:16px 10px 6px;font-size:11px;color:var(--faint);font-weight:500;letter-spacing:.02em}
.nav a,.nav .gh{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);
  cursor:pointer;color:var(--ink-2);font-size:12.5px;margin-bottom:1px;border:0;background:none;
  width:100%;text-align:left;font-family:inherit}
.nav a:hover,.nav .gh:hover{background:var(--side-hov)}
.nav a.on{background:var(--side-on);color:var(--ink);font-weight:500}
.nav a .sid{margin-left:auto;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.nav a svg,.nav .gh svg{color:var(--muted)}
.nav a.on svg{color:var(--pri)}
.nav .gh .cv{margin-left:auto;transition:transform .16s;color:var(--faint)}
.nav .gh.open .cv{transform:rotate(90deg)}
.nav .gh.hasOn{color:var(--ink);font-weight:500}
.nsub{overflow:hidden;position:relative}
.nsub::before{content:'';position:absolute;left:19px;top:2px;bottom:2px;width:1px;background:var(--line)}
.nsub a{padding-left:34px;font-size:12px;color:var(--muted)}
.nsub a:hover{color:var(--ink-2)}
.nsub a.on{color:var(--ink)}
.nsub a .sid{font-size:10px}
.sf{border-top:1px solid var(--line);padding:8px 10px 10px;position:relative}
.sfi{display:flex;align-items:center;justify-content:space-between;padding:0 2px 6px}
.ib{border:0;background:none;padding:7px;border-radius:var(--r-sm);cursor:pointer;color:var(--muted);
  display:flex;position:relative}
.ib:hover{background:var(--side-hov);color:var(--ink-2)}
.ib .dot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:#EF4444}
.me{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:var(--r-sm);cursor:pointer}
.me:hover{background:var(--side-hov)}
.me .av{width:26px;height:26px;border-radius:var(--r-sm);background:var(--neutral-bg);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.me .mt{line-height:1.3;min-width:0;flex:1}
.me .mt .a{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .mt .b{font-size:10.5px;color:var(--muted)}
.me .ch{color:var(--faint);font-size:11px}
.nw{position:absolute;bottom:52px;left:10px;width:318px;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.14);z-index:40;overflow:hidden}
.nw .nh{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line-2)}
.nw .nh b{font-size:12.5px}
.nw .nh .cl{margin-left:auto;font-size:11px;color:var(--muted);cursor:pointer}
.nw .nh .cl:hover{color:var(--ink-2)}
.nw .ni{display:flex;gap:9px;padding:10px 14px;border-bottom:1px solid var(--line-2);cursor:pointer}
.nw .ni:last-child{border-bottom:0}
.nw .ni:hover{background:var(--side-hov)}
.nw .ni .nb{flex:1;min-width:0}
.nw .ni .nt{font-size:12px;font-weight:500;margin-bottom:2px}
.nw .ni .nd{font-size:11px;color:var(--muted);line-height:1.5}
.nw .ni .ng{font-size:10.5px;color:var(--faint);white-space:nowrap}

/* PAY-10 정산 */
.fbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
/* 페이지 나누기 — 표 아래 가운데. 한 페이지 10줄 */
.pgr{display:flex;justify-content:center;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.pgr button{min-width:30px;height:30px;padding:0 8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:var(--r-sm);font:inherit;font-size:12.5px;cursor:pointer}
.pgr button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.pgr button:disabled{opacity:.4;cursor:default}
.fbar select{border:1px solid var(--line);background:var(--bg);padding:8px 11px;border-radius:var(--r-sm);
  font-size:12.5px;min-width:150px}
.fbar input.fq{border:1px solid var(--line);background:var(--bg);padding:8px 11px;border-radius:var(--r-sm);font-size:12.5px;width:220px}
.fbar .fqw{position:relative;display:inline-flex;align-items:center}
.fbar .fqw svg{position:absolute;left:10px;color:var(--faint);pointer-events:none}
.fbar .fqw input.fq{padding-left:32px}
.stepv{display:flex;gap:0;margin-bottom:18px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stepv .sp2{flex:1;padding:11px 14px;border-right:1px solid var(--line);cursor:pointer;background:var(--bg)}
.stepv .sp2:last-child{border-right:0}
.stepv .sp2:hover{background:var(--side-hov)}
.stepv .sp2.on{background:var(--pri-bg)}
.stepv .sp2 .t{font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.stepv .sp2.on .t{color:var(--pri)}
.stepv .sp2 .d{font-size:11.5px;color:var(--muted);margin-top:2px}
.stepv .sp2 .nm{width:17px;height:17px;border-radius:50%;background:var(--neutral-bg);color:var(--muted);
  font-size:10.5px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.stepv .sp2.on .nm{background:var(--pri);color:#fff}
.stepv .sp2.dn .nm{background:var(--ok-bg);color:var(--ok)}
.itab{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.once td{vertical-align:middle}.once input,.once select{border:1px solid var(--line);background:var(--bg);padding:6px 8px;border-radius:var(--r-sm);font-size:12.5px;font-family:inherit}
.itab button{border:1px solid var(--line);background:var(--bg);padding:6px 13px;border-radius:99px;
  cursor:pointer;font-size:12.5px;color:var(--ink-2);font-family:inherit}
.itab button.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:500}
.inp{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:5px 9px;
  font-size:12.5px;width:92px;text-align:right;font-variant-numeric:tabular-nums}
.inp:focus{outline:0;border-color:var(--pri)}
.inp.w{width:76px}
.inp.w2{width:62px;padding:3px 7px;font-size:12px}
.uct{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-left:auto}
.inp.why{width:100%;text-align:left;font-size:12px}

tr.dim td{color:var(--muted)}
tr.sumr td{background:var(--head);font-weight:700;border-top:1px solid var(--line)}
tr.vacr td{background:var(--warn-bg)}
.vfy{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--r);
  border:1px solid var(--line);margin-top:14px;font-size:12.5px;flex-wrap:wrap}
.vfy.ok{background:var(--ok-bg);border-color:var(--ok)}
.vfy.no{background:var(--warn-bg);border-color:var(--warn)}
.vfy b{font-variant-numeric:tabular-nums}
.vfy .ttl{font-weight:700}
.vfy.ok .ttl{color:var(--ok)} .vfy.no .ttl{color:var(--warn)}
.fnd{background:var(--pri-bg);border:1px solid var(--pri);border-left-width:3px;border-radius:var(--r);
  padding:12px 15px;font-size:12.5px;color:var(--ink-2);margin:14px 0;line-height:1.65}
.fnd b{color:var(--pri)}
.fnd .h{font-weight:700;color:var(--pri);display:block;margin-bottom:4px}

/* 우측 슬라이드 패널 */
.dro{position:fixed;inset:0;z-index:100}
.dro .ov{position:absolute;inset:0;background:rgba(15,20,28,.35);animation:fadein .16s}
.dro .pn{position:absolute;right:0;top:0;bottom:0;width:440px;max-width:100%;background:var(--bg);
  border-left:1px solid var(--line);box-shadow:-10px 0 36px rgba(0,0,0,.16);
  display:flex;flex-direction:column;animation:slidein .2s cubic-bezier(.32,.72,0,1)}
@keyframes slidein{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.dro .dh{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.dro .dh .t{font-size:15px;font-weight:700}
.dro .dh .s{font-size:12px;color:var(--muted);margin-top:3px}
.dro .dh .x{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;
  font-size:19px;line-height:1;padding:2px 6px;border-radius:var(--r-sm)}
.dro .dh .x:hover{background:var(--side-hov);color:var(--ink)}
.dro .db{flex:1;overflow-y:auto;padding:14px 20px 20px}
.dro .df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.pick{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);
  border-radius:var(--r);margin-bottom:6px;cursor:pointer}
.pick:hover{border-color:var(--muted)}
.pick.on{border-color:var(--pri);background:var(--pri-bg)}
.pick .ck{width:17px;height:17px;border:1.5px solid var(--line);border-radius:4px;flex:none;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px}
.pick.on .ck{background:var(--pri);border-color:var(--pri)}
.pick .pb{flex:1;min-width:0}
.pick .pn2{font-weight:500;font-size:13px}

/* 건물 전환 */
.bsw{position:relative;display:inline-flex;align-items:center;gap:9px}
.bsw h1{margin:0}
.bsw .bt2{display:inline-flex;align-items:center;gap:5px;cursor:pointer;
  border:1px solid var(--line);background:var(--bg);font-family:inherit;
  padding:5px 9px 5px 10px;border-radius:99px;font-size:11.5px;color:var(--muted);font-weight:500}
.bsw .bt2:hover{border-color:var(--pri);color:var(--pri);background:var(--pri-bg)}
.bsw .bt2.open{border-color:var(--pri);color:var(--pri);background:var(--pri-bg)}
.bsw .bt2 svg{transition:transform .15s}
.bsw .bt2.open svg{transform:rotate(180deg)}
.bsw .menu{position:absolute;top:100%;left:0;margin-top:8px;min-width:300px;background:var(--bg);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.13);
  z-index:30;overflow:hidden;padding:5px}
.bsw .menu .mi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);
  cursor:pointer;font-size:12.5px}
.bsw .menu .mi:hover{background:var(--side-hov)}
.bsw .menu .mi.on{background:var(--pri-bg)}
.bsw .menu .mi .mn{font-weight:500;flex:1}
.bsw .menu .mi.on .mn{color:var(--pri)}
.bsw .menu .mi .mk{font-size:11.5px;color:var(--muted)}
.bsw .menu .hd{font-size:11px;color:var(--faint);padding:6px 10px 4px}

/* 진행 현황 */
.pgrid td.st{cursor:pointer}
.pgrid td.st:hover{background:var(--pri-bg)}
.mcl tr.on td{background:var(--pri-bg)}
.stp{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.stp .dot2{width:6px;height:6px;border-radius:50%;flex:none}
.bar{height:5px;background:var(--line-2);border-radius:99px;overflow:hidden;margin-top:4px;width:84px}
.bar > i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bar.part > i{background:var(--warn)}

/* 설정 패널 */
.fg{margin-bottom:18px}
.fg .fl{font-size:11px;color:var(--faint);font-weight:500;letter-spacing:.02em;
  padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.fr{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
.fr .fk{width:104px;color:var(--muted);flex:none}
.fr select,.fr input[type=text],.fr input[type=date]{flex:1;border:1px solid var(--line);
  background:var(--bg);padding:6px 9px;border-radius:var(--r-sm);font-size:12.5px;font-family:inherit}
.fr .fv{flex:1}
.fr input:disabled,.fr select:disabled{background:var(--side-hov);color:var(--ink-2);cursor:not-allowed;opacity:1}
.fr .kw{min-width:92px;color:var(--ink-2);font-size:12.5px;white-space:nowrap}
.ck{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px}
.fr .fk b{font-weight:600}
.ulist{border:1px solid var(--line);border-radius:var(--r-sm);max-height:196px;overflow-y:auto}
.ulist .ur{display:flex;align-items:center;gap:9px;padding:7px 11px;cursor:pointer;
  border-bottom:1px solid var(--line-2);font-size:12.5px}
.ulist .ur:last-child{border-bottom:0}
.ulist .ur:hover{background:var(--side-hov)}
.ulist .ur.on{background:var(--pri-bg)}
.ulist .ur .ck2{width:15px;height:15px;border:1.5px solid var(--line);border-radius:3px;flex:none;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px}
.ulist .ur.on .ck2{background:var(--pri);border-color:var(--pri)}
.ulist .ur .un2{font-weight:500;width:52px;flex:none}
.ulist .ur .ut2{color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
color:var(--faint);font-variant-numeric:tabular-nums}
.utool{display:flex;gap:6px;align-items:center;margin-bottom:7px;font-size:11.5px;color:var(--muted)}
.utool button{border:1px solid var(--line);background:var(--bg);padding:3px 9px;border-radius:99px;
  cursor:pointer;font-size:11.5px;color:var(--ink-2);font-family:inherit}
.utool button:hover{background:var(--side-hov)}
.utool .cnt2{margin-left:auto}
.prev{background:var(--pri-bg);border:1px solid var(--pri);border-left-width:3px;
  border-radius:var(--r-sm);padding:11px 13px;font-size:12px;line-height:1.7;color:var(--ink-2)}
.prev .pt{font-weight:700;color:var(--pri);font-size:11.5px;margin-bottom:5px}
.prev b{color:var(--ink)}
.warn2{background:var(--warn-bg);border-color:var(--warn)}
.warn2 .pt{color:var(--warn)}

/* 고지서 입력 표 */
table.bt2 td{padding:9px 12px}
.inp.lg{width:120px;font-weight:500}
.inp.d{width:130px;text-align:left;font-size:12px}
.inp .u,.n .u{color:var(--muted);font-size:11.5px}
.btn.ex{color:var(--muted);padding:4px 10px;font-size:11.5px}
.btn.ex:hover{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}

/* 접힘 상태 */
.app.fold .side{width:62px}
.app.fold{grid-template-columns:62px 1fr}
.app.fold .bh{padding:14px 0;justify-content:center}
.app.fold .bt,.app.fold .navg,.app.fold .me .mt,.app.fold .me .ch{display:none}
.app.fold .nsub::before{display:none}
.app.fold .sfi{flex-direction:column;gap:2px;padding-bottom:4px}
.app.fold .me{justify-content:center;padding:7px 0}
.app.fold .nw{left:calc(100% + 8px);bottom:10px}
.app.fold .nav a,.app.fold .nav .gh{justify-content:center;padding:9px 0;gap:0}
.app.fold .nav a span,.app.fold .nav .gh span,.app.fold .nav .cv{display:none}
.app.fold .nsub{display:none!important}
.app.fold .nav a,.app.fold .nav .gh{position:relative}
.app.fold .nav a:hover::after,.app.fold .nav .gh:hover::after{
  content:attr(data-n);position:absolute;left:52px;top:50%;transform:translateY(-50%);
  background:var(--ink);color:var(--bg);padding:5px 10px;border-radius:var(--r-sm);font-size:12px;
  white-space:nowrap;z-index:20;pointer-events:none}
.op{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer}
.op:hover{background:var(--side-hov)}
.op .av{width:28px;height:28px;border-radius:var(--r-sm);background:var(--neutral-bg);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.op .ot{line-height:1.3;min-width:0}
.op .ot .a{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op .ot .b{font-size:11px;color:var(--muted)}
.op.test .av{background:var(--warn-bg);color:var(--warn)}
.op.test .ot .a{color:var(--warn)}

.main{min-width:0;background:var(--canvas)}
.top{padding:14px 28px 0;display:flex;align-items:flex-start;gap:16px}
.crumb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.crumb .c{cursor:pointer}.crumb .c:hover{color:var(--ink-2)}
.crumb b{color:var(--ink-2);font-weight:400}
.top .sp{flex:1}
.today{font-size:12px;color:var(--faint);white-space:nowrap}
.ver{font-size:11px;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:1px 6px;margin-right:10px;white-space:nowrap}
.mock{font-size:11px;color:var(--warn);background:var(--warn-bg);padding:3px 9px;border-radius:99px;font-weight:500}
.wrap{padding:6px 28px 64px;max-width:1560px}
.ph{display:flex;align-items:center;gap:10px;margin:2px 0 18px;flex-wrap:wrap}
.ph h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.ph .sid{font-size:10.5px;color:var(--muted);background:var(--neutral-bg);padding:2px 8px;border-radius:99px;font-weight:500}
.ph .act{margin-left:auto;display:flex;gap:8px}

/* ── 부품 ── */
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink-2);padding:7px 13px;
  border-radius:var(--r-sm);cursor:pointer;font-size:12.5px;white-space:nowrap;display:inline-flex;
  align-items:center;gap:6px;font-weight:500}
.btn:hover{background:var(--side-hov)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-hov)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.gh{border-color:transparent;background:none;color:var(--muted)}

.sbar{display:flex;gap:10px;margin-bottom:16px}
.sin{flex:1;display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:var(--r);

.sin:focus-within{border-color:var(--pri)}
.sin input{flex:1;border:0;outline:0;background:none;padding:9px 0;font-size:12.5px}

.tbl{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--head);text-align:left;padding:10px 14px;font-size:11.5px;font-weight:500;color:var(--muted);
  border-bottom:1px solid var(--line);white-space:nowrap}
th .so{color:var(--faint);margin-left:3px;font-size:10px}
td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--side-hov)}
tbody tr.fixr{background:var(--soft)}
tbody tr.fixr:hover{background:var(--side-hov)}
tbody tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
.c1{font-weight:500;color:var(--ink);white-space:nowrap}
.cn{white-space:nowrap;font-size:12.5px}
.cn b{font-weight:500;color:var(--ink)}
.cn i{color:var(--faint);font-style:normal;margin:0 1px}
.c2{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap}
.det{color:var(--muted);font-size:12px;cursor:pointer}
/* 표의 가장 오른쪽 「더보기」 칸 — 버튼이 아니라 링크. 못 하는 일은 흐린 글씨로 두고 이유를 title에 → 3.8 */
.more{color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap}
.more:hover{color:var(--pri)}
.more.off{color:var(--faint);cursor:default;text-decoration:none}
.more + .more{margin-left:10px}
.more.mtg{font-size:16px;line-height:1;padding:0 6px;letter-spacing:0}
.mmenu{position:fixed;min-width:130px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 10px 30px rgba(0,0,0,.13);z-index:60;padding:5px}
.mmenu .mi{padding:7px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:12.5px;white-space:nowrap}
.mmenu .mi:hover{background:var(--side-hov);color:var(--pri)}
.mmenu .mi.off{color:var(--faint);cursor:default}
.mmenu .mi.off:hover{background:none;color:var(--faint)}
.det:hover{color:var(--pri)}
.cb{width:16px;height:16px;border:1.5px solid var(--line);border-radius:4px;display:inline-block;vertical-align:-3px}

.pgw{display:flex;align-items:center;padding:14px 16px;border-top:1px solid var(--line);gap:12px}
.pgw .mid{flex:1;display:flex;justify-content:center;align-items:center;gap:4px}

.pgb:hover{background:var(--side-hov);color:var(--ink-2)}
.pgb.on{border:1px solid var(--line);color:var(--ink);font-weight:500}

.bd{display:inline-flex;align-items:center;font-size:11.5px;padding:2px 9px;border-radius:99px;font-weight:500;white-space:nowrap}
.bd.ok{background:var(--ok-bg);color:var(--ok)} .bd.wa{background:var(--warn-bg);color:var(--warn)}
.bd.da{background:var(--danger-bg);color:var(--danger)} .bd.mu{background:var(--neutral-bg);color:var(--neutral)}
.bd.ac{background:var(--pri-bg);color:var(--pri)}

.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{border:0;background:none;padding:0 0 10px;cursor:pointer;color:var(--muted);font-size:13px;
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tabs button:hover{color:var(--ink-2)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.tabs button:disabled{color:var(--faint);cursor:default}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tgl{width:36px;height:20px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;border:0;padding:0;vertical-align:middle;transition:background .15s}
.tgl::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.tgl.on{background:var(--pri)}.tgl.on::after{left:18px}
.tgl[disabled]{opacity:.4;cursor:not-allowed}
tr.off td:not(:last-child):not(:nth-last-child(2)){opacity:.5}
.locked button,.locked select,.locked input,.locked label{pointer-events:none;opacity:.45}
.tabs .cnt{background:var(--neutral-bg);color:var(--neutral);font-size:11px;padding:1px 7px;border-radius:99px;font-weight:500}

.card{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);margin-bottom:16px;overflow:hidden}
.card > .ct{padding:13px 16px;display:flex;align-items:center;gap:9px;font-weight:700;font-size:13px}
.card > .ct .sub{font-weight:400;color:var(--muted);font-size:12px}
.card > .ct .ca{margin-left:auto;display:flex;gap:6px}
.card > .cc{padding:3px 16px 16px}

.bpw{display:flex;gap:16px;align-items:flex-start}
.bpw > .bpd{flex:1;min-width:0}
.nbw .fr .fk{width:128px}
.bpd dd{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.bph.none:hover{border-color:var(--pri);color:var(--pri)}
.dl{display:grid;grid-template-columns:minmax(124px,auto) 1fr;column-gap:12px;font-size:12.5px}
.dl dt{padding:8px 0;color:var(--muted);border-bottom:1px solid var(--line-2);font-size:12px}
.dl dd{padding:8px 0;margin:0;border-bottom:1px solid var(--line-2)}
.dl dt:last-of-type,.dl dd:last-of-type{border-bottom:0}
.hint{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.6}

/* 항목 설명은 칸 옆 캡션 대신 이름 옆 ⓘ에 둔다 — 화면마다 칸 폭이 달라지지 않게. 설명 상자는 카드 밖으로도 보이도록 화면 기준(fixed)으로 띄운다 */
.tip{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;margin-left:4px;border:1px solid var(--faint);border-radius:50%;
  color:var(--faint);font:italic 600 9px/1 Georgia,serif;cursor:help;vertical-align:1px}

  background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.55;white-space:pre-line;box-shadow:0 6px 20px rgba(0,0,0,.22);cursor:pointer;display:none}

#tipbox{position:fixed;z-index:999;max-width:300px;white-space:pre-line;padding:7px 10px;border-radius:var(--r-sm);background:var(--ink);color:var(--bg);
  font-size:12px;line-height:1.45;word-break:keep-all;pointer-events:none;display:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.unit .r{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:2px 0}

.empty{padding:52px 16px;text-align:center;color:var(--muted);font-size:12.5px}

/* 배분 계산 — 4.1.2

function ratios(m,raw){
  const st=resolve(m.code);
  const ref=(st.ref&&st.ref!==m.code)?st.ref:null;
  if(ref) return ratios(M(ref),raw);
  const b=BILL[m.code];
  /* 계량기가 있으면 개별분을 청구한다. 배분 기준이 계량기 필요 여부를 정하므로
     「계량기는 있는데 청구하지 않는다」는 조합이 존재하지 않는다 → 4.1.3-1 */
  const charge=(METER[m.code]||[]).length>0;

     「사용량+임대면적」은 개별분은 검침, 공용분은 면적으로 나눈다 → 4.1.3 */
  const byUse=st.basis==='사용량';

  /* 직접 입력 — 안분하지 않는다. 계약별로 담당자가 넣은 금액이 그대로 청구된다 */
  if(st.basis==='직접 입력'){
    const dir=b.direct||{}, tot=directSum(m.code);
    const rows=UNITS_B1.map(u=>{
      const d=+dir[u.no]||0;
      return {...u,hasM:false,typed:false,use:0,aUse:0,mul:1,
              direct:d,w:0,common:0,tot:0,ratio:tot?d/tot:0};
    });
    return {rows,sumUse:0,common:0,wSum:0,totUse:0,charge:false,byUse:false,direct:true};
  }
  const rows=UNITS_B1.map(u=>{
    const hasM=hasMeter(m.code,u.no);
    const r=reading(m.code,u.no);
    /* 당월 검침값이 없으면 사용량은 0이다. null − 전월값이 음수가 되는 것을 막는다 */
    const typed=!!r&&r[1]!=null;
    const diff=typed?r[1]-r[0]:0;         /* 지침 차이 */
    const ct=ctOf(m.code,u.no);           /* 계기배율 */
    const use=diff*ct;                    /* 실사용량 */
    const aj=b.adj[u.no];

    const mul=raw?1:((aj&&Number.isFinite(aj.mul))?aj.mul:1);  /* 0을 1로 되돌리지 않는다 */

     정규화(배분 몫 ÷ Σ배분 몫)로 하면 분모가 함께 커져 배율만큼 늘지 않는다.
     총량 불변과 「정확히 N배」는 이 방식으로 동시에 성립한다 → 4.1.2 */
  const base=r=>byUse? r.use : r.ar;
  const bSum=rows.reduce((a,r)=>a+base(r),0);
  const base0=r=>bSum? common*base(r)/bSum : 0;   /* 배율 1.0 기준 공용 */
  const set=rows.filter(r=>r.mul!==1);            /* 배율을 지정한 유닛 */
  const oth=rows.filter(r=>r.mul===1);
  const fixSum=set.reduce((a,r)=>a+base0(r)*r.mul,0);
  const othSum=oth.reduce((a,r)=>a+base0(r),0);

      :(othSum? rest*base0(r)/othSum : 0);

    r.ratio=totUse?r.tot/totUse:(common?r.common/common:0);
  });

}

function daysIn(a,b){return a&&b?Math.max(0,dnum(b)-dnum(a)+1):0;}
function calc(m,raw){

  /* 일할 계산 — 버리기 전에 몫을 줄이고, 줄인 몫은 공실·미청구분으로 보낸다. 그 뒤에 원 미만을 버리고 절사 잔차를 다시 나눈다 → 4.1.9

  const pd=daysIn(b.from,b.to);

    const f=ov&&pd?daysIn(ov.af,ov.at)/pd:1, es=sup*r.ratio, ev=vat*r.ratio;

    if(o.fix){o.vat=es+ev?Math.floor(ov.amt*ev/(es+ev)):0;o.supply=ov.amt-o.vat;}
    else{o.supply=Math.floor(es*f);o.vat=Math.floor(ev*f);}
    o.cutS=o.fix?es-o.supply:es*(1-f); o.cutV=o.fix?ev-o.vat:ev*(1-f);
    return o;});
  const cutS=Math.floor(rows.reduce((a,r)=>a+(r.pro?r.cutS:0),0)), cutV=Math.floor(rows.reduce((a,r)=>a+(r.pro?r.cutV:0),0));
  /* 남는 원 단위 — 일할이 있어도 없어도 부담 비율이 가장 큰 계약에 붙여 고지서 금액에 맞춘다 → 4.1.8
     금액을 직접 고친 계약은 그 금액을 지키므로 고르지 않는다 */
  const rs=sup-rows.reduce((a,r)=>a+r.supply,0)-cutS, rv=vat-rows.reduce((a,r)=>a+r.vat,0)-cutV;
  let k=-1,best=-1; rows.forEach((r,i)=>{if(!r.fix&&r.ratio>best){best=r.ratio;k=i;}});
  if(k>=0){rows[k].supply+=rs; rows[k].vat+=rv; rows[k].rnd=rs+rv;}
  rows.forEach(r=>{r.amt=r.supply+r.vat; if(r.pro) r.orig=r.full;});
  const cut=cutS+cutV+(k<0?rs+rv:0);
  const sum=f=>rows.filter(f).reduce((a,r)=>a+r.amt,0);
  const bill=sum(r=>r.st==='사용중'), vc=sum(r=>r.st!=='사용중')+cut;
  const total=sup+vat;
  return {...base,rows,bill,vac:vc,cut,total,supply:sup,vatTotal:vat,
          diff:total-(bill+vc),rem:(k>=0?rows[k].rnd:0)};
}

function paintNav(cur){
  const a0=(cur||'').split('/')[0], active=NAV_PARENT[a0]||a0;
  $('#nav').innerHTML=MENU.map(m=>{
    if(!m.items) return navLink(m);

    return `<button class="gh ${open?'open':''} ${hasOn?'hasOn':''}" onclick="toggleG('${m.k}')" data-n="${m.g}">
        ${ic(m.i)}<span>${m.g}</span>
        <span class="cv" onclick="event.stopPropagation();foldG('${m.k}')">${ic('chev',14)}</span></button>
      <div class="nsub" style="${open?'':'display:none'}">${m.items.map(i=>navLink(i,true)).join('')}</div>`;
  }).join('');
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.id===active));
}
/* 그룹 이름 클릭 — 그 그룹의 첫 화면에 있으면 접고 펼친다. 하위 화면이나 다른 그룹에 있으면 첫 화면으로 이동하며 펼친다 */
function toggleG(k){
  const g=MENU.find(x=>x.k===k);
  const active=(location.hash||'#/pro-1').replace(/^#\//,'').split('/')[0];
  const inside=g.items.some(i=>i.id===active)||g.over===active;
  if(FOLD){FOLD=false;LS.set('brikka.fold',false);paintFold();OPEN[k]=true;LS.set('brikka.open',OPEN);
    if(!inside) go(g.over||g.items[0].id); else paintNav(active); return;}
  /* 하위 화면에 있다가 그룹 이름을 누르면 그 그룹의 첫 화면(over · 청구 현황 · 수납 현황)으로 간다. 첫 화면에서 다시 누르면 접고 펼친다. 접기만은 오른쪽 화살표 */
  if(inside&&g.over&&active!==g.over){OPEN[k]=true;LS.set('brikka.open',OPEN);go(g.over);return;}
  if(inside){OPEN[k]=!OPEN[k];LS.set('brikka.open',OPEN);paintNav(active);return;}
  OPEN[k]=true;LS.set('brikka.open',OPEN);
  go(g.over||g.items[0].id);}
function foldG(k){OPEN[k]=!OPEN[k];LS.set('brikka.open',OPEN);

/* 상세 화면 탭(요약 제외)의 공통 모양 — 위에 필터 줄, 표, 아래 안내. 필터 줄 왼쪽은 필터, 오른쪽 끝은 할 일 버튼. 전체 펼치기 · 접기는 표 머리글 왼쪽 화살표(allTog). 요약 숫자는 적지 않는다 */
/* 검색 칸 — 필터 줄 맨 앞. 칠 때마다 다시 그리므로 커서를 칸에 되돌린다. 띄어쓰기 · 하이픈 · | 는 빼고 일부만 맞아도 찾는다
   (「1234」 → 「12가 1234」, 「5678」 → 「010-1234-5678」). 한글은 글자를 조합하는 동안 다시 그리면 조합이 깨지므로 한 글자가 끝날 때 거른다 */
const vqN=s=>(s||'').replace(/[\s|-]/g,'').toLowerCase();
const qHit=(q,xs)=>{const n=vqN(q); return !n||xs.some(x=>vqN(x).includes(n));};
function qFocus(id){const e=document.getElementById(id);if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length);}}
const qBox=(id,val,set)=>`<span class="fqw">${ic('srch',14)}<input id="${id}" class="fq" type="text" value="${(val||'').replace(/"/g,'&quot;')}" oninput="if(!event.isComposing){${set}('q',this.value);qFocus('${id}')}" oncompositionend="${set}('q',this.value);qFocus('${id}')"></span>`;
const tabBar=(left,right)=>`<div class="fbar">${left||''}<span style="margin-left:auto;display:flex;gap:6px">${right||''}</span></div>`;
function t요약(b){
  const d=dday(b.mgmtEnd);
  return `
  <div class="card"><div class="ct">기본 정보
      <span class="ca">${moreCell([{t:'수정',go:`beOpen('${b.id}','basic')`},{t:BPHOTO[b.id]?'사진 바꾸기':'사진 올리기',go:`bphPick('${b.id}')`},{t:'사진 삭제',go:`bphDel('${b.id}')`,off:BPHOTO[b.id]?'':'올린 사진이 없습니다'}])}</span></div><div class="cc bpw"><dl class="dl bpd">
      <dt>건물명</dt><dd>${b.name}</dd>
      <dt>건물 별칭</dt><dd><b>${b.alias}</b>
        <span class="lock">계약고유이름에 사용 — ${b.alias}|101호|임차인명</span></dd>
      <dt>건물유형</dt><dd>${b.kind}</dd>
      <dt>건물주소</dt><dd>${b.addr}<div class="c2">${b.addr2}</div></dd>
      <dt>건축일</dt><dd>${b.built}</dd>
      <dt>사용승인일</dt><dd>${b.approved}</dd>
      ${txAny(BTAX[b.id])?'':`<dt>세금계산서</dt><dd><span class="bd wa">세금계산서 발행 명의 미입력</span></dd>`}

      <dt>연면적</dt><dd>${m2(b.gross)}</dd>
      <dt>임대가능면적</dt><dd>${m2(b.area)}</dd>
      ${b.dong?b.dong.map((g,i)=>`<dt>${i?'':'층수'}</dt><dd><b>${g.n}</b> 지상 ${g.up}층${g.down?` · 지하 ${g.down}층`:''}</dd>`).join('')

      <dt>총 주차면수</dt><dd>${b.park}면<span class="lock">지상 자주식 ${b.pk.up} · 지하 자주식 ${b.pk.down} · 기계식 ${b.pk.mech}</span></dd>

      <span class="ca">${moreCell([{t:'수정',go:`beOpen('${b.id}','owner')`}])}</span></div><div class="cc"><dl class="dl">
      ${b.owners.map((o,i)=>`<dt>${i?'':'임대인(건물주)'}</dt><dd>${o.n} <b>${o.share}%</b><span class="lock">${o.biz}</span></dd>`).join('')}
      <dt>임대료 납부 계좌</dt><dd>${b.acct}<span class="lock">${b.acctName}</span></dd>
      <dt>관리비 납부 계좌</dt><dd>${b.feeAcct}<span class="lock">${b.feeAcctName}</span></dd>
    </dl></div></div>
  </div>
  <div class="two">
    <div class="card"><div class="ct">세금계산서 발행 명의
      <span class="ca">${moreCell([{t:'수정',go:`beOpen('${b.id}','tax')`}])}</span></div><div class="cc">
      ${txAny(BTAX[b.id])?`<dl class="dl">${TXF.map(([f,l])=>`<dt>${l}</dt><dd>${BTAX[b.id][f]||'—'}</dd>`).join('')}</dl>`
        :'<div style="padding:12px 0;color:var(--muted)">세금계산서 발행 명의가 없습니다. 담당자가 홈택스에서 발행할 때 이 정보를 봅니다.</div>'}</div></div>
    <div class="card"><div class="ct">채권 정보
      <span class="ca">${moreCell([{t:'수정',go:`beOpen('${b.id}','bond')`}])}</span></div><div class="cc">
      ${b.bondMax?`<dl class="dl">
        <dt>은행 · 지점</dt><dd>${b.bondBank}<span class="lock">${b.bondTel}</span></dd>
        <dt>채권최고금액</dt><dd>${won(b.bondMax)}<span class="lock">${eok(b.bondMax)}</span></dd>
        <dt>실제채권금액</dt><dd>${won(b.bondNow)}<span class="lock">${eok(b.bondNow)}</span></dd>
      </dl>`:'<div style="padding:12px 0;color:var(--muted)">등록된 채권 정보가 없습니다.</div>'}</div></div>

    <div class="card"><div class="ct">공용시설<span class="ca">${moreCell([{t:'추가',go:`beOpen('${b.id}','fac')`}])}</span></div>
      <div class="cc" style="padding-top:12px">
      ${b.fac.map(f=>`<span class="tag">${f}<span class="x" style="cursor:pointer" onclick="facDel('${b.id}','${f}')">✕</span></span>`).join('')||'<span style="color:var(--muted)">등록된 공용시설이 없습니다.</span>'}

/* ═══ 주차 탭 — 건물에 등록된 차량 명부. 한 줄이 차량 한 대, 계약은 칸 하나(계약 · 차량번호 순) → PRO-3
   계약 상세 주차 탭(fixK)은 같은 표를 그 계약 하나로 — 계약고유이름 칸 · 계약 필터만 없다 ═══ */
let fpk={k:'',loc:'',fee:'',q:''};
const setFpk=(k,v)=>{fpk[k]=v;render(true);};

function t주차(b,fixK){
  const cs=fixK?CTRS.filter(c=>ckey(c)===fixK):CTRS.filter(c=>c.b===b.id&&c.st==='진행중'), keys=cs.map(ckey);
  /* 연장 계약(준비중) — 이전 계약의 차량이 시작일에 옮겨진다. 그 전까지는 옮겨질 차량을 보인다 */
  const fc=fixK&&cs[0], pend=fc&&fc.vehP&&!vehOf(fixK).length?fc.vehP:null, vOf=k=>pend||vehOf(k);
  const fk=fixK?'':(keys.includes(fpk.k)?fpk.k:''), all=pend||VEH.filter(v=>keys.includes(v.k));
  const q=fixK?'':fpk.q.trim(), hit=v=>{const c=ctrOfK(v.k); return qHit(q,[v.plate,v.own,v.tel,c&&cname(b.alias,c.no,c.ten)]);};
  const list=all.filter(v=>(!fk||v.k===fk)&&(!fpk.loc||v.loc===fpk.loc)&&hit(v))
    .sort((x,y)=>keys.indexOf(x.k)-keys.indexOf(y.k)||(x.plate<y.plate?-1:1));
  const S=(f,opts,lab)=>`<select onchange="setFpk('${f}',this.value)"><option value="">${lab}</option>${opts.map(([v,t])=>`<option value="${v}" ${fpk[f]===v?'selected':''}>${t}</option>`).join('')}</select>`;
  const miss='<span style="color:var(--warn)">미확인</span>';
  /* 계약의 차량 대수 · 무료 초과 · 연락처 미확인 — 한 계약을 볼 때(계약 탭 · 계약 필터) 필터 줄에 */
  const overOf=k=>{const cp=CPARK[k]; return cp?vehCnt(vOf(k)).fr-cp.free:0;};
  const sumOf=k=>{const vs=vOf(k), over=overOf(k);
    return `<span class="c2" style="margin:0 0 0 8px">${vehCntTx(vs)}</span>
      ${over>0?`<span class="bd wa" style="margin-left:8px">무료 ${over}대 초과</span>`:''}${vs.some(v=>!v.own||!v.tel)?'<span class="bd wa2" style="margin-left:6px">연락처 미확인</span>':''}`;};
  /* 무료 초과 계약 — 명부에는 계약 묶음이 없으므로 표 위 안내로. 누르면 그 계약만 */
  const overs=fixK?[]:cs.filter(c=>overOf(ckey(c))>0);
  const one=fixK||fk;
  const vrow=v=>{const c=ctrOfK(v.k);
    return `<tr style="cursor:${pend?'default':'pointer'}" onclick="${pend?'':`vdOpen('${b.id}',${v.id})`}"><td class="c1" style="font-weight:500">${v.plate}</td><td>${v.own||miss}</td><td style="white-space:nowrap">${v.tel||miss}</td><td>${v.model||'—'}</td>
      ${fixK?'':`<td>${c?cnameHTML(b.alias,c.no,c.ten):'—'}</td>`}<td>${locTx(v)}</td><td>${v.fee==='월정액'?'<span class="bd wa2">월정액</span>':'<span class="bd mu">무료</span>'}</td>
      <td class="c">${moreCell(pend?[{t:'상세',off:'시작일에 옮겨질 차량입니다'},{t:'수정',off:'이전 계약의 주차 탭에서 고칩니다'},{t:'삭제',off:'이전 계약의 주차 탭에서 고칩니다'}]
        :[{t:'상세',go:`vdOpen('${b.id}',${v.id})`},{t:'수정',go:`vehOpen('${b.id}',${v.id})`},{t:'삭제',go:`vehDel(${v.id})`}])}</td></tr>`;};
  return `
  ${tabBar((fixK?'':qBox('vq',fpk.q,'setFpk')+S('k',cs.map(c=>[ckey(c),cname(b.alias,c.no,c.ten)]),'전체 계약'))+S('loc',VEH_LOC.map(v=>[v,v]),'전체 주차구분')
    +(one?`<span style="align-self:center">${sumOf(one)}</span>`:''),
    `<button class="btn pri" onclick="vehOpen('${b.id}'${fixK?`,0,'${fixK}'`:''})">+ 차량 추가</button>`)}
  ${pend?`<div class="fnd" style="margin:0 0 12px"><span class="h">계약 시작일에 옮겨집니다</span>이전 계약의 차량 ${pend.length}대가 <b>${fc.base.replace(/-/g,'.')}</b> 시작일에 이 계약으로 옮겨집니다. 그 전까지는 이전 계약의 주차 탭에서 고칩니다.</div>`:''}
  ${overs.length?`<div class="fnd wa3" style="margin:0 0 12px"><span class="h">무료 주차를 넘은 계약 ${overs.length}건</span>${overs.map(c=>`<span class="plk" style="text-decoration:underline" onclick="setFpk('k','${ckey(c)}')">${cname(b.alias,c.no,c.ten)} · 무료 ${overOf(ckey(c))}대 초과</span>`).join(' · ')} — 넘는 차량은 월정액으로 바꿔 주차비를 받습니다.</div>`:''}
  <div class="tbl">
    ${list.length?`<div class="tw"><table>
      <thead><tr><th>차량번호</th><th>차량 소유자</th><th>연락처</th><th>차종</th>${fixK?'':'<th>계약고유이름</th>'}<th>주차구분</th><th>요금부과</th><th class="c">더보기</th></tr></thead>
      <tbody>${list.map(vrow).join('')}</tbody>
    </table></div>`:`<div class="empty">${!all.length?'등록된 차량이 없습니다':q?'찾는 차량이 없습니다':'조건에 맞는 차량이 없습니다'}</div>`}
  </div>
  <div class="hint">${fixK?'이 계약에 등록된 차량입니다. 위에 차량 대수가 보입니다.':'이 건물에 등록된 차량을 한 줄에 한 대씩, 계약 · 차량번호 순으로 봅니다. 검색은 차량번호 · 차량 소유자 · 연락처 · 계약고유이름에서 일부만 맞아도 찾습니다(띄어쓰기 · 하이픈 무시). 계약을 고르면 그 계약의 차량 대수가 위에 보입니다.'} 무료 차량이 계약의 무료 주차 대수를 넘으면 <b>무료 ○대 초과</b>로 표시합니다(주차구분 기타는 세지 않음). 넘는 차량은 월정액으로 바꿔 주차비를 받습니다.<br>
    비상시 연락해야 하므로 소유자 · 연락처가 비어 있는 차량은 <b>미확인</b>으로 표시합니다.</div>`;
}

/* 유닛 탭 — 카드 한 장이 유닛 하나. 누르면 오른쪽에 유닛 상세 패널(PRO-4) */
/* ═══ 유닛 등록 — 건물 상세 유닛 탭의 오른쪽 패널. 주차면 추가와 같은 방식 → PRO-3
   계량기는 여기서 정하고 나중에 유닛 상세(PRO-4)에서 달고 뗀다. 목업은 정산 자료(UNITS_B1)에 넣지 않는다 ═══ */
const UNIT_USE=['사무실','근린생활','창고','기타'];
/* 계량기 종류 — 사용량 단위가 있는 항목(전기 · 수도 · 가스). 이 건물이 지금 청구하지 않는 항목도 보여 준다. 계량기는 물건이라 청구와 상관없이 달려 있을 수 있다 */
const meterItems=b=>b.id!=='b1'?[]:MASTER.filter(m=>m.unit&&!m.fixed).map(m=>m.code);
const meterUsed=(b,code)=>b.charge.some(c=>c.use&&codeOf(c.it)===code);
function setMeters(no,on){Object.keys(on).forEach(code=>{const L=METER[code]||(METER[code]=[]), i=L.indexOf(no);
  if(on[code]&&i<0) L.push(no); if(!on[code]&&i>=0) L.splice(i,1); SAVED[code]=null;});}
let un=null;
function unOpen(bid){const b=BUILDINGS.find(x=>x.id===bid);
  un={bid,dong:b.dong?b.dong[0].n:'',fk:'지상',fl:'',no:'',use:'',area:'',net:'',st:'공실',memo:'',mt:{},tried:false};
  DRAWER='unit';render(true);}
function unSet(f,v){un[f]=v;render(true);}
function unMissing(){const b=BUILDINGS.find(x=>x.id===un.bid), m=[];
  if(!un.no.trim()) m.push('유닛고유번호'); else if(b.units.some(u=>u.no===un.no.trim())) m.push('유닛고유번호(이 건물에 이미 있음)');
  if(!un.fl) m.push('층'); if(!un.use) m.push('유닛용도'); if(!(parseFloat(un.area)>0)) m.push('임대면적');
  if(parseFloat(un.net)>parseFloat(un.area)) m.push('전용면적(임대면적보다 클 수 없음)');
  return m;}
function unSave(){un.tried=true; if(unMissing().length){render(true);return;}
  const b=BUILDINGS.find(x=>x.id===un.bid), area=parseFloat(un.area), net=parseFloat(un.net)||0;
  b.units.push({no:un.no.trim(),st:un.st,ten:'',fl:(un.fk==='지하'?-1:1)*parseInt(un.fl),area,net:net||Math.round(area*0.62*10)/10,use:un.use,dong:un.dong,memo:un.memo.trim()});
  setMeters(un.no.trim(),Object.fromEntries(meterItems(b).map(c=>[c,!!un.mt[c]])));
  b.unitCnt=b.units.length; b.vacCnt=b.units.filter(u=>u.st==='공실').length;
  DRAWER=null;un=null;render(true);}
function unHTML(){
  if(DRAWER!=='unit'||!un) return '';
  const b=BUILDINGS.find(x=>x.id===un.bid), miss=un.tried?unMissing():[];
  const inp='border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 9px;font:inherit';
  const R=(k,body,req)=>`<div class="fr"><span class="fk">${k}${req?' <b style="color:var(--warn)">*</b>':''}</span>${body}</div>`;
  const T=(f,ph,w)=>`<input type="text" value="${un[f]}" placeholder="${ph||''}" onchange="unSet('${f}',this.value)" style="${inp};${w?`max-width:${w}px`:'width:100%'}">`;
  const S=(f,opts,ph)=>`<select onchange="unSet('${f}',this.value)" style="${inp}">${ph?`<option value="">${ph}</option>`:''}${opts.map(o=>`<option ${un[f]===o?'selected':''}>${o}</option>`).join('')}</select>`;
  const area=parseFloat(un.area), net=parseFloat(un.net);
  return `<div class="dro"><div class="ov" onclick="closeDrawer()"></div><div class="pn">
    <div class="dh"><div><div class="t">유닛 등록</div><div class="s">${b.name}</div></div>
      <button class="x" onclick="closeDrawer()">✕</button></div>
    <div class="db">
      <div class="fg"><div class="fl">위치</div>
        ${b.dong?R('동',S('dong',b.dong.map(g=>g.n)),1):''}
        ${R('층',S('fk',['지상','지하'])+`<input type="text" inputmode="numeric" value="${un.fl}" onchange="unSet('fl',this.value)" style="${inp};max-width:60px"><span class="c2" style="margin:0">층</span>`,1)}
        ${R('유닛고유번호',T('no',b.dong?`예: ${un.dong||'본관'}501호`:'예: 501호'),1)}
        <div class="c2" style="margin:-4px 0 0;white-space:normal">계약 목록에 <b style="color:var(--ink)">${b.alias}|${un.no.trim()||'유닛고유번호'}|임차인</b>으로 표시됩니다. 이 건물 안에서 겹칠 수 없습니다</div></div>
      <div class="fg"><div class="fl">유닛 정보</div>
        ${R('유닛용도',S('use',UNIT_USE,'선택'),1)}
        ${R('임대면적',T('area','계약면적',110)+'<span class="c2" style="margin:0">㎡</span>',1)}
        ${R('전용면적',T('net','',110)+`<span class="c2" style="margin:0">㎡${area>0&&net>0?` · 전용률 <b style="color:var(--ink)">${(net/area*100).toFixed(1)}%</b>`:''}</span>`)}
</div>
      <div class="fg"><div class="fl">상태 · 기타</div>
        ${R('유닛상태',S('st',['공실','비운영중']))}
        <div class="c2" style="margin:-4px 0 9px;white-space:normal">비운영중은 건물주 직접 사용이나 공사 중일 때만 고릅니다(슈퍼관리자). 계약을 등록하면 사용중으로 바뀝니다</div>
        ${R('메모',T('memo'))}</div>

/* ═══ PAY-10 관리비 정산 ═══ */
const fx=(n,d=1)=>n.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
/* 청구항목마다 거치는 단계가 다르다.
     전기요금      고지서 → 검침 → 조정 → 산출
     정화조청소비   고지서 → 조정 → 산출          검침이 없다
     주차비        금액 입력 → 산출              고지서·검침·조정이 없다
   단계를 가로 네비로 고정하면 항목마다 「이 단계엔 이 항목이 없음」이라는 예외가 생긴다.
   항목당 한 페이지를 주고 그 항목이 실제로 거치는 단계만 세로로 쌓는다. */
function itemSecs(m){
  const R=calc(m), out=[], ref=resolve(m.code).ref;
  if(isDirect(m.code)) out.push(['금액 입력',stDirect(m,R)]);
  else{
    out.push(['고지서',stBillOne(m)]);
    if(isMetered(m.code)) out.push(['검침 입력',stRead(m,R)]);
    /* 참조 항목은 배분이 참조 대상에 종속된다. 여기서 조정할 것이 없다 */
    if(!ref) out.push(['조정',stAdj(m,R)]);
  }
  out.push(['산출 결과',stResult(m,R)]);
  return out;
}
/* 항목 탭의 상태 — 손봐야 할 것이 있으면 알린다 */
function itemFlag(m){
  /* 참조 항목은 참조 대상이 끝나야 금액이 확정된다. 그 상태를 그대로 물려받는다 */
  const ref=resolve(m.code).ref;
  if(ref&&ref!==m.code){
    if(!selItems().some(x=>x.code===ref))
      return {t:`${M(ref).name} 미선택`,c:'wa2'};
    const rf=itemFlag(M(ref));
    if(rf.c!=='ok') return {t:`${M(ref).name} 미완`,c:'wa'};
  }
  if(isDirect(m.code)) return directSum(m.code)?{t:'완료',c:'ok'}:{t:'미입력',c:'wa'};
  if(!(billTotal(m)>0)) return {t:'고지서 미입력',c:'wa'};
  if(isMetered(m.code)){
    const R=ratios(m), no=R.rows.filter(r=>r.hasM&&!r.typed).length;
    const neg=R.rows.filter(r=>r.neg).length;
    if(neg) return {t:`검침 역전 ${neg}`,c:'wa2'};
    if(no)  return {t:`미검침 ${no}`,c:'wa'};
  }
  return {t:'완료',c:'ok'};
}

function setRead(code,no,v){

  if(b.read&&b.read[no]) b.read[no][1]=n;

}

function setDirect(code,no,v){

  render(true);
}

function stAdj(m,R){
  if(R.direct) return stDirect(m,R);
  const U=m.unit||'', st=resolve(m.code), B=calc(m,true);   /* B = 배율 1.0 기준선 */
  const rows=R.rows;
  if(!rows.length) return `<div class="tbl"><div class="empty">

  const bb=B.rows.reduce((o,r)=>(o[r.no]=r,o),{});
  const byUse=R.byUse;
  const base=r=>byUse?r.use:r.ar;
  const bSum=rows.reduce((a,r)=>a+base(r),0);
  /* 사용량 개념이 없는 항목은 금액으로 표시한다 */
  const amtMode=!m.unit, TOT=billTotal(m);

  const cBase =byUse?'개별 사용량':'임대면적';
  /* 배분 기준이 면적인데 계량기가 있으면 개별 사용량을 따로 보여준다.
     누가 얼마를 직접 썼는지 알아야 배율을 정할 수 있다 */

  const now=r=>amtMode?won(r.amt):fx(r.common)+' '+U;
  const dOf=r=>amtMode?(r.amt-bb[r.no].amt):(r.common-bb[r.no].common);
  const big=d=>amtMode?Math.abs(d)>=1:Math.abs(d)>0.05;
  const dTx=d=>(d>0?'+':'−')+(amtMode?won(Math.abs(d)):fx(Math.abs(d)));

    <div class="tw"><table>

        <td>${cnameST(r,m)}</td>
        ${showUse2?`<td class="n" style="color:var(--muted)">${r.hasM

        <td class="n" style="color:var(--muted)">${byUse?fx(base(r),base(r)%1?1:0)+' '+U:fx(base(r))+' ㎡'}</td>
        <td class="n" style="color:var(--muted)">${R.common?(r.common/R.common*100).toFixed(2)+'%':'—'}</td>
        <td class="n">${r.mul===0?'<span class="bd mu">부담 없음</span>':`<b>${now(r)}</b>`}</td>
        <td class="c"><input class="inp w" value="${r.mul}" step="0.1" min="0" type="number"
             onchange="setMul('${m.code}','${r.no}',this.value)"></td>
        <td class="n">${big(d)?`<span class="dlt ${d>0?'up':'dn'}">${dTx(d)}</span>`
          :'<span style="color:var(--faint)">—</span>'}</td></tr>`}).join('')}
        <tr class="sumr"><td>합계</td>
          ${showUse2?`<td class="n">${fx(rows.reduce((a,r)=>a+r.use,0),0)} ${U}</td>`:''}
          <td class="n">${byUse?fx(bSum,bSum%1?1:0)+' '+U:fx(bSum)+' ㎡'}</td>
          <td class="n">100.00%</td>
          <td class="n">${amtMode?won(rows.reduce((a,r)=>a+r.amt,0)):fx(R.common)+' '+U}</td>
          <td></td>
          <td class="n">${(v=>big(v)?dTx(v):(amtMode?won(0):fx(0)))(dSum)}</td></tr>
      </tbody></table></div>
  </div>
  ${R.over?`<div class="fnd"><span class="h">배율이 너무 큽니다</span>

/* ═══ 일할 계산기 — 고지서 부과 기간 중 일부만 쓴 계약(입주·퇴거)의 몫을 줄인다 → PAY-10 · 4.1.9
   일수는 양 끝을 모두 센다. 원 미만은 버린다. 계산값은 담당자가 고칠 수 있다. 줄어든 몫은 공실·미청구분(건물주 부담)으로 간다 ═══ */
let prc=null;
function prcOpen(code,no){
  const m=M(code), b=BILL[code], R=calc(m), r=R.rows.find(x=>x.no===no), ov=(b.pr||{})[no];
  const c=CTRS.find(x=>x.b==='b1'&&x.no===no&&x.st==='진행중');
  const from=itemFrom(c,m.name), end=ctrEnd(c);
  const af=ov?ov.af:(b.from&&dnum(from)>dnum(b.from)?from:b.from||''), at=ov?ov.at:(b.to&&end&&dnum(end)<dnum(b.to)?end:b.to||'');
  prc={code,no,ten:r.ten,from:b.from||'',to:b.to||'',af,at,base:r.orig!=null?r.orig:r.amt,amt:ov&&ov.amt!=null?String(ov.amt):'',why:ov?ov.why:'',had:!!ov};
  DRAWER='prc';render(true);}
/* 계산값 — 정산 엔진에 이 기간을 넣어 본 값. 절사 잔차까지 다시 나눈 결과다 */
const prcCalc=()=>{const b=BILL[prc.code], keep=b.pr, kf=b.from, kt=b.to;
  b.pr={...(keep||{}),[prc.no]:{af:prc.af,at:prc.at,amt:null}}; b.from=prc.from; b.to=prc.to;
  const v=(calc(M(prc.code)).rows.find(r=>r.no===prc.no)||{}).amt||0;
  b.pr=keep; b.from=kf; b.to=kt; return v;};
const prcWhy=()=>`일할 ${daysIn(prc.af,prc.at)}/${daysIn(prc.from,prc.to)}일 (${prc.af.slice(5).replace('-','.')}~${prc.at.slice(5).replace('-','.')})`;
function prcSet(f,v){prc[f]=v; if(f!=='amt'&&f!=='why'){prc.amt='';} render(true);}
function prcApply(){const b=BILL[prc.code], v=prc.amt===''?null:numOf(prc.amt);
  if(v!=null&&v>prc.base) return;
  (b.pr=b.pr||{})[prc.no]={amt:v===prcCalc()?null:v,af:prc.af,at:prc.at,why:prc.why.trim()||prcWhy()};
  if(!b.from&&prc.from){b.from=prc.from;b.to=prc.to;}
  SAVED[prc.code]=null;DRAWER=null;prc=null;render(true);}

      <div class="fg"><div class="fl">이 계약이 쓴 기간</div>${D('af','적용 시작일')}${D('at','적용 종료일')}${V('적용 일수',`<b>${ad}일</b>`)}
        <div class="c2" style="margin:0;white-space:normal">기산일·계약 종료일로 미리 채웠습니다. 양 끝 날짜를 모두 셉니다.</div></div>

/* ═══ PAY-12 청구 현황 — 「청구 관리」 메뉴를 누르면 열린다. 달을 고르고 건물마다 그 달이 어디까지 왔는지(정산 → 발행 → 수납) 보고 마감한다.

  const T=D.reduce((a,x)=>{a.n+=x.N.n;a.N+=x.N.N;a.bill+=x.N.bill||0;a.paid+=x.N.paid||0;a.due+=Math.max(0,x.due||0);

/* ═══ PAY-14 수납 현황 — 「수납 관리」 메뉴를 누르면 열린다. 오늘 기준으로 건물마다 돈의 상태를 본다(달을 고르지 않는다).

/* 카리나빌딩 외 건물은 목업 예시값 */
const SU_EX={b2:{wait:2,due:8420000,dueN:5,fee:0,over:330000,overN:1,paid:96500000},b4:{wait:0,due:1250000,dueN:1,fee:4110,over:0,overN:0,paid:61200000}};

    /* 해지일이 이번 회차 안이면 고정액은 해지일까지 일할. 해지일이 청구일 앞이면 해지 처리 때 바로 발행한 마지막 청구서라 정산 항목을 싣지 않는다 → 4.2.3 · 확인요청 답변 질문 2 */
    const tOut=PAST_CTX?'':termIn(ckey(c),SETTLE.ym), tNow=tOut&&dnum(tOut)<dnum(billOn(SETTLE.ym));
    /* 정산액을 다른 계약이 부담하는 유닛 — 그 유닛의 안분 결과를 이 계약에 얹는다 */
    const via=tNow?[]:all.filter(d=>d.payTo===c.no);
    const lineOf=(x,unit)=>{
      const d=CITEM[x[0]]||{calc:'고정액'};
      /* 고정액 — 기산일과 반복 주기로 이번 회차 대상인지 판정. 임대료 인상 예약이 있으면 적용일부터 새 금액 */
      if(d.calc==='고정액'){
        const ym=PAST_CTX||SETTLE.ym;
        if(!cycleDue(itemCycle(c,x[0]),itemFrom(c,x[0]),ym)) return null;
        const bd=itemDoc(c,x[0]);
        /* 약정액 0원 — 청구하지 않는다(예: 301호 고정관리비) */
        if(!x[1]) return null;
        const sup=adjSup(c,x[0],x[1],ym), v=isTax(bd)?adjVat(c,x[0],x[1],ym):0, fx=tOut&&((TERMS[ckey(c)]||{}).fix||{})[x[0]], pr=tOut&&proOf(sup+v,isTax(bd),tOut);
        /* 해지 처리에서 담당자가 넣은 해지 달 금액 */
        if(fx) return {n:x[0],bill:bd,src:`임대차계약서 · 해지 처리 금액${pr?` (${pr.d}/${pr.n}일)`:''}`,supply:fx.sup,vat:fx.vat,amt:fx.sup+fx.vat,st:'약정',stc:'mu',pro:pr||null};
        if(pr) return {n:x[0],bill:bd,src:`임대차계약서 · 해지 일할 ${pr.d}/${pr.n}일`,supply:pr.sup,vat:pr.vat,amt:pr.amt,st:'약정',stc:'mu',pro:pr};
        return {n:x[0],bill:bd,src:'임대차계약서',supply:sup,vat:v,amt:sup+v,st:'약정',stc:'mu'};
      }
      /* 정산액 대납 계약이 있으면 이 계약의 정산 항목은 그 계약 청구서에 대납으로 실린다 — 여기서는 싣지 않는다 */
      if(c.payTo||tNow) return null;
      /* 정산 — 1단계에서 선택되지 않았으면 이번 회차 대상이 아니다 */
      const code=codeOf(x[0]), m=M(code), b=BILL[code];
      if(!(f1.b==='b1'&&b&&b.on)) return null;
      const st=resolve(code), ev=`${st.by||m.src||''} ${st.doc||m.doc||''}`.trim();
      const S={n:x[0],bill:m.bill,src:ev,
               st:fixed?'정산 확정':'정산 미확정', stc:fixed?'ok':'wa'};
      if(!(billTotal(m)>0)) return {...S,supply:null,vat:null,amt:null};
      /* 유닛이 여럿인 계약은 유닛별 산출 결과를 합친다 */
      const us=Array.isArray(unit)?unit:[unit];
      const rs=calc(m).rows.filter(r=>us.includes(r.no));
      if(!rs.length) return {...S,supply:null,vat:null,amt:null};
      const sm=k=>rs.reduce((a,r)=>a+r[k],0);
      /* 0원인 정산 항목은 싣지 않는다(주차면 없음 · 배율 0 등) */
      if(sm('amt')===0) return null;
      return {...S,supply:sm('supply'),vat:sm('vat'),amt:sm('amt')};
    };
    /* 청구 대상 — 계약의 고정액 약정 + 건물 관리비 탭의 정산 항목 전부. 정산 항목은 계약에 두지 않고 건물을 따른다 */
    const bd=BUILDINGS.find(x=>x.id===c.b)||{}, varItems=(bd.charge||[]).filter(x=>x.use&&!x.fixed).map(x=>[x.it]);
    const items=[...c.it.filter(x=>itemCalc(x[0])==='고정액'),...varItems];
    const lines=items.map(x=>lineOf(x,c.units||c.no)).filter(Boolean)
;   /* 비정기 청구는 정기 청구서에 싣지 않는다 */
    /* 대납분 — 자기 정산 항목을 그 유닛에 적용해 산출한다 */
    /* 대납분 — 금액이 0인 항목은 싣지 않는다. 계량기를 공유해 사용분이 0인 경우다 */
    via.forEach(d=>varItems.forEach(x=>{
      const l=lineOf(x,d.no);
      if(l&&l.amt!==0) lines.push({...l,via:`${d.no}|${d.ten}`});
    }));
    const k=ckey(c);
    /* 해지 달 정기 청구서(아직 발행 전)에 퇴거 예상분도 싣는다 — 해지일이 청구일 앞이면 저장할 때 바로, 뒤면 청구일에 나간다. 해지 때 청구서는 한 장이다 → 28
       이미 발행한 뒤 해지(after)는 해지 청구서로 따로 나가므로 TERMS.est가 비어 있다 */
    if(tOut) ((TERMS[k]||{}).est||[]).forEach(e=>lines.push({n:e.n,bill:e.doc,src:`해지 처리 · 퇴거 예상분${e.from?` (${e.from.slice(5).replace('-','.')}~${e.to.slice(5).replace('-','.')})`:''}`,
      supply:e.sup,vat:e.vat,amt:e.sup+e.vat,st:'약정',stc:'mu',est:true}));
    /* 연체료 — 이번 회차 청구서에 기본으로 넣는다(발행일 전날까지 쌓인 금액). 발행한 청구서는 발행 때 금액을 보인다.
       지난 회차는 발행할 때 넣은 연체료 청구를 보인다(6월분은 없음 · 7월분 7/18까지) → 18-2 */
    const z=ISS[k], pf=PAST_CTX?BILLS.find(i=>i.k===k&&i.ym===PAST_CTX&&i.reg):null;
    const fee=PAST_CTX?(pf?pf.amt:0):z?z.feeAll||0:termFeeAmt(k,tOut,feeUntil(k,tOut||dayBefore(TODAY_S)));
    /* 연체료는 대가가 아니라 늦게 낸 데 대한 연체이자라 부가세 대상이 아니다(부가가치세법 29조 5항 5호) → 4.4.3 */
    if(fee){
      lines.push({n:'연체료',bill:'일반내역서',src:`${(pf?pf.feeTo:tOut||dayBefore(z?z.at:TODAY_S)).slice(5).replace('-','.')}까지 · 연 ${rateOf(k)}%${tOut&&(TERMS[k]||{}).fee!=null?' · 해지 처리 금액':''}`,
        supply:fee,vat:0,amt:fee,st:'연체료',stc:'wa',fee:true});}
    /* 넣을 항목 — 약정은 잠근다. 발행한 청구서는 발행 때 고른 대로 */
    const o=PAST_CTX?{}:OFF1[k]||{};
    lines.forEach(l=>{l.id=lid(l); l.lock=l.st==='약정'; l.off=!l.lock&&!!o[l.id];});
    const inc=lines.filter(l=>!l.off), nOff=lines.length-inc.length, feeIn=inc.some(l=>l.fee);
    const sum=inc.reduce((a,l)=>a+(l.amt||0),0);
    const sup=inc.reduce((a,l)=>a+(l.supply||0),0);
    const vat=inc.reduce((a,l)=>a+(l.vat||0),0);
    const miss=inc.filter(l=>l.amt==null).length;
    return {...c,k,lines,inc,nOff,fee,feeIn,sum,sup,vat,miss,via,
            due:dueOf(k,PAST_CTX||SETTLE.ym),over:PAST_CTX?0:overOf(k),st:PAST_CTX||ISS[k]?'발행 완료':'발행 대기',term:!PAST_CTX&&!!(ISS[k]||{}).term};
  });
}

    <b>약정</b>(임대료·고정관리비)은 계약에 등록된 청구 약정에서, <b>정산</b> 항목은
    <b>관리비 정산(PAY-10)</b> 확정 결과에서 가져온다.<br>
    <b>근거</b>는 그 금액을 뒷받침하는 문서다. 임차인이 산출 근거를 물으면 이 문서를 보여준다.
    항목별 근거 문서는 <b>건물 관리 › 관리비</b>에서 정한다.<br>
    <b>이번 회차 대상 항목만 올라온다.</b> 고정액은 약정의 반복주기로, 정산은
    <b>관리비 정산에서 선택한 항목</b>으로 정해진다. 격월·반기 항목의 비대상 회차는
    관리비 정산에서 이미 빠졌으므로 여기에 나오지 않는다.<br>
    <b>대납</b>은 그 유닛의 안분 결과를 다른 계약이 부담한다는 뜻이다.
    계약에 <b>정산액 대납 계약</b>을 지정하면 산출은 유닛 기준으로 하고 청구만 옮긴다.<br>
    <b>미납 잔액</b>은 원장에서 계산되는 값이며 이번 회차 청구와 별개다.
    청구서에는 <b>합계에 넣지 않고 별도 안내로</b> 표기한다. 세금계산서에는 넣지 않는다.
    <b>과납</b>(돌려줄 돈)도 같은 칸에 같은 방식으로 표기한다.<br>
    항목 상태는 넷이다. <b>약정</b>(계약서 금액이라 변하지 않는다) ·
    <b>정산 미확정</b>(관리비 정산을 확정하면 확정된다) · <b>정산 확정</b>. 비정기 청구는 정기 청구서에 싣지 않고 따로 발행한다.<br>
    <b>합계는 부가세 포함</b>이다. 임차인이 실제로 납부하는 금액이다.
    발행 문서가 <b>세금계산서</b>인 항목만 부가세가 붙는다.<br>
    금액 칸의 <b style="color:var(--warn)">미산출</b>은 이번 회차 대상인데 금액이 없다는 뜻이다.
    그대로 발행하면 그 항목이 빠진 청구서가 나간다.<br>
    <b>연체료</b>는 발행일 전날까지 쌓인 금액이 청구서에 한 줄로 기본으로 들어간다(일반내역서 · 비과세. 연체이자는 공급가액에 넣지 않는다 · 부가가치세법 29조 5항 5호). 발행하면 발행일 전날이 연체료 정리일이 된다. 발행일부터 쌓이는 연체료는 다음 청구서에 들어가거나 보증금 상계에서 받는다. 면제는 없다 → 18<br>
    <b>항목 체크박스</b>로 이번 청구서에 넣을 항목을 계약마다 고른다. 기본은 모두 넣기. <b>약정</b>(임대료 · 고정관리비)은 잠겨 뺄 수 없다. 뺀 항목은 계산은 그대로 하고 청구하지 않는다. <b>임대인 부담(감면)</b>이며 다음 청구서로 넘어가지 않는다. 연체료도 같다. 이번 청구서에만 적용하고 다음 회차는 다시 모두 넣기로 시작한다. 연체료 일부 감면은 발행 뒤 계약 상세의 <b>청구 감액</b>으로 연체료 줄을 줄인다<br>
    발행하면 원장에 <b>청구</b> 거래로 기록된다. 발행 버튼을 누르면 메일을 보낼지 묻고, <b>메일 보내고 발행</b>을 고르면 임차인 담당자에게 이메일이 발송된다(받는 사람은 계약 상세 › 요약 › 담당자에서 「청구서 메일」을 체크한 사람이다. 아무도 없는 계약은 메일을 보내지 않는다). 계약 하나만 발행하려면 더보기의 <b>청구서 발행</b>을 누른다.<br>
    발행한 청구서는 고치지 않는다. 입금이 없고 마감 전이면 <b>취소</b>하고 다시 발행한다(원장에 청구 취소). 입금 뒤에는 계약 상세의 <b>청구 감액</b>·<b>청구 추가</b>로 바로잡는다.</div>`;

function parseBank(raw,base){

  const map={dt:col(/거래일시/),kind:col(/^적요$/),name:col(/기재내용/),amt:col(/^입금/),out:col(/^지급/)};
  const n=v=>+String(v||'0').replace(/,/g,'')||0;

function rcPreview(d,biz,B){
  if(!biz||!B[biz]) return null;

/* 상태는 다섯이다 — 처리 전: 자동 매칭 · 미매칭 / 처리 후: 확정 · 무시 · 오납.
   내부의 후보(비슷한 상호)·지정(담당자가 고름)은 화면에서 모두 미매칭이다 → PAY-13 */
function rcRun(){
  const B=rcBiz(), res={};
  RC.P.dep.forEach(d=>{
    const dec=RC.dec[d.no]||{};
    if(dec.done){res[d.no]=dec.done;return;}
    if(dec.ex){res[d.no]={st:'제외',nm:normName(d.name)};return;}
    if(dec.mis){res[d.no]={st:'오납',nm:normName(d.name)};return;}
    const g=rcGuess(d,B);
    res[d.no]={...g,cand:g.biz,wait:true};
  });
  return res;
}
/* 대기열 — 입금일시 오름차순. 같은 임차인이 나눠 낸 입금은 앞 것을 먼저 확정해야 한다 */
const rcQueue=()=>[...RC.P.dep].sort((a,b)=>a.dt<b.dt?-1:a.dt>b.dt?1:0);
const rcIsOpen=d=>{const x=RC.dec[d.no]||{};return !x.done&&!x.ex&&!x.mis;};
const rcNext=()=>(rcQueue().find(rcIsOpen)||{}).no||null;

function rcConfirm(no,sys){

  const auto=!!sys&&g.st==='자동'&&!(pl.rest>0)&&(sys==='seed'||!mcLocked(RC.b,d.dt.slice(0,7)));   /* seed — 7월은 그때 아직 열려 있었다 */
  if(sys==='only'&&!auto) return;

  if(RC.reg[no]!==false&&g.st!=='자동') RC.alias[g.nm]=g.biz;   /* 입금자명 등록 */
  /* 남는 돈은 과납 — 마지막으로 배분된 계약에 속한다. 배분할 청구가 없었으면 그 임차인의 첫 계약 → 4.3.4 */

let QUIET=false;
function seedJuly(){

  rcQueue().forEach(d=>{
    if(d.no===17||d.no===55){rcIgnore(d.no);return;}          /* 자금반환 · 렌터카 — 임차인 입금이 아니다 */
    const g=rcGuess(d,rcBiz()); if(g.st!=='자동'&&PK[d.no]) RC.pre[d.no]=PK[d.no];
    rcConfirm(d.no,'seed');   /* 자동 수집으로 들어온 날 등록된 입금자명이면 시스템이 확정했다. 나머지는 담당자가 */
  });

}
/* 6월 입금 — 7월보다 먼저 처리됐다(7/3 마감). 원장 자료이므로 검증에서도 처리된 상태로 시작한다.
   첫 달이라 등록된 입금자명이 없어 모두 담당자가 골랐다 → 이때 등록한 입금자명으로 7월 입금은 대부분 자동 매칭된다 */
function seedMonth(ym,pk,ign){

/* 6월도 자동 수집이다. 첫 달이라 등록된 입금자명이 없어 자동 확정된 것은 없다 */
seedMonth('2026-06',{101:'루비뮤직',102:'케이큐엔터테이먼트',103:'케이더블유인터내셔널',104:'케이더블유인터내셔널',105:'아이씨비',
  106:'에스씨케이컴퍼니',107:'아마데우스',108:'고우컴퍼니',109:'유니버셜대부',112:'좋은생각사람들'},[114]);
/* 전월 과납액 — 청구서를 발행할 때 남은 과납을 새 청구에 자동으로 먼저 배분한다 → 4.3.4
   수납 배분만 옮기고 원장에는 적지 않는다. 잔액은 그대로 → 2.7 */
const CREDITS=[];
function applyCredits(ym,date){
  /* 발행일 전날까지의 원장 잔액이 0보다 작으면 그만큼이 과납이다 */
  const before=k=>ledgerOf(k).rows.filter(r=>r.acc==='매출채권'&&dnum(r.date)<dnum(date)).reduce((a,r)=>a+(r.inc||0)-(r.dec||0),0);
  CTRS.filter(c=>c.b==='b1'&&c.st==='진행중').forEach(c=>{const k=ckey(c), amt=Math.max(0,-before(k)); if(!amt) return;
    /* 우선순위가 낮은 항목부터 채운다 — 임차인이 낸 돈이 임대료처럼 큰 항목에 그대로 맞도록 → 4.3.4 */
    const its=BILLS.filter(i=>i.k===k&&i.ym===ym).map(i=>({i,pr:prioOf(i.n.split(' ')[0]),due:i.amt-cutOf(i.id)-paidNet(i.id)})).filter(x=>x.due>0).sort((a,b)=>b.pr-a.pr);
    const dep='cr'+ym, sq=++paySeq; let r=amt, used=0;
    its.forEach(x=>{if(r<=0) return; const p=Math.min(r,x.due); addPay(x.i.id,p,date,'전월 과납액',dep); r-=p; used+=p;});
    if(used) CREDITS.push({k,ym,amt:used,date,dep,sq});});
}
/* 정기 청구서의 연체료 — 발행일 전날까지 쌓인 연체료를 그 달 청구서에 한 줄로 넣는다. 발행일 전날이 연체료 정리일이다 → 18-2
   6월분은 첫 달이라 연체료가 없다. 7월분(7/19 발행 · 7/18까지)에는 6월분을 늦게 낸 계약에 들어간다 */
function issueFee(ym,date){const to=dayBefore(date);
  CTRS.filter(c=>c.b==='b1'&&c.st==='진행중').forEach(c=>{const k=ckey(c), amt=feeUntil(k,to); if(!amt) return;
    BILLS.push({id:`${ym}|${c.no}|연체료`,ym,k,no:c.no,n:'연체료',amt,fee:true,reg:true,feeTo:to});
    FEE_CUT[k]=to;});
}
