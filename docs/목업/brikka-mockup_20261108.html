      <span class="c2" style="margin:auto 0 auto 4px">임차인 입금이 아니면 무시, 잘못 들어와 돌려줄 돈이면 오납</span>
      <button class="btn pri" style="margin-left:auto" ${g.biz?'':'disabled'} onclick="rcConfirm(${d.no})">확정하고 다음 입금 →</button>
    </div>`;
  }
  const allDone=Q.every(q=>!rcIsOpen(q));
  const lk=mcLocked(RC.b,RC.f.ym), lkc=lk?MC[RC.b][RC.f.ym]:null;
  return head+`
  ${lk?`<div class="fnd"><span class="h">${ic('lock',14)} 마감된 회차입니다</span>
    ${RC.f.ym.replace('-','년 ').replace(/년 0/,'년 ')}월은 ${lkc.at.replace('-','.')}에 마감했습니다(${lkc.by}). 입금을 확정·무시하거나 고칠 수 없고 볼 수만 있습니다.
    고치려면 청구 현황에서 <b>마감 취소</b>를 먼저 하세요. <b class="lk" onclick="f12='${RC.f.ym}';go('pay-12')">청구 현황으로 이동 →</b></div>`
  :allDone?`<div class="fnd"><span class="h">모든 입금을 처리했습니다</span>
    계약별로 다 받았는지는 수납 내역에서 확인하세요. <b class="lk" onclick="go('pay-6')">수납 내역으로 이동 →</b></div>`:''}
  <div class="mw">
    <div class="mq"><div class="mqh">대기열 <span class="c2" style="margin:0">입금일시 순</span></div>${queue}
</div>
    <div class="${lk?'locked':''}">${panel}</div>
  </div>`;
}

/* ═══ 계약 × 달 한 줄 — 수납 내역(PAY-6)과 계약 상세 「청구·수납」 탭이 같은 모양을 쓴다 ═══ */
/* 그룹 행 금액 — 들어온 이월 미납액은 더하고 전월 과납액은 뺀다 */
/* 청구액 칸은 감액을 뺀 금액 — 감액이 있으면 아래에 「감액 −○」로 보인다 */
const rcvSum=x=>({bill:x.bill-(x.cut||0)+(x.carry?x.carry.amt-(x.carry.cut||0):0)-(x.credit||0),cut:(x.cut||0)+(x.carry?x.carry.cut||0:0),paid:x.paid+(x.carry?x.carry.paid:0)-(x.credit||0),due:x.due+(x.carry?x.carry.due:0)});
const cutNote=v=>v?`<div class="c2" style="margin:0">감액 −${won(v)}</div>`:'';
function rcvRow(x,o){
  const dash='<span style="color:var(--faint)">—</span>', op=o.op, cr=x.carry, closed=closedBy(bOfK(x.k),o.ym,TODAY_S), g=rcvSum(x);
  const tail=o.more!==undefined?'<div></div>':'';
  const sub=!op?'':(cr?`
      <div class="schr ${o.cls} sub ni"><div class="nm">이월 미납액</div>
        <div class="n c2">${won(cr.amt-(cr.cut||0))}${cutNote(cr.cut)}</div><div class="n c2">${cr.paid?won(cr.paid):dash}</div>
        <div class="n">${cr.due?`<span style="color:var(--warn)">${won(cr.due)}</span>`:dash}</div>
        <div class="c"><span class="bd ${PST[cr.due?(closed?'미납':cr.paid?'부분납':'미납'):'완납']}">${cr.due?(closed?'미납':cr.paid?'부분납':'미납'):'완납'}</span></div>${tail}</div>`:'')+(x.credit?`
      <div class="schr ${o.cls} sub ni"><div class="nm">전월 과납액</div>
        <div class="n c2">−${won(x.credit)}</div><div class="n c2">−${won(x.credit)}</div><div class="n">${dash}</div><div class="c"></div>${tail}</div>`:'')+x.it.map(i=>`
      <div class="schr ${o.cls} sub"><div class="nm">${i.n}</div>
        <div class="n c2">${won(i.amt-(i.cut||0))}${cutNote(i.cut)}</div><div class="n c2">${i.paid?won(i.paid):dash}</div>
        <div class="n">${i.due?`<span style="color:var(--warn)">${won(i.due)}</span>`:dash}</div>
        <div class="c"><span class="bd ${PST[i.st]}">${i.st}</span></div>${tail}</div>`).join('')+(!x.over?'':`
      <div class="schr ${o.cls} sub ni"><div class="nm">과납액</div>
        <div class="n c2">${dash}</div><div class="n c2">${won(x.over)}</div><div class="n">${dash}</div>
        <div class="c"></div>${tail}</div>`);
  /* 납부마감일 · 월 마감일 칸(계약 상세 청구·수납 탭) — 펼친 항목 줄은 비운다 */
  const pre=(o.dueCol!==undefined?'<div></div>':'')+(o.closeCol!==undefined?'<div></div>':'');
  return `<div class="schr ${o.cls} grp" onclick="${o.tog}">
      <div class="nm"><span class="tg ${op?'op':''}">${ic('chev',16)}</span>${o.label}</div>${o.dueCol!==undefined?`<div>${o.dueCol}</div>`:''}${o.closeCol!==undefined?`<div>${o.closeCol}</div>`:''}
      <div class="n">${won(g.bill)}${cutNote(g.cut)}</div>
      <div class="n">${g.paid?won(g.paid):dash}</div>
      <div class="n">${g.due?`<b style="color:var(--warn)">${won(g.due)}</b>`:dash}</div>
      <div class="c"><span class="bd ${PST[x.st]}">${x.st}</span></div>${o.more!==undefined?`<div class="c">${o.more}</div>`:''}</div>`+(pre?sub.replace(/(<div class="nm">[^<]*<\/div>)/g,'$1'+pre):sub);
}

/* ═══ 더보기 — 표 맨 오른쪽 칸. 할 일이 하나여도 늘 ⋮ 드롭다운이다(모양을 하나로) → 3.8
   할 수 없는 일은 흐린 글씨로 두고 이유는 마우스를 올리면 보인다. items: [{t, go, off}] ═══ */
const MORE=[];
function moreCell(items){
  const id=MORE.push(items)-1;
  return `<span class="more mtg" title="더보기" onclick="event.stopPropagation();moreOpen(${id},this)">⋮</span>`;
}
function moreOpen(id,el){
  moreClose(); const r=el.getBoundingClientRect(), m=document.createElement('div');
  m.className='mmenu'; m.id='mmenu';
  m.innerHTML=MORE[id].map((i,n)=>i.off?`<div class="mi off" title="${i.off}">${i.t}</div>`:`<div class="mi" data-n="${n}" ${i.title?`title="${i.title}"`:''}>${i.t}</div>`).join('');
  m.style.top=(r.bottom+4)+'px'; m.style.right=(window.innerWidth-r.right)+'px';
  m.onclick=e=>{e.stopPropagation();const n=e.target.dataset.n; if(n==null) return; moreClose(); new Function(MORE[id][n].go)();};
  document.body.appendChild(m);
  setTimeout(()=>{document.addEventListener('click',moreClose,{once:true});window.addEventListener('scroll',moreClose,{once:true});});
}
function moreClose(){const m=document.getElementById&&document.getElementById('mmenu'); if(m) m.remove();}

/* ═══ PAY-6 수납 내역 — 계약 기준 조회 화면. 한 계약 × 한 달이 한 행 ═══ */
let g6={}, g6All=false;
const g6Open=k=>(k in g6)?g6[k]:g6All;
const g6Tog=k=>{g6[k]=!g6Open(k);render(true);};
const g6Set=v=>{g6All=v;g6={};render(true);};
/* 청구서 보기 — 그 달 발행해 보낸 청구서 PDF 그대로 */
function billView(k,ym){
  ipvOpen({title:'청구서 보기',sub:`${ym.replace('-','년 ').replace(/년 0/,'년 ')}월분 · 발행해 보낸 청구서 그대로입니다`,docs:()=>invRegDocs(ym,bOfK(k),[k])});}
function PAY6(){
  const bn=BUILDINGS.find(x=>x.id===RC.f.b)||BUILDINGS[0];
  const has=RC.f.b===RC.b&&['2026-06','2026-07'].includes(RC.f.ym);
  const waitN=RC.f.b===RC.b?RC.P.dep.filter(rcIsOpen).length:0;
  const all=has?CTRS.filter(c=>c.b===RC.b&&c.st==='진행중')
    .map(c=>({c,k:ckey(c),...ctrPay(ckey(c),RC.f.ym)})).filter(x=>x.st):[];
  const rows=all.filter(x=>!RC.f.st||x.st===RC.f.st);
  const anyOp=rows.some(x=>g6Open(x.k));
  /* 그룹 행 — 들어온 미납액도 함께 더한다 */
  const T=rows.reduce((a,x)=>{const g=rcvSum(x);return {bill:a.bill+g.bill,paid:a.paid+g.paid,due:a.due+g.due};},{bill:0,paid:0,due:0});
  const dash='<span style="color:var(--faint)">—</span>';
  /* 더보기 — 입금 확인은 그 임차인의 입금만 거른 입금 매칭. 청구서 보기는 그 달 발행한 청구서. 원장 보기는 계약 상세 원장 탭으로 */
  const more=x=>{
    return moreCell([{t:'입금 확인',go:`depCheck('${x.k}')`},
      {t:'청구서 보기',go:`billView('${x.k}','${RC.f.ym}')`},
      {t:'원장 보기',go:`tab3c='원장';go('ctr-3/${x.k}')`}]);};
  const body=rows.map(x=>rcvRow(x,{cls:'ctr',op:g6Open(x.k),tog:`g6Tog('${x.k}')`,label:cnameHTML(bn.alias,x.c.no,x.c.ten),ym:RC.f.ym,more:more(x)})).join('');
  return `
  <div class="ph"><h1>수납 내역</h1><span class="sid">PAY-6</span>
  </div>
  <div class="fbar">
    <select onchange="setRC('b',this.value)">
      ${BUILDINGS.map(b=>`<option value="${b.id}" ${RC.f.b===b.id?'selected':''}>${b.name}</option>`).join('')}
    </select>
    <select onchange="setRC('ym',this.value)">
      ${[['2026-08','2026년 8월'],['2026-07','2026년 7월'],['2026-06','2026년 6월']].map(([v,t])=>
        `<option value="${v}" ${RC.f.ym===v?'selected':''}>${t}</option>`).join('')}
    </select>
    <select onchange="setRC('st',this.value)">
      ${['','완납','부분납','납부전','미납','과납'].map(v=>`<option value="${v}" ${RC.f.st===v?'selected':''}>${v||'전체 납부상태'}</option>`).join('')}
    </select>
  </div>
  ${waitN?`<div class="fnd wa3"><span class="h">확정 전 입금 ${waitN}건</span>
    아직 기록되지 않은 입금이 있어 이미 낸 계약도 <b>미납</b>으로 보일 수 있습니다.
    <b class="lk" onclick="go('pay-13')">입금 매칭으로 이동 →</b></div>`:''}
  ${!rows.length?`<div class="tbl"><div class="empty"><div class="t">${has?'조건에 맞는 계약이 없습니다':'이 달의 청구가 없습니다'}</div>
     ${has?'다른 납부상태를 선택해 보세요.':'청구서를 발행하면 계약별 수납 상태가 표시됩니다.'}</div></div>`
  :`<div class="tbl schl">
    <div class="schr ctr hd"><div>${rows.length?allTog(anyOp,`g6Set(${anyOp?'false':'true'})`):''}계약고유이름 · 청구항목</div><div class="n">청구액</div><div class="n">수납액</div>
      <div class="n">미납액</div><div class="c">납부상태</div><div class="c">더보기</div></div>
    ${body}
    <div class="schr ctr sum"><div>합계 <span class="lock">계약 ${rows.length}</span></div>
      <div class="n">${won(T.bill)}</div><div class="n">${won(T.paid)}</div>
      <div class="n">${T.due?`<span style="color:var(--warn)">${won(T.due)}</span>`:'—'}</div><div></div><div></div></div>
  </div>`}
  <div class="hint">
    선택한 달의 청구를 계약별로 다 받았는지 봅니다. 금액은 부가세 포함입니다.<br>
    밀린 달 전부의 미납과 미납 안내는 미납 관리에서, 입금 한 건 한 건은 입금 매칭에서 봅니다. 받을 돈은 모두 건물 계좌로 받고 입금 매칭에서 기록합니다. 「냈다」는 임차인의 입금은 더보기의 <b>입금 확인</b>으로 찾습니다.<br>
    <b>이월 미납액</b>은 지난달 마감 때 다 받지 못해 넘어온 돈, <b>전월 과납액</b>은 더 받아 넘어온 돈입니다(이 달 청구에서 먼저 빠짐). 마감한 달은 그 뒤로 바뀌지 않고, 들어온 돈은 이월 미납액부터 줄입니다.<br>
    <b>과납액</b>은 그 달 청구를 다 받고 남은 돈입니다. 입금은 우선순위대로 배분되므로 어느 항목의 돈이라고 할 수 없어 따로 한 줄로 둡니다.
    다음 달로 넘어가 다음 청구서를 발행할 때 먼저 배분되어 낼 돈이 줍니다. 청구항목이 아닌 줄(이월 미납액 · 전월 과납액 · 과납액)은 연한 배경으로 구분합니다.</div>`;
}

/* ═══ 보증금 상계 — 미납을 보증금에서 뺀다(슈퍼관리자). 받는 돈은 모두 건물 계좌로 들어와 입금 매칭(PAY-13)에서만 기록한다.
   현금 · 카드 · 계좌이체를 담당자가 직접 기록하는 수납 처리는 없다 → 명세변경_261108 25 · CTR-3 ═══ */
let pm=null, pmSeq=0;
const MANUAL_DEP=[];   /* 보증금상계 — 원장의 임대보증금에서 뺀다 */
/* 퇴거하는 계약 — 해지 처리를 했거나 종료됨 · 파기됨. 보증금 반환 패널이 남은 잔액 전부를 미리 넣는 기준이다.
   보증금 상계는 이와 상관없이 계약 중 언제든 할 수 있다(슈퍼관리자) */
const isLeaving=k=>{const c=CTRS.find(x=>ckey(x)===k);return !!TERMS[k]||!!c&&(c.st==='종료됨'||c.st==='파기됨');};
/* 이 계약의 연체료 — 받은 날까지. 이미 청구한 연체료는 빼고 센다 */
const feeUntil=(k,d)=>[...new Set(BILLS.filter(i=>i.k===k).map(i=>i.ym))].reduce((a,ym)=>a+lateCalc(k,ym,d).fee,0);
/* 청구서에 들어간 연체료는 미납의 한 줄로 채워진다. 아직 청구 안 된 연체료는 「연체료 포함」을 고르면 상계일까지를
   연체료 청구 한 건으로 올리고 함께 상계한다. 고르지 않으면 다음 청구서에 들어간다 → 18-3 · 은행 입금은 청구된 금액만(18-4) */
function openOffset(k){
  const c=CTRS.find(c=>ckey(c)===k), a=arrears(c);
  pm={k,date:TODAY_S,amt:Math.min(a.due,ledgerOf(k).bal.임대보증금),how:'보증금상계',memo:'',fee:false};
  DRAWER='pay';render(true);
}
const numOf=v=>Math.max(0,parseInt(String(v).replace(/[^0-9]/g,''))||0);
function setPm(f,v){
  if(f==='amt') pm.amt=numOf(v); else pm[f]=v;
  /* 연체료 포함을 바꾸면 받을 금액을 정리할 돈에 다시 맞춘다 */
  if(f==='fee'){const n=payNeed()+(pm.fee?payFee():0); pm.amt=Math.min(n,ledgerOf(pm.k).bal.임대보증금);}
  render(true);
}
/* 배분 — 입금 매칭과 같은 규칙(4.3.1). 상계는 그 보증금이 걸린 이 계약에만 쓴다 */
const payKeys=()=>[pm.k];
/* 함께 상계하는 연체료 — 상계일까지 쌓인 금액. 확정하면 연체료 청구 한 건(비과세)이 되고 상계일이 정리일이다 → 18-3 */
const feeBills=(dep,real)=>!pm.fee?[]:payKeys().map(k=>({k,amt:feeUntil(k,pm.date)})).filter(x=>x.amt>0).map(x=>{const c=CTRS.find(y=>ckey(y)===x.k);
  return {id:`fee|${x.k}|${dep||'new'}`,ym:adYm(),k:x.k,no:c.no,n:'연체료',amt:x.amt,fee:true,feeTo:pm.date,date:pm.date,dep,
    memo:`연체료 (${pm.date.slice(5).replace('-','.')}까지) · 보증금 상계`,cut0:FEE_CUT[x.k]||null,...(real?{sq:++paySeq}:{})};});
const payFee=()=>payKeys().reduce((a,k)=>a+feeUntil(k,pm.date),0);
function payPlan(){return rcPlan(pm.amt,payKeys(),PAID,feeBills(),pm.date);}
const payNeed=()=>rcPlan(0,payKeys(),PAID,[],pm.date).all.reduce((s,l)=>s+l.due,0);
/* 마감한 달 날짜로는 상계를 기록하지 않는다 — 마감을 취소한 뒤 기록한다 → 12-3 */
const pmClosed=()=>closedBy(bOfK(pm.k),pm.date.slice(0,7),TODAY_S);
function payConfirm(){
  const pl=payPlan(); if(pl.rest>0||!pl.lines.length||pmClosed()) return;
  if(pm.amt>ledgerOf(pm.k).bal.임대보증금) return;
  const dep='m'+(++pmSeq), src=pm.how;   /* 날짜는 원장 날짜 칸에 있으니 이름에 붙이지 않는다 */
  /* 연체료를 함께 상계하면 먼저 청구로 올리고(상계일이 정리일) 같은 배분으로 채운다 */
  feeBills(dep,true).forEach(b=>{BILLS.push(b); FEE_CUT[b.k]=pm.date;});
  rcPlan(pm.amt,payKeys(),PAID,[],pm.date).lines.forEach(l=>addPay(l.id,l.pay,pm.date,src,dep));
  MANUAL_DEP.push({k:pm.k,date:pm.date,amt:pm.amt-pl.rest,dep,sq:++paySeq});
  DRAWER=null;pm=null;render(true);
}
/* 아직 청구 안 된 연체료 — 상계일까지. 함께 상계하거나 다음 청구서로 넘긴다 */
function feeNote(keys,d){
  const amt=keys.reduce((a,k)=>a+feeUntil(k,d),0);
  return amt?{amt}:null;
}
function payHTML(){
  if(DRAWER!=='pay'||!pm) return '';
  const c=CTRS.find(x=>ckey(x)===pm.k), bn=BUILDINGS.find(x=>x.id===c.b)||BUILDINGS[0];
  const a=arrears(c), pl=payPlan(), depBal=ledgerOf(pm.k).bal.임대보증금;
  const over=pm.amt>depBal;
  const many=new Set(pl.all.map(l=>l.k)).size>1;
  /* 정리할 돈 — 원장에 올라온 미납(청구서에 들어간 연체료 포함) + 함께 받는 연체료. 받으면 남는 돈 */
  const fn=feeNote(payKeys(),pm.date), withFee=pm.fee&&fn?fn.amt:0;
  const need=pl.all.reduce((s,l)=>s+l.due,0), leftDue=need-pl.lines.reduce((s,l)=>s+l.pay,0);
  const ok=pm.amt>0&&pl.lines.length&&!over;
  const tgt=Math.min(need,depBal);
  /* 미납 내역 — 청구년월마다 미납액 · 연체일수 · 연체료 */
  const ARs=payKeys().map(k=>arrears(CTRS.find(x=>ckey(x)===k))).filter(x=>x.months.length);
  const arDue=ARs.reduce((t,x)=>t+x.due,0), arFee=ARs.reduce((t,x)=>t+x.fee,0);
  return `<div class="dro"><div class="ov" onclick="closeDrawer()"></div><div class="pn">
    <div class="dh"><div><div class="t">보증금 상계</div>
      <div class="s">${cname(bn.alias,c.no,c.ten)}</div></div>
      <button class="x" onclick="closeDrawer()">✕</button></div>
    <div class="db">
      <div class="fg"><div class="fl">정리할 돈</div>
        <div class="fr"><span class="fk"><b>미납액 합계</b></span>
          <b style="font-size:15px">${won(need-withFee)}</b>${many?'<span class="c2">이 임차인의 이 건물 계약 전체</span>':''}
          ${pm.amt!==tgt?`<button class="btn sm" style="margin-left:auto" onclick="setPm('amt','${tgt}')">이 금액으로</button>`:''}</div>
        ${fn?`<div class="fr"><span class="fk">연체료<i class="tip" data-tip="아직 청구서에 들어가지 않은 연체료입니다. 연체료 포함을 고르면 상계일까지의 연체료가 청구로 올라가고 이번에 함께 상계합니다. 고르지 않으면 다음 청구서에 들어갑니다">i</i></span>
          <span>${won(fn.amt)}</span><span class="c2">${pm.date===TODAY_S?'오늘':pm.date.slice(5).replace('-','.')} 기준${feeStop(pm.k)?` · 연체료 중지 중(${feeStop(pm.k).slice(5).replace('-','.')}부터)`:''}</span></div>
        <div class="fr"><span class="fk">연체료 포함<i class="tip" data-tip="켜면 상계일까지의 연체료가 원장에 연체료 청구 한 줄(일반내역서 · 비과세)로 추가되고, 이번에 함께 상계합니다. 상계를 취소하면 그 청구도 함께 취소됩니다">i</i></span>
          <span style="cursor:pointer" onclick="setPm('fee',${!pm.fee})"><span class="cb ${pm.fee?'on':''}"></span></span>
          <span class="c2">${pm.fee?`확정하면 연체료 청구 ${won(fn.amt)}이 원장에 추가됩니다`:'켜면 연체료 청구가 추가됩니다'}</span></div>`:''}
      </div>
      <div class="fg"><div class="fl">보증금에서 뺄 돈</div>
        <div class="fr"><span class="fk">보증금 잔액</span><b style="color:var(--pri)">${won(depBal)}</b></div>
        <div class="fr"><span class="fk">상계일</span>
          <input type="date" value="${pm.date}" max="${TODAY_S}" onchange="setPm('date',this.value)"></div>
        ${pmClosed()?`<div class="hint" style="margin:-3px 0 9px 114px;color:var(--danger)">${+pm.date.slice(5,7)}월은 마감했습니다. 그 달 날짜의 상계는 월 마감을 취소한 뒤 기록합니다.</div>`:''}
        <div class="fr"><span class="fk">상계 금액<i class="tip" data-tip="미납 합계와 보증금 잔액 중 작은 쪽이 미리 들어갑니다. 이 계약의 미납에만 씁니다">i</i></span>
          <input type="text" inputmode="numeric" value="${pm.amt.toLocaleString('ko-KR')}" oninput="kwLive(this)" onchange="setPm('amt',this.value)" style="text-align:right"><span class="kw">${korWon(pm.amt)}</span></div>
        <div class="fr"><span class="fk">상계 후 보증금</span><b>${over?'—':won(depBal-pm.amt)}</b></div>
        ${leftDue?`<div class="fr"><span class="fk">상계 후 미납</span><span>${won(leftDue)}</span></div>`:''}
        <div class="fr"><span class="fk">메모</span>
          <input type="text" value="${pm.memo}" oninput="pm.memo=this.value"></div>
      </div>
      <div class="fg"><div class="fl">미납 내역</div>
        <div class="tbl" style="margin:0"><div class="schr unh hd"><div>청구년월</div><div class="n">미납액</div><div class="n">연체일수</div><div class="n">연체료</div></div>
        ${ARs.map(x=>x.months.slice().reverse().map(m=>`<div class="schr unh"><div class="nm">${many?`<span class="c2" style="margin:0 6px 0 0">${x.c.no}</span>`:''}${m.ym.slice(2).replace('-','.')}월분</div>
          <div class="n"><b>${m.due?won(m.due):'—'}</b></div><div class="n">${m.days?`${m.days}일`:'—'}</div><div class="n">${m.fee?won(m.fee):'—'}</div></div>`).join('')).join('')
          ||'<div class="empty">미납 청구가 없습니다</div>'}
        ${ARs.length?`<div class="schr unh sum"><div>합계</div><div class="n"><b>${won(arDue)}</b></div><div></div><div class="n"><b>${won(arFee)}</b></div></div>`:''}
        </div>
        ${pl.rest>0?`<div class="prev warn2" style="margin-top:10px"><div class="pt">남는 금액 ${won(pl.rest)}</div>미납액 합계보다 많습니다. 금액을 미납액 합계에 맞추세요.</div>`:''}
        ${over?`<div class="prev warn2" style="margin-top:10px"><div class="pt">보증금보다 많습니다</div>보증금 잔액 ${won(depBal)}까지만 뺄 수 있습니다.</div>`:''}
      </div>
    </div>
    <div class="df">
      <button class="btn" onclick="closeDrawer()">취소</button>
      <button class="btn pri" ${ok&&!pl.rest&&!pmClosed()?'':'disabled'} onclick="payConfirm()">상계 확정</button></div>
  </div></div>`;
}

/* ═══ 청구 추가 · 청구 감액 — 원장 탭 청구 ▾ 메뉴에서 각자 패널로 연다. 칸 순서는 같다 → CTR-3 ═══
   청구 추가: 항목명 · 발행 문서 · 금액 · 사유 → [메일 없이 발행] · [메일 보내고 발행]. 비정기 청구서 한 장(오늘 날짜 청구).
     메일은 정기 청구서와 같이 청구서 메일 담당자에게 간다(아무도 없으면 보내지 않는다) → 14-2 · 19-4
   청구 감액: 청구년월(최근 달이 위) → 그 달의 청구항목 → 금액 · 사유 → [감액 확정]. 고른 청구 건을 줄인다.
     원장 청구 줄의 ⋮ › 감액으로 열면 그 청구서를 고른 채로 열린다 — 몇 년 치 청구는 원장의 기간 필터 · 페이지로 찾는다.
     남은 금액이 있는 청구만 오른다
   실수는 지우지 않고 반대 방향으로 바로잡는다 — 잘못 낸 청구는 청구 감액, 잘못 한 감액은 청구 추가 */
let fz=null;
/* 감액할 수 있는 청구 — 이 계약의 발행한 청구 중 남은 금액이 있는 것(정기 · 비정기). 연체료도 줄인다 — 청구서에 들어간 연체료(일부 감면 · 18-2),
   해지 처리 · 보증금 상계에서 올린 연체료 청구(18-5 · 회수 포기 13-7)도 같다 → 14-3 */
const cutBills=k=>BILLS.filter(i=>i.k===k&&i.amt-cutOf(i.id)>0).sort((a,b)=>a.ym<b.ym?1:a.ym>b.ym?-1:(b.date||'')<(a.date||'')?-1:1);
const itemOfBill=i=>i.adhoc?i.n:i.n.split(' ')[0];
/* 감액 항목 — 청구 추가처럼 「항목을 고르세요」로 시작하고, 이 건물에서 감액을 많이 한 항목 순(같으면 배분 우선순위 순) */
const cutItems=k=>{const b=bOfK(k), n=x=>CUTS.filter(c=>bOfK(c.k)===b&&itemOfBill(BILLS.find(i=>i.id===c.id)||{n:c.n,adhoc:false})===x).length;
  return [...new Set(cutBills(k).map(itemOfBill))].map((x,i)=>({x,i,c:n(x),p:prioOf(x)})).sort((a,b)=>b.c-a.c||a.p-b.p||a.i-b.i).map(o=>o.x);};
const billsOfItem=(k,n)=>cutBills(k).filter(i=>itemOfBill(i)===n);
const cutYms=k=>[...new Set(cutBills(k).map(i=>i.ym))].sort().reverse();
const fxCands=()=>!fz||fz.mode!=='cut'?[]:fz.ids?cutBills(fz.k).filter(i=>fz.ids.includes(i.id)):fz.ym?cutBills(fz.k).filter(i=>i.ym===fz.ym):[];
const billLabel=i=>`${i.ym.slice(2).replace('-','.')}월분 ${i.n}`;
function fixOpen(k,mode){
  const m=mode||'add';
  if(m==='cut'&&!cutItems(k).length) return;
  fz={k,mode:m,ym:'',ids:null,item:'',id:'',name:'',pick:'',doc:'세금계산서',amt:0,why:''};DRAWER='fix';render(true);
}
/* 원장 청구 줄의 ⋮ › 감액 — 그 청구서를 고른 채로 연다. 오래된 청구는 원장에서 찾는다(기간 필터 · 페이지) */
const rowCutBills=x=>{const k=rowK(x), ids=x.items.map(r=>r.bill).filter(Boolean); return k?cutBills(k).filter(i=>ids.includes(i.id)):[];};
const rowK=x=>{const id=(x.items.find(r=>r.bill)||{}).bill, b=id&&BILLS.find(i=>i.id===id); return b?b.k:'';};
function fixOpenRow(key){const x=LEDG[key], C=x&&rowCutBills(x); if(!C||!C.length) return;
  fz={k:rowK(x),mode:'cut',ym:'',ids:C.map(i=>i.id),ttl:`${x.date.slice(2).replace(/-/g,'.')} · ${x.title}`,item:'',id:'',name:'',pick:'',doc:'세금계산서',amt:0,why:''};
  if(C.length===1){fz.id=C[0].id;fz.item=itemOfBill(C[0]);}
  DRAWER='fix';render(true);
}
/* 비정기 청구 항목명 — 자주 쓰는 이름을 고르거나 직접 넣는다. 이 건물에서 많이 쓴 순서로 보인다(같으면 아래 순서).
   발행 문서는 이름에 따라 바꾸지 않는다. 담당자가 고른다 */
const ONCE_NAMES=['엘리베이터 사용료','원상복구비','파손 수리비','위약금'];
const onceNames=k=>{const b=bOfK(k), n=x=>BILLS.filter(i=>i.adhoc&&bOfK(i.k)===b&&i.n===x).length;
  return ONCE_NAMES.map((x,i)=>({x,i,c:n(x)})).sort((a,b)=>b.c-a.c||a.i-b.i).map(o=>o.x);};
function fxSet(f,v){if(f==='pick'){fz.pick=v; fz.name=v==='직접 입력'?'':v; render(true); return;}
  fz[f]=f==='amt'?numOf(v):v;
  /* 항목 이름으로 고르면 그 항목의 가장 최근 청구(청구년월도 함께) */
  if(f==='item'){const C=fxCands(), b=C.find(i=>itemOfBill(i)===v)||billsOfItem(fz.k,v)[0];fz.id=b?b.id:'';if(b&&!fz.ids) fz.ym=b.ym;fz.amt=0;fz.all=false;}
  if(f==='ym'){fz.id='';fz.item='';fz.amt=0;fz.all=false;}
  if(f==='id'){const b=fxBill();fz.item=b?itemOfBill(b):'';fz.amt=0;fz.all=false;}
  render(true);}
const fxBill=()=>BILLS.find(x=>x.id===fz.id);
const fxName=()=>fz.mode==='add'?fz.name.trim():fz.item;
const fxDoc=()=>{if(fz.mode==='add') return fz.doc; const i=fxBill(); return !i?'세금계산서':i.fee?'일반내역서':i.adhoc?i.doc:itemDoc(CTRS.find(c=>ckey(c)===fz.k),itemOfBill(i));};
const fxLeft=()=>{const i=fxBill();return i?i.amt-cutOf(i.id):0;};
/* 청구 건의 공급가액 · 부가세 — 발행 때 나눈 값. 감액한 몫을 빼면 남은 공급가액 · 부가세다 */
const billSV=i=>{const tax=i.adhoc?i.doc==='세금계산서':!i.fee&&isTaxItem(i.n), sup=i.sup!=null?i.sup:tax?Math.floor(i.amt*10/11):i.amt;return {sup,vat:i.vat!=null?i.vat:i.amt-sup};};
const leftSV=i=>{const s=billSV(i), cs=CUTS.filter(x=>x.id===i.id), cp=cs.reduce((a,x)=>a+(x.sup!=null?x.sup:x.amt),0), ct=cs.reduce((a,x)=>a+x.amt,0);
  return {sup:s.sup-cp,vat:(i.amt-ct)-(s.sup-cp),amt:i.amt-ct};};
/* 남은 금액 전부 감액 — 원래 청구의 공급가액 · 부가세를 그대로 뺀다. 공급가액에 10%를 다시 붙이면 절사 때문에 1원이 남을 수 있다 → 확인요청 답변 질문 6 */
const fxV=()=>fz.mode==='cut'&&fz.all&&fxBill()?leftSV(fxBill()):vatSplit(fz.amt,fxDoc());
function fxOK(){const V=fxV();
  return (fz.all&&fz.mode==='cut'||fz.amt>0)&&!!fz.why.trim()&&!!fxName()&&(fz.mode==='add'||!!fxBill()&&V.amt<=fxLeft());}
function fxConfirm(mail){if(!fxOK()) return; const V=fxV();
  if(fz.mode==='cut') addCut(fz.id,V.amt,TODAY_S,fz.why.trim(),V.sup,V.vat);
  else {issueAdhoc(fz.k,fxName(),V.amt,fz.doc,fz.why.trim(),null,V.sup,V.vat);
    const to=billTo(CTRS.find(x=>ckey(x)===fz.k));
    if(mail===true&&to.length) clog(fz.k,'청구','발송',`비정기 청구서 메일 — ${fxName()} · ${to.map(x=>x.n).join(', ')}`);}
  DRAWER=null;fz=null;render(true);}
function fixHTML(){
  if(DRAWER!=='fix'||!fz) return '';
  const c=CTRS.find(x=>ckey(x)===fz.k), bd=BUILDINGS.find(x=>x.id===c.b)||BUILDINGS[0], cut=fz.mode==='cut';
  const R=(k,b,tip)=>`<div class="fr"><span class="fk">${k}${tip?`<i class="tip" data-tip="${tip}">i</i>`:''}</span>${b}</div>`;
  const V=fxV(), all=cut&&!!fz.all, tax=fxDoc()==='세금계산서', I=cut?fxBill():null, left=cut?fxLeft():0;
  const paid=I?paidNet(I.id):0, over=I?Math.max(0,paid-Math.max(0,left-V.amt))-Math.max(0,paid-left):0;
  const list=cut?(o=>fxCands().slice().sort((a,b)=>o.indexOf(itemOfBill(a))-o.indexOf(itemOfBill(b))))(cutItems(fz.k)):[];
  return `<div class="dro"><div class="ov" onclick="closeDrawer()"></div><div class="pn">
    <div class="dh"><div><div class="t">${cut?'청구 감액':'청구 추가'}</div><div class="s">${cname(bd.alias,c.no,c.ten)}</div></div>
      <button class="x" onclick="closeDrawer()">✕</button></div>
    <div class="db">
      <div class="fg"><div class="fl">청구</div>
        ${cut?(fz.ids?R('청구서',`<span class="fv">${fz.ttl}</span>`)
            :R('청구년월',`<select onchange="fxSet('ym',this.value)"><option value="" ${fz.ym?'':'selected'}>청구년월을 고르세요</option>${cutYms(fz.k).map(y=>`<option value="${y}" ${fz.ym===y?'selected':''}>${y.slice(2).replace('-','.')}월분</option>`).join('')}</select>`,'최근 달이 위에 있습니다. 오래된 청구는 원장에서 그 청구서 줄의 ⋮ › 감액으로 엽니다. 마감한 달의 청구도 줄일 수 있고, 감액은 오늘 날짜로 기록됩니다'))
          +(!list.length?'':R('청구항목',`<select onchange="fxSet('id',this.value)"><option value="" ${fz.id?'':'selected'}>항목을 고르세요</option>${list.map(i=>`<option value="${i.id}" ${i.id===fz.id?'selected':''}>${itemOfBill(i)}${list.filter(j=>itemOfBill(j)===itemOfBill(i)).length>1?` · ${i.adhoc?'비정기':'정기'} · ${won(i.amt-cutOf(i.id))}`:''}</option>`).join('')}</select>`,'줄일 금액이 남은 항목만 보입니다'))
          +(I?R('청구액',won(I.amt)+(cutOf(I.id)?` <span class="c2">감액 ${won(cutOf(I.id))}</span>`:''))+R('낸 금액',won(paid))+R('발행 문서',`<span class="fv">${fxDoc()}</span>`):'')
          :R('항목명',`<select onchange="fxSet('pick',this.value)"><option value="" ${fz.pick?'':'selected'}>항목을 고르세요</option>${onceNames(fz.k).map(x=>`<option ${fz.pick===x?'selected':''}>${x}</option>`).join('')}<option ${fz.pick==='직접 입력'?'selected':''}>직접 입력</option></select>`)
            +(fz.pick==='직접 입력'?R('',`<input type="text" value="${fz.name}" placeholder="예: 7월 전기요금 정정" onchange="fxSet('name',this.value)">`):'')
            +R('발행 문서',`<select onchange="fxSet('doc',this.value)">${ONCE_DOC.map(d=>`<option ${fz.doc===d?'selected':''}>${d}</option>`).join('')}</select>`,'세금계산서면 공급가액에 부가세 10%가 붙습니다')}</div>
      <div class="fg"><div class="fl">${cut?'줄일 돈':'받을 돈'}</div>
        ${cut&&I?R('남은 금액 전부',`<label style="display:flex;align-items:center;gap:6px"><input type="checkbox" ${all?'checked':''} onchange="fxSet('all',this.checked)">남은 청구액 ${won(left)} 전부 감액</label>`,'원래 청구의 공급가액 · 부가세를 그대로 뺍니다. 공급가액을 넣어 전부 줄이면 부가세 원 미만 절사 때문에 1원이 남을 수 있습니다'):''}
        ${R(tax?'공급가액':'금액',all?`<span class="fv">${won(V.sup)}</span>`:`<input type="text" inputmode="numeric" value="${fz.amt?num(fz.amt):''}" placeholder="${tax?'부가세 제외':'부가세 없음'}" oninput="kwLive(this)" onchange="fxSet('amt',this.value)" style="text-align:right"><span class="kw">${korWon(fz.amt)}</span>`,
          tax?'세금계산서 항목은 공급가액을 넣습니다. 부가세 10%가 자동으로 붙습니다':'계산서 · 일반내역서 항목은 부가세가 없습니다')}
        ${tax&&(fz.amt||all)?R('부가세',`<span class="fv">${won(V.vat)}</span>`)+R('합계',`<b>${won(V.amt)}</b>`):''}

/* ═══ 청구 약정(PAY-3) — 계약 상세 요약 탭의 임대정보 · 임대료 인상 예약 카드와 오른쪽 패널 ═══ */
/* 반복 주기 — 우리 건물은 매월뿐이지만 다른 운영사는 분기·연 1회 받는 항목이 있다 */
const ITEM_CYCLES=['매월','격월','분기','반기','연1회'];   /* 반복주기 → 3.3. 「이번만」은 계약 상세의 청구 추가가 맡는다 */
/* 이번 회차 대상인지 — 기산일이 속한 달부터 반복 주기마다 */
function cycleDue(cycle,from,ym){
  const [fy,fm]=from.slice(0,7).split('-').map(Number), [y,m]=ym.split('-').map(Number), diff=(y-fy)*12+(m-fm);
  return diff>=0&&diff%({매월:1,격월:2,분기:3,반기:6,'연1회':12}[cycle]||1)===0;
}
/* 항목의 기산일 — 렌트프리 대상이면 기산일, 아니면 계약시작일. 항목에 따로 정했으면 그것 */
function itemFrom(c,n){
  const mt=(c.meta||{})[n]||{};
  if(mt.from) return mt.from;
  if(c.rf&&c.from){const inRf=n==='임대료'?c.rf.rent:n==='고정관리비'?c.rf.mgmt:c.rf.vars; return inRf?c.from:c.base;}
  return c.from||c.base;
}
/* 임대료 인상 예약 — 적용일이 속한 달부터 새 금액(부가세 포함 → 공급가액). 달 중간 일할은 명세 4.2.7, 목업은 달 단위 */
function adjSup(c,n,sup,ym){
  const f=n==='임대료'?'rent':n==='고정관리비'?'mgmt':null;
  if(!f||!c.adj) return sup;
  const a=c.adj.filter(x=>x[f]&&x.d.slice(0,7)<=ym).sort((p,q)=>p.d<q.d?-1:1).pop();
  return a?Math.floor(a[f]*10/11):sup;
}
/* 고정액의 부가세 — 공급가액의 10%, 원 미만 절사(확인요청 답변 확인 3).

function adjVat(c,n,sup0,ym){const s=adjSup(c,n,sup0,ym);

  if(a) return a[f]-s;

/* ═══ 재계약(CTR-4) — 기존 계약을 복사해 연장 계약을 미리 등록한다 → 명세변경 1
   시작일은 기존 종료일 다음 날로 고정. 시작 전에는 준비중이며 재계약 취소로 지울 수 있다.
   임대료 인상 예약만 복사하지 않는다. 보증금 승계 · 등록 차량 적용은 시작일에 한다 ═══ */
const rnAdd=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10);};
/* 재계약하는 달 — 청구서는 한 장. 금액이 그대로거나 1일 시작이면 일할 없음, 바뀌면 시작일 기준으로 나눈다(4.2.7과 같은 계산) */
function rnwMonth(oldInc,newInc,start){
  const [y,m,d]=start.split('-').map(Number), days=new Date(Date.UTC(y,m,0)).getUTCDate(), mm=String(m).padStart(2,'0'), p=v=>String(v).padStart(2,'0');
  if(oldInc===newInc||d===1) return {split:false,lines:[{lb:'',amt:newInc}],tot:newInc};
  const a=Math.floor(oldInc*(d-1)/days), b=Math.floor(newInc*(days-d+1)/days);
  return {split:true,lines:[{lb:`(${mm}.01~${mm}.${p(d-1)})`,r:`${d-1}/${days}일`,amt:a},{lb:`(${mm}.${p(d)}~${mm}.${days})`,r:`${days-d+1}/${days}일`,amt:b}],tot:a+b};
}

/* 계약정보 카드의 더보기 — 요약 탭 카드는 모두 오른쪽 위 ⋮ 하나에 할 일을 넣는다 → 3.8 */
function ctrMore(c,k,pre=[]){

/* ═══ 계약 해지 — 해지일(명도일 · 이사일)에 받을 돈이 모두 원장에 청구돼 있어야 한다. 그날 보증금 상계 · 반환으로 끝낸다

   목업은 계약상태를 바꾸지 않는다. 청구 계산은 카리나빌딩 · 이번 회차(8월) 해지만 한다 ═══ */
const TERM_TYPES=['만기 종료','중도 해지(합의)','중도 해지(위반·분쟁)'];

const vatNote=(a,doc)=>{const V=vatSplit(numOf(a),doc);return doc==='세금계산서'&&V.sup?`<span class="c2" style="margin:0">+ 부가세 ${won(V.vat)} = ${won(V.amt)}</span>`:'';};

/* 정산 항목 카드 — 정기 청구서처럼 건물 관리비 탭에서 쓰는 항목을 모두 올린다. 담당자는 금액을 넣거나 체크를 풀어 뺀다.
   청구 전 기간 = 「마지막으로 정기 청구서에 실은 정산 기간의 다음날 ~ 해지일」. 그 몫을 퇴거 예상분으로 받는다 → 확인요청 답변 질문 2-2 · 9

     기간을 모르는 항목        이번 회차에 고지서가 없는 항목(정화조청소비 등) — 기간 없이 금액만

function unbilled(c,out,mode){

  const bd=BUILDINGS.find(x=>x.id===c.b)||{}, names=(bd.charge||[]).filter(x=>x.use&&!x.fixed).map(x=>x.it);
  return names.map(n=>{const code=codeOf(n), m=M(code); if(!m||m.name!==n) return null; const rf=resolve(code).ref;
    if(isDirect(code)){if(mode!=='now') return null; const from=out.slice(0,8)+'01'; return {code,n,from,to:out,days:daysIn(from,out),doc:m.bill};}
    const P=BILL[code]&&BILL[code].to?BILL[code]:rf&&BILL[rf]&&BILL[rf].to?BILL[rf]:null;
    if(!P) return {code,n,from:null,to:out,days:0,doc:m.bill};

/* 해지 처리로 바뀌는 고정액 — 발행한 청구 건과 일할 청구의 공급가액 · 부가세 차이를 그대로 뺀다(10%를 다시 붙이지 않는다) → 질문 1 */
function termCuts(k,out,inp){if(!ISS[k]) return [];
  return termFix(k,out,inp).filter(f=>f.b&&f.amt<f.b.amt).map(f=>{const b=f.b, amt=b.amt-f.amt, left=b.amt-cutOf(b.id);

/* 해지 처리로 바뀌는 연체료 — 정리일 다음날 ~ 해지일은 연체료 청구 한 건. 해지일이 정리일보다 앞이면 이미 넣은 해지일 뒤 날짜를 감액 */
function termFee(k,out){const cut=FEE_CUT[k];
  if(!cut||dnum(out)>dnum(cut)) return {add:feeUntil(k,out),less:0};
  const z=ISS[k]||{}, s=FEE_CUT[k]; if(z.cut) FEE_CUT[k]=z.cut; else delete FEE_CUT[k]; const upto=feeUntil(k,out); FEE_CUT[k]=s;
  return {add:0,less:Math.max(0,(z.feeAll||0)-upto),cut};}
/* 해지 달 고정액(임대료 · 고정관리비) — 시스템이 1일 ~ 해지일 일할을 기본값으로 채우고, 담당자가 고칠 수 있다.
   금액은 공급가액이다(청구 추가 · 퇴거 예상분과 같다). 기본값 그대로면 일할 계산의 부가세를, 고치면 10%(원 미만 절사)를 붙인다 → 4.2.3 · 질문 1 · 13 */

/* ═══ CTR-3 계약 원장 — 이 계약의 모든 돈 거래를 있는 그대로. 추가만 하고 고치지 않는다 ═══ */
let f3={per:'',tp:''};

const f3Range=()=>[f3.per?new Date((dnum(TODAY_S)-({'1':30,'3':91,'12':365}[f3.per]))*864e5).toISOString().slice(0,10):null,null];
/* 거래유형 필터 — 고른 유형과 그 취소 줄을 함께 보인다(수납 → 수납 · 수납 취소). 잔액 칸은 거르기 전 원장 그대로 */
const F3TP=['청구','감액','수납','환불','보증금 예치','보증금 상계','보증금 반환'];
const setF3=(k,v)=>{f3[k]=v;render();};
/* 연체료는 비과세(일반내역서) → 4.4.3 */
const isTaxItem=n=>{if(n==='연체료') return false; const m=MASTER.find(x=>x.name===n.split(' ')[0]);return m?isTax(m.bill):true;};
function ledgerOf(k){
  const c=CTRS.find(x=>ckey(x)===k), rows=[];
  const rent=((c.it||[]).find(x=>x[0]==='임대료')||[])[1]||0;
  /* 보증금 — 목업 예시값(월 임대료 × 10) */
  /* 새로 등록한 계약은 보증금을 아직 받지 않았다 — 받으면 보증금 예치로 기록한다 */
  if(!c.fresh) rows.push({date:c.base,type:'보증금 예치',acc:'임대보증금',memo:'계약 보증금 (예시값)',item:'계약 보증금 (예시값)',g:'dep',k,inc:rent*10,sup:null,vat:null,ord:0});
  BILLS.filter(i=>i.k===k).forEach(i=>{
    const tax=i.adhoc?i.doc==='세금계산서':isTaxItem(i.n), sup=i.sup!=null?i.sup:tax?Math.floor(i.amt*10/11):i.amt;
    const ymL=i.ym.slice(2).replace('-','.')+'월분';
    rows.push({date:i.date||billOn(i.ym),type:'청구',acc:'매출채권',memo:i.adhoc?i.n:i.memo||`${ymL} ${i.n}`,item:i.adhoc?i.n:i.memo||`${ymL} ${i.n}`,bid:i.fee?null:i.id,bill:i.id,
      g:i.inv?i.inv:i.reg?'bill'+i.ym:i.fee?'fee'+i.id:i.adhoc?'adh'+i.id:'bill'+i.ym,ym:i.ym,ttl:i.ttl||(i.adhoc?i.n:i.memo),why:i.adhoc?i.memo:'',
      inc:i.amt,sup,vat:i.vat!=null?i.vat:i.amt-sup,ord:1,pr:prioOf(i.n.split(' ')[0]),sq:i.sq});
    (PAYEV[i.id]||[]).filter(e=>!e.dep.startsWith('cr')).forEach(e=>rows.push({date:e.date,type:'수납',acc:'매출채권',
      memo:`${i.fee?'연체료':ymL+' '+i.n} ← ${e.src}`,item:i.fee?'연체료':`${ymL} ${i.n}`,src:e.src,g:'pay'+e.dep,dec:e.amt,sup:null,vat:null,ord:2,pr:prioOf(i.n.split(' ')[0]),
      hand:e.dep.startsWith('m'),sq:e.sq}));
  });
  /* 감액 — 받을 돈을 줄인다(대변). 이미 낸 청구라면 잔액이 0보다 작아져 과납이 된다 → CTR-3 */
  CUTS.filter(x=>x.k===k).forEach(x=>{const b=BILLS.find(y=>y.id===x.id)||{}, tax=b.adhoc?b.doc==='세금계산서':isTaxItem(x.n), sup=x.sup!=null?x.sup:tax?Math.floor(x.amt*10/11):x.amt, t=`${x.ym.slice(2).replace('-','.')}월분 ${x.n} 감액`;
    /* 넘친 수납을 과납으로 돌리는 일은 잔액을 바꾸지 않으므로 원장에 적지 않는다 → 2.7 */
    rows.push({date:x.date,type:'감액',acc:'매출채권',memo:t,item:t,why:x.why,g:'cut'+x.sq,dec:x.amt,sup,vat:x.amt-sup,ord:2.2,sq:x.sq});});
  /* 남은 입금 — 청구 건 없이 이 계약에 수납으로 기록한다(과납) → 4.3.4 */
  Object.entries(RC.dec).forEach(([no,x])=>{const d=x.done;if(!d||!(d.rest>0)||d.ok!==k) return;
    rows.push({date:d.dt.slice(0,10),type:'수납',acc:'매출채권',memo:`과납 ← ${d.dt.slice(11,19)} ${d.name}`,item:'과납 (배분할 청구 없음)',src:`${d.dt.slice(11,19)} ${d.name}`,
      g:'payd'+no,dec:d.rest,sup:null,vat:null,ord:2,sq:d.sq});});
  /* 이월 미납액에 들어온 수납 — 실제로 들어온 돈이라 원장에 적는다 → 4.3.6 */
  MC_YMS.filter(v=>closeOn(c.b,v)).forEach(v=>{const vL=v.slice(2).replace('-','.')+'월분';
    (PAYEV[carryId(k,v)]||[]).forEach(e=>rows.push({date:e.date,type:'수납',acc:'매출채권',memo:`이월 미납액 ← ${e.src}`,item:'이월 미납액',src:e.src,

    /* 미납 이월 자체는 잔액을 바꾸지 않으므로 원장에 적지 않는다 → 2.7 */});
  /* 전월 과납액을 새 청구에 배분한 일은 잔액을 바꾸지 않으므로 원장에 적지 않는다(아래 PAYEV에서도 뺀다) → 2.7 */
  /* 과납 환불 — 돌려준 돈(차변) */
  REFUNDS.filter(x=>x.k===k).forEach(x=>rows.push({date:x.date,type:'환불',acc:'매출채권',memo:`과납 환불${x.acct?' · '+x.acct:''}`,item:`과납 환불${x.acct?' · '+x.acct:''}`,

  MANUAL_DEP.filter(m=>m.k===k).forEach(m=>rows.push({date:m.date,type:'보증금 상계',acc:'임대보증금',

  /* 취소한 비정기 청구 · 감액 — 원래 줄은 그대로 두고(취소됨 표시) 취소 줄을 더한다. 잔액은 서로 지워진다 */
  CANCELS.filter(x=>x.kind==='pay').forEach(x=>{const r=x.rec;
    r.ev.forEach(e=>{const b=BILLS.find(i=>i.id===e.id)||(CANCELS.find(y=>y.kind==='adh'&&y.rec.id===e.id)||{}).rec, kk=b?b.k:e.id.split('|')[1]; if(kk!==k) return;
      const it=b?(b.fee?'연체료':b.adhoc?b.n:`${b.ym.slice(2).replace('-','.')}월분 ${b.n}`):'이월 미납액';
      rows.push({date:e.date,type:'수납',acc:'매출채권',memo:`${it} ← ${e.src}`,item:it,src:e.src,g:'pay'+r.dep,dec:e.amt,sup:null,vat:null,ord:2,hand:true,sq:e.sq,cxd:x});
      rows.push({date:x.date,type:'수납 취소',acc:'매출채권',memo:`${it} 수납 취소`,item:`${it} 수납 취소`,why:x.why,g:'cx'+x.sq,inc:e.amt,sup:null,vat:null,ord:2.3,sq:x.sq});});

      rows.push({date:r.md.date,type:'보증금 상계',acc:'임대보증금',memo:'미납액 정리',item:'미납액 정리',g:'dd'+r.dep,dec:r.md.amt,sup:null,vat:null,ord:2,sq:r.md.sq,cxd:x});
      rows.push({date:x.date,type:'보증금 상계 취소',acc:'임대보증금',memo:'보증금 상계 취소',item:'보증금 상계 취소',why:x.why,g:'cxd'+x.sq,inc:r.md.amt,sup:null,vat:null,ord:2.3,sq:x.sq});}});
  CANCELS.filter(x=>x.kind!=='pay'&&x.rec.k===k).forEach(x=>{const r=x.rec;

  if(x.g.startsWith('rf')){const r=REFUNDS.find(d=>'rf'+d.sq===x.g);return r?{kind:'rf',rec:r}:null;}

document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('.tip'),bx=document.querySelector('#tipbox');
  if(!t){bx.style.display='none';return;}
  const r=t.getBoundingClientRect();bx.textContent=t.dataset.tip;bx.style.display='block';
  bx.style.left=Math.max(8,Math.min(r.left-6,innerWidth-bx.offsetWidth-8))+'px';
